[workspace]
members = ["apps/qz-job"]
resolver = "2"

[workspace.package]
version = "2.0.0-dev.1"
edition = "2021"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/zhengui666/QuaZonai"

[workspace.dependencies]
pyo3 = { version = "=0.25.1", features = ["auto-initialize"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
