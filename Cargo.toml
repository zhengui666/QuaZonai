[workspace]
members = ["apps/job", "crates/contracts", "crates/domain", "crates/store", "crates/integrations", "apps/server", "apps/runtime"]
resolver = "2"

[workspace.package]
version = "2.0.0-dev.1"
edition = "2021"
rust-version = "1.98.1"
license-file = "LICENSE"
repository = "https://github.com/zhengui666/QuaZonai"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sqlx = { version = "=0.9.0", default-features = false }
