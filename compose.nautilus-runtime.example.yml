name: quazonai-nautilus-runtime

services:
  nautilus-runtime:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nautilus-runtime
    environment:
      QUAZONAI_NAUTILUS_RUNTIME_TOKEN: ${QUAZONAI_NAUTILUS_RUNTIME_TOKEN:?configure a service token}
      QUAZONAI_NAUTILUS_CATALOG_ROOT: /var/lib/quazonai-nautilus/catalogs
      QUAZONAI_NAUTILUS_HOST: 0.0.0.0
      QUAZONAI_NAUTILUS_PORT: 9010
    ports:
      - "127.0.0.1:${QUAZONAI_NAUTILUS_PORT:-9010}:9010"
    volumes:
      - nautilus-catalogs:/var/lib/quazonai-nautilus/catalogs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  nautilus-catalogs:
