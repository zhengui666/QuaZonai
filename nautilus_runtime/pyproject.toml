[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quazonai-nautilus-gateway"
version = "0.1.0"
description = "Remote NautilusTrader research runtime for QuaZonai"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "nautilus_trader==1.231.0",
  "pandas>=2.2,<3",
  "pyarrow>=25,<26",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
quazonai-nautilus-gateway = "quazonai_nautilus_gateway.app:run"
quazonai-nautilus-sealed-provision = "quazonai_nautilus_gateway.provision:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["quazonai_nautilus_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
