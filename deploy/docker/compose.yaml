services:
  database:
    image: ${DATABASE_IMAGE:?release manifest is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: quazonai
      POSTGRES_USER: quazonai
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?deployment secret is required}
    ports:
      - "127.0.0.1:${DATABASE_PORT:?}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  app:
    image: ${APP_IMAGE:?release manifest is required}
    user: "${HOST_UID:?}:${HOST_GID:?}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    working_dir: ${INSTALL_DIR:?}/data
    environment:
      DATABASE_URL: postgresql://quazonai:${DATABASE_PASSWORD:?}@database:5432/quazonai
      STATE_DIR: ${INSTALL_DIR:?}/data/state
      HOME: ${NATIVE_HOME:?}
      CODEX_HOME: ${NATIVE_CODEX_HOME:?}
      BIND: 127.0.0.1:8080
      PUBLIC_URL: http://localhost:${WEB_PORT:?}
      DEVELOPMENT_HTTP: 'true'
      RUNTIME_TARGETS: ${RUNTIME_TARGETS:-[]}
      DOWNSTREAM_TARGETS: ${DOWNSTREAM_TARGETS:-[]}
    ports:
      - "127.0.0.1:${WEB_PORT:?}:8081"
    volumes:
      - type: bind
        source: ${INSTALL_DIR:?}/data
        target: ${INSTALL_DIR:?}/data
        bind: {create_host_path: false}
      - type: bind
        source: ${NATIVE_CODEX_HOME:?}
        target: ${NATIVE_CODEX_HOME:?}
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    networks: [application]
    depends_on:
      database: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  application:
    driver: bridge
volumes:
  postgres:
