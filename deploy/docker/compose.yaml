services:
  # Retained for original PostgreSQL archives. No application SQL migration runs.
  database:
    image: ${DATABASE_IMAGE:?release manifest is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: quazonai
      POSTGRES_USER: quazonai
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?deployment secret is required}
    ports:
      - "127.0.0.1:${DATABASE_PORT:?}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  app:
    image: ${APP_IMAGE:?release manifest is required}
    user: "${HOST_UID:?}:${HOST_GID:?}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    working_dir: ${INSTALL_DIR:?}/data
    environment:
      HOME: ${INSTALL_DIR:?}/data/home
      QZ_CONFIG: ${INSTALL_DIR:?}/data/service.json
      QZ_RESEARCH_PROVIDER_ENV: ${INSTALL_DIR:?}/data/research/provider.env
      QZ_JOB_BINARY: /opt/quazonai/bin/job
      QZ_SCRATCH_DIR: /tmp
      TMPDIR: /tmp
    ports:
      - "127.0.0.1:${WEB_PORT:?}:8080"
    volumes:
      - type: bind
        source: ${INSTALL_DIR:?}/data
        target: ${INSTALL_DIR:?}/data
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    networks: [application]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  application:
    driver: bridge
volumes:
  postgres:
