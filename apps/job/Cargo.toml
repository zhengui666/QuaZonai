[package]
name = "job"
default-run = "job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
# Optional official node observer and controlled Sandbox Paper host.
native-node-observer = ["dep:nautilus-live", "dep:tokio", "tokio/time"]
native-sandbox-test = ["native-node-observer", "dep:nautilus-sandbox"]
native-paper = ["native-node-observer", "dep:nautilus-sandbox", "dep:nautilus-binance", "dep:axum", "dep:reqwest", "tokio/net", "tokio/sync", "tokio/signal"]
native-paper-test = ["native-paper"]
# Operator data preparation only; default scientific job images remain offline.
polymarket-history = ["dep:tokio", "dep:parquet", "dep:sha2", "dep:nautilus-data", "dep:alloy-core", "dep:url"]
catalog-prepare = ["dep:sha2", "dep:rc-zip", "dep:winnow", "dep:flate2", "dep:crc32fast", "dep:csv"]
# Offline parsing of already supplied source files through the official adapter.
# The upstream crate has network dependencies; QZ exposes no Hyper network caller.
hyperliquid-offline = ["dep:nautilus-hyperliquid"]

[[bin]]
name = "catalog-prepare"
path = "src/bin/catalog-prepare.rs"
required-features = ["catalog-prepare"]

[[bin]]
name = "polymarket-history"
path = "src/bin/polymarket-history.rs"
required-features = ["polymarket-history"]

[[bin]]
name = "source-tools"
path = "src/bin/source-tools.rs"
required-features = ["catalog-prepare", "polymarket-history"]

[dependencies]
nautilus-hyperliquid = { version = "=0.63.0", default-features = false, optional = true }
nautilus-live = { version = "=0.63.0", default-features = false, features = ["node"], optional = true }
nautilus-sandbox = { version = "=0.63.0", default-features = false, optional = true }
nautilus-binance = { version = "=0.63.0", default-features = false, optional = true }
axum = { version = "=0.8.9", optional = true }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"], optional = true }
tempfile = "=3.27.0"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "=0.4.45", features = ["serde"] }
clarabel = "=0.11.1"
nautilus-backtest = { version = "=0.63.0", default-features = false }
nautilus-analysis = { version = "=0.63.0", default-features = false }
nautilus-common = { version = "=0.63.0", default-features = false }
nautilus-core = { version = "=0.63.0", default-features = false }
nautilus-execution = { version = "=0.63.0", default-features = false }
nautilus-portfolio = { version = "=0.63.0", default-features = false }
nautilus-persistence = { version = "=0.63.0", default-features = false }
nautilus-indicators = { version = "=0.63.0", default-features = false }
nautilus-polymarket = { version = "=0.63.0", default-features = false }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"], optional = true }
parquet = { version = "=59.3.0", default-features = false, features = ["zstd"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
# Public typed classic-ZIP parsing; winnow 0.5.40 supplies rc-zip's literal API.
rc-zip = { version = "=5.4.1", default-features = false, optional = true }
winnow = { version = "=0.5.40", optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"], optional = true }
crc32fast = { version = "=1.5.2", optional = true }
csv = { version = "=1.4.0", optional = true }
nautilus-data = { version = "=0.63.0", default-features = false, optional = true }
alloy-core = { version = "=1.7.3", default-features = false, features = ["std", "sol-types", "serde"], optional = true }
url = { version = "=2.5.8", optional = true }
rust_decimal = "=1.42.1"
nautilus-model = { version = "=0.63.0", default-features = false }
nautilus-trading = { version = "=0.63.0", default-features = false }
anyhow = "=1.0.104"
clap = { version = "=4.5.46", features = ["derive"] }
contracts = { path = "../../crates/contracts" }
domain = { path = "../../crates/domain" }
bigdecimal = "=0.4.8"
iso_currency = "=0.7.0"
rustix = { version = "=1.1.4", features = ["fs"] }
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
ndarray = "=0.17.1"
ndarray-stats = "=0.7.0"
linregress = "=0.5.4"
# Explicit portable dispatch avoids relying on tail-call optimization in debug builds.
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "deterministic", "portable-dispatch"] }

[dev-dependencies]
async-trait = "=0.1.92"
arrow-array = "=56.2.0"
nautilus-model = { version = "=0.63.0", default-features = false, features = ["test-support"] }
wat = "=1.258.0"

[[example]]
name = "browser_catalog_fixture"
required-features = ["catalog-prepare"]

[[example]]
name = "native_client_account_snapshots"
required-features = ["native-sandbox-test"]

[[test]]
name = "native_sandbox_observer"
required-features = ["native-sandbox-test"]

[[test]]
name = "native_paper_target"
required-features = ["native-paper-test"]
