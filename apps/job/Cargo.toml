[package]
name = "job"
default-run = "job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Optional official node observer and controlled Sandbox integration.
native-node-observer = ["dep:nautilus-live", "dep:tokio", "tokio/time"]
native-sandbox-test = ["native-node-observer", "dep:nautilus-sandbox"]
# Persistent account execution inside the existing remote native process.
account-runtime = ["native-sandbox-test", "dep:nautilus-hyperliquid", "dep:nautilus-system", "nautilus-hyperliquid/high-precision", "high-precision"]
# Operator data preparation only; default scientific job images remain offline.
catalog-prepare = ["dep:sha2"]
high-precision = ["nautilus-persistence/high-precision", "nautilus-data?/high-precision"]
market-history = ["dep:tokio", "parquet/snap", "dep:csv", "dep:lz4_flex", "dep:nautilus-hyperliquid", "dep:nautilus-data", "high-precision"]
# Offline parsing of already supplied source files, separate from public history acquisition.
hyperliquid-offline = ["dep:nautilus-hyperliquid"]

[[bin]]
name = "market-history"
path = "src/bin/market-history.rs"
required-features = ["market-history"]

[[bin]]
name = "catalog-prepare"
path = "src/bin/catalog-prepare.rs"
required-features = ["catalog-prepare"]

[[bin]]
name = "source-tools"
path = "src/bin/source-tools.rs"
required-features = ["catalog-prepare"]

[[bin]]
name = "account-runtime"
path = "src/bin/account-runtime.rs"
required-features = ["account-runtime"]

[dependencies]
ahash = { version = "=0.8.12", features = ["serde"] }
async-trait = "=0.1.92"
bytes = { version = "=1.12.1", features = ["serde"] }
ustr = "=1.1.0"
indexmap = "=2.14.2"
nautilus-hyperliquid = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, optional = true }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, features = ["node"], optional = true }
nautilus-sandbox = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, optional = true }
tempfile = "=3.27.0"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "=0.4.45", features = ["serde"] }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, features = ["streaming"] }
nautilus-analysis = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, features = ["indicators"] }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-indicators = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-risk = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"], optional = true }
# Native Parquet decoding uses the exact Arrow family of the official catalog.
arrow-native = { package = "arrow-array", version = "=59.3.2" }
parquet = { version = "=59.3.2", default-features = false, features = ["arrow", "zstd"] }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, features = ["arrow"] }
sha2 = { version = "=0.10.9", optional = true }
csv = { version = "=1.4.0", optional = true }
lz4_flex = { version = "=0.14.0", optional = true }
zstd = { version = "=0.13.3", default-features = false }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, optional = true }
rust_decimal = "=1.43.0"
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, features = ["examples"] }
anyhow = "=1.0.104"
clap = { version = "=4.5.46", features = ["derive"] }
contracts = { path = "../../crates/contracts" }
domain = { path = "../../crates/domain" }
bigdecimal = "=0.4.8"
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
iso_currency = "=0.7.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "stdio"] }


[build-dependencies]
toml = "=1.1.8"

[dev-dependencies]
nautilus-system = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false }
async-trait = "=0.1.92"
arrow-array = "=56.2.0"
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7", default-features = false, features = ["test-support"] }
wat = "=1.258.0"

[[example]]
name = "native_client_account_snapshots"
required-features = ["native-sandbox-test"]

[[test]]
name = "native_sandbox_observer"
required-features = ["native-sandbox-test"]

[dependencies.nautilus-system]
git = "https://github.com/nautechsystems/nautilus_trader.git"
rev = "634e09456c949f488b2bfcf6b6897b33cbf218d7"
default-features = false
optional = true
