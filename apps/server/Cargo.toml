[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
# Explicit native-binary acceptance; CI installs and executes the pinned binary.
native-codex = []
# Real Docker-backed Codex acceptance; unavailable Docker is a test failure.
codex-container = []
# Integration requiring the separately built production Job executable.
native-science = ["native-codex"]

[dependencies]
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
futures-util = "=0.3.34"
contracts = { path = "../../crates/contracts" }
domain = { path = "../../crates/domain" }
store = { path = "../../crates/store" }
integrations = { path = "../../crates/integrations" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "=0.8.9", features = ["macros"] }
tokio = { version = "=1.53.1", features = ["full"] }
tower-sessions = { version = "=0.15.0", default-features = false, features = ["axum-core", "private"] }
# Official SQLx 0.9 adapter; replace the fixed revision when a compatible crate is released.
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores", rev = "d18c9bf76f1d4fb73130dbe5aa643197f14b5d2d", features = ["postgres"] }
clap = { version = "=4.5.46", features = ["derive", "env"] }
chrono = { version = "=0.4.45", features = ["serde"] }
time = "=0.3.55"
url = "=2.5.8"
utoipa = { version = "=5.4.0", features = ["chrono", "uuid"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "json"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "=0.2.3"
rpassword = "=7.4.0"

[dev-dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
uuid = "=1.26.0"
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
tower = { version = "=0.5.2", features = ["util"] }
tempfile = "=3.27.0"
rmcp = { version = "=3.2.0", default-features = false, features = ["client"] }

[[test]]
name = "native_science_thread"
path = "tests/native_science_thread.rs"
required-features = ["native-science"]
