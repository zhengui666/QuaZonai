[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfoundry"
version = "0.1.0"
description = "API-only quantitative research and live-trading control plane"
readme = {text = "QuantFoundry control plane.", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.18,<2",
  "cryptography>=46,<47",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<1",
  "packaging>=25,<27",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uv==0.10.7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
research = [
  "optuna==4.9.0",
  "pyarrow==25.0.1",
]
trading = [
  "nautilus-trader==2.0.0rc3",
]
mcp = [
  "mcp==2.0.0",
  "PyJWT[crypto]>=2.13,<3",
]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[project.scripts]
qf = "quantfoundry.cli.main:main"
qf-finite-worker = "quantfoundry.runners.finite_worker:main"
qf-live-supervisor = "quantfoundry.runners.live_supervisor:main"
qf-mcp-gateway = "quantfoundry.mcp.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
files = ["src/quantfoundry"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = [
  "quantfoundry.runners.plugin_jobs",
  "quantfoundry.runners.research_jobs",
]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["quantfoundry.runners.live"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
