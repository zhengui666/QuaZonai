[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quazonai"
version = "0.1.0"
description = "Autonomous quantitative research intelligence and portfolio construction workbench"
readme = {text = "QuaZonai research intelligence and portfolio construction control plane.", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.18,<2",
  "cryptography>=46,<47",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<1",
  "idna>=3.10,<4",
  "packaging>=25,<27",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pyotp==2.10.0",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uv==0.10.7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
research = ["optuna==4.9.0", "pyarrow==25.0.1"]
agent = ["openai-codex==0.144.4"]
dev = ["mypy>=1.18,<2", "pytest>=9,<10", "ruff>=0.15,<1"]

[project.scripts]
quazonai = "cli.main:main"
quazonai-finite-worker = "runners.finite_worker:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "candidate_bundles","quazonai", "candidate_packages", "crypto", "downstream_auth", "errors", "events", "jobs", "logging_utils", "main", "operator_auth", "optimization", "runtime_config", "schema_validation", "settings"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "cli*", "db*", "plugins*", "runners*",
  "quant_runtime*",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["runners.plugin_jobs", "runners.research_missions"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["cli.main"]
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
