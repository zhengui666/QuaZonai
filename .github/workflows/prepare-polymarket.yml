name: Prepare Polymarket development branch
on:
  push:
    branches: [feat/polymarket-native-research]
    paths:
      - .github/workflows/prepare-polymarket.yml
      - .opensdlc/tasks/polymarket-native-research/prepare.patch
      - .opensdlc/tasks/polymarket-native-research/changes.py
      - .opensdlc/tasks/polymarket-native-research/research-changes.py
      - .opensdlc/tasks/polymarket-native-research/archive-changes.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polymarket-native-preparation
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    if: github.ref == 'refs/heads/feat/polymarket-native-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-native-rust-1.98.1-${{ github.run_id }}
          restore-keys: polymarket-native-rust-1.98.1-
      - name: Apply only the authored source edits and native format/lock generation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -f .opensdlc/tasks/polymarket-native-research/prepare.patch; then
            git apply --check .opensdlc/tasks/polymarket-native-research/prepare.patch
            git apply .opensdlc/tasks/polymarket-native-research/prepare.patch
            git rm .opensdlc/tasks/polymarket-native-research/prepare.patch
          fi
          for edit in changes.py research-changes.py archive-changes.py; do
            path=".opensdlc/tasks/polymarket-native-research/$edit"
            if test -f "$path"; then
              python3 "$path"
              git rm "$path"
            fi
          done
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv
          cargo fmt --all
          cargo metadata --format-version 1 --features job/polymarket-history > "$RUNNER_TEMP/polymarket-dependencies.json"
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'build: apply authored native Polymarket research changes and formatting'
            git push origin HEAD:refs/heads/feat/polymarket-native-research
          fi
          git rev-parse HEAD
      - name: Compile and test the actual native source
        run: |
          set -euo pipefail
          cargo clippy --locked -p job --features polymarket-history --all-targets -- -D warnings
          cargo test --locked -p contracts -p domain --lib
          cargo test --locked -p job --features polymarket-history --bin polymarket-history
          cargo test --locked -p job --test polymarket -- --nocapture
          cargo run --locked -q -p job --features polymarket-history --bin polymarket-history -- --help
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate native API and web contracts
        run: |
          set -euo pipefail
          cargo run --locked -q -p contracts --example generate > "$RUNNER_TEMP/domain.json"
          cargo run --locked -q -p server -- openapi > "$RUNNER_TEMP/api.json"
          cp "$RUNNER_TEMP/domain.json" contracts/generated/domain-v1.openapi.json
          cp "$RUNNER_TEMP/api.json" contracts/generated/api-v2.openapi.json
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web run generate
          git add contracts/generated/ apps/web/src/generated/
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'build: generate Polymarket research contracts from native Rust source'
            git push origin HEAD:refs/heads/feat/polymarket-native-research
          fi
          git diff --exit-code
          git rev-parse HEAD
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-native-rust-1.98.1-${{ github.run_id }}
