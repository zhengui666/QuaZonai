name: Prepare Polymarket development branch
on:
  push:
    branches: [feat/polymarket-native-research]
    paths:
      - .github/workflows/prepare-polymarket.yml
      - .opensdlc/tasks/polymarket-native-research/prepare.patch
      - apps/job/Cargo.toml
      - apps/job/src/bin/polymarket-history.rs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polymarket-native-preparation
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    if: github.ref == 'refs/heads/feat/polymarket-native-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Apply only the authored patch and generate native files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -f .opensdlc/tasks/polymarket-native-research/prepare.patch; then
            git apply --check .opensdlc/tasks/polymarket-native-research/prepare.patch
            git apply .opensdlc/tasks/polymarket-native-research/prepare.patch
            git rm .opensdlc/tasks/polymarket-native-research/prepare.patch
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv
          cargo fmt --all
          cargo metadata --format-version 1 --features job/polymarket-history > "$RUNNER_TEMP/polymarket-dependencies.json"
          git add Cargo.lock apps/job/src/bin/polymarket-history.rs DESIGN.md docs/research/reuse.md
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'build: apply authored Polymarket contracts and native lock/format generation'
            git push origin HEAD:refs/heads/feat/polymarket-native-research
          fi
          git rev-parse HEAD
      - name: Compile and test the actual resulting native source
        run: |
          set -euo pipefail
          cargo clippy --locked -p job --features polymarket-history --bin polymarket-history -- -D warnings
          cargo test --locked -p job --features polymarket-history --bin polymarket-history
          cargo run --locked -q -p job --features polymarket-history --bin polymarket-history -- --help
          git diff --exit-code
