name: Issue 22 sealed isolation fix

on:
  push:
    branches:
      - issue-22-nautilus-first-remote-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix: enforce independent sealed dataset boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-nautilus-first-remote-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/fix_issue22_sealed.py
      - run: python -m compileall -q backend/src backend/tests scripts/fix_issue22_sealed.py
      - name: Commit fixes
        run: |
          git config user.name 'QuaZonai Issue 22 Worker'
          git config user.email 'quazonai-issue22@localhost'
          git rm scripts/fix_issue22_sealed.py .github/workflows/issue22-sealed-fix.yml
          git add backend/src/runners/quant_experiments.py backend/tests/integration/test_quant_experiment_pipeline.py backend/tests/integration/test_remote_nautilus_runtime.py
          git commit -m 'fix: enforce independent sealed dataset boundary'
          git push origin HEAD:issue-22-nautilus-first-remote-runtime
