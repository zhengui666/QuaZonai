name: Issue 22 round10 maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round10_patch.py
      - .github/workflows/issue22-round10-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply transparent closure patch
        run: python tools/issue22_round10_patch.py
      - name: Repair malformed exception tuples already present on the branch
        run: |
          python - <<'PY'
          from pathlib import Path
          repairs = {
              'backend/src/operator_auth.py': (
                  'except ValueError, TypeError, json.JSONDecodeError, _InvalidCookie:',
                  'except (ValueError, TypeError, json.JSONDecodeError, _InvalidCookie):',
              ),
              'backend/src/runners/research_missions.py': (
                  'except OSError, TimeoutError:',
                  'except (OSError, TimeoutError):',
              ),
              'backend/src/settings.py': (
                  'except binascii.Error, ValueError:',
                  'except (binascii.Error, ValueError):',
              ),
          }
          for name, (old, new) in repairs.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: malformed exception tuple count != 1')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate patch syntax and whitespace
        run: |
          python -m compileall -q backend/src backend/tests nautilus_runtime/src nautilus_runtime/tests
          git diff --check
      - name: Commit product changes and remove maintenance files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/issue22_round10_patch.py .github/workflows/issue22-round10-maintenance.yml
          git add -A
          git commit -m 'fix(runtime): close final Issue 22 review gaps'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
