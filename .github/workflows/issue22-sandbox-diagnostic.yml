name: Issue 22 sandbox diagnostic

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-sandbox-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OS sandbox and pinned runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          APPARMOR
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          python -m pip install -e 'nautilus_runtime[dev]'
      - name: Inspect interpreter and exact sandbox command
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from quazonai_nautilus_gateway.engine import _source_bundle_sandbox_command

          executable = Path(sys.executable)
          print('EXECUTABLE', executable)
          print('EXEC_EXISTS', executable.exists(), 'IS_SYMLINK', executable.is_symlink())
          print('EXEC_REALPATH', executable.resolve())
          print('PREFIX', sys.prefix)
          print('BASE_PREFIX', sys.base_prefix)
          subprocess.run(['ls', '-l', str(executable)], check=False)
          subprocess.run(['file', str(executable)], check=False)
          subprocess.run(['ldd', str(executable)], check=False)
          subprocess.run(['readelf', '-l', str(executable)], check=False)
          with tempfile.TemporaryDirectory() as tmp:
              workspace = Path(tmp)
              (workspace / 'runtime').mkdir()
              command = _source_bundle_sandbox_command(operation='backtest', workspace=workspace)
              print('COMMAND', json.dumps(command))
              probe = command[:-3] + [str(sys.executable), '-I', '-c', "import sys; print(sys.executable); print('probe-ok')"]
              completed = subprocess.run(probe, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              print('PROBE_RETURN', completed.returncode)
              print('PROBE_STDOUT', repr(completed.stdout))
              print('PROBE_STDERR', repr(completed.stderr))
          PY
      - name: Expose sandbox stderr only inside this diagnostic checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nautilus_runtime/src/quazonai_nautilus_gateway/engine.py')
          text = path.read_text(encoding='utf-8')
          old = '            if completed.returncode != 0 or not output_path.is_file():\n                raise GatewayContractError("isolated Nautilus operation failed")\n'
          new = '            if completed.returncode != 0 or not output_path.is_file():\n                print(f"SANDBOX_RETURN_CODE={completed.returncode}", file=sys.stderr)\n                print(f"SANDBOX_STDERR={completed.stderr!r}", file=sys.stderr)\n                print(f"SANDBOX_STDOUT={completed.stdout!r}", file=sys.stderr)\n                raise GatewayContractError("isolated Nautilus operation failed")\n'
          if text.count(old) != 1:
              raise SystemExit('diagnostic patch target not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Reproduce isolated BacktestNode failure
        run: |
          pytest -q -s \
            nautilus_runtime/tests/test_real_backtest.py::test_real_catalog_backtest_and_sealed_disclosure \
            nautilus_runtime/tests/test_real_backtest.py::test_candidate_bundle_v2_replays_exact_wheel_against_reference_fixture
