name: Issue 22 sandbox diagnostic

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-sandbox-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          python -m pip install -e 'nautilus_runtime[dev]'
      - name: Surface child stderr in this checkout only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nautilus_runtime/src/quazonai_nautilus_gateway/engine.py')
          s=p.read_text()
          old='            if completed.returncode != 0 or not output_path.is_file():\n                raise GatewayContractError("isolated Nautilus operation failed")\n'
          new='            if completed.returncode != 0 or not output_path.is_file():\n                print(f"SANDBOX_RETURN_CODE={completed.returncode}", file=sys.stderr)\n                print(f"SANDBOX_STDERR={completed.stderr!r}", file=sys.stderr)\n                print(f"SANDBOX_STDOUT={completed.stdout!r}", file=sys.stderr)\n                raise GatewayContractError("isolated Nautilus operation failed")\n'
          if s.count(old)!=1: raise SystemExit('diagnostic target mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Reproduce
        run: pytest -q -s nautilus_runtime/tests/test_real_backtest.py::test_real_catalog_backtest_and_sealed_disclosure
