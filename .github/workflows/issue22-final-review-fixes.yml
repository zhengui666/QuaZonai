          # lineage, persistent per-episode claim, and multiple episode replay.
          # ------------------------------------------------------------------
          replace(
              'backend/tests/integration/test_degradation_feedback.py',
              '''    CandidateBundle,\n    DownstreamSystem,\n    ForwardEvidenceEpisode,\n''',
