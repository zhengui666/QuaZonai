          )

          # Frontend E2E reseeding must clear the new dependent table first.
          replace(
              'backend/tests/frontend_e2e_seed.py',
              '''    DatasetRevision,\n    DownstreamSystem,\n''',
              '''    DatasetRevision,\n    DegradationFollowup,\n    DownstreamSystem,\n''',
          )
          replace(
              'backend/tests/frontend_e2e_seed.py',
              '''        for model in (\n            ForwardEvidenceEpisode,\n''',
              '''        for model in (\n            DegradationFollowup,\n            ForwardEvidenceEpisode,\n''',
