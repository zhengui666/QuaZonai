name: PR99 canonical Codex API preparation
on:
  push:
    branches: [codex/pr99-collection-api-20260921]
permissions:
  contents: read
concurrency:
  group: pr99-collection-api-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'zhengui666/QuaZonai' && github.ref == 'refs/heads/codex/pr99-collection-api-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    services:
      postgres:
        image: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-collection-test
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      SOURCE_BASE: 20f43c7b5470ab32174b6867b4bb686d24707aaf
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DATABASE_URL: postgresql://postgres:disposable-collection-test@127.0.0.1:55434/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install authored regressions against the unchanged baseline
        id: tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr99-collection
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_BASE"
          git apply --check .github/pr99-collection-tests.patch
          git apply .github/pr99-collection-tests.patch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned native dependencies
        id: setup
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          npm ci --prefix runtimes/codex --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          native="$PWD/runtimes/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test "$("$native" --version)" = 'codex-cli 0.144.4'
          echo "CODEX_NATIVE_BIN=$native" >> "$GITHUB_ENV"
      - name: Reproduce the actual old-route failure before the source fix
        id: red
        run: |
          set -uo pipefail
          set +e
          cargo test --locked -p server --features native-codex --test codex_profiles_http collection_patch_is_unavailable_without_changing_the_native_profile -- --exact --test-threads=1 2>&1 | tee /tmp/pr99-collection/baseline-regression.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q 'legacy collection PATCH must be unavailable' /tmp/pr99-collection/baseline-regression.log
          grep -q 'left: 200' /tmp/pr99-collection/baseline-regression.log
          printf 'Expected regression reproduced: the old collection PATCH returned200, not405. This is a baseline failure, not a test pass.\n' > /tmp/pr99-collection/baseline-result.txt
      - name: Apply the exact authored API removal
        id: apply
        run: |
          set -euo pipefail
          git apply --check .github/pr99-collection-source.patch
          git apply .github/pr99-collection-source.patch
          git diff --name-only > /tmp/pr99-collection/authored-paths.txt
          cargo fmt --all
      - name: Verify real HTTP, model persistence and pinned native probes
        id: native
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast -p server --features native-codex --test codex_profiles_http --test auth_http -- --test-threads=4 2>&1 | tee /tmp/pr99-collection/http.log
          cargo test --locked -p store --test codex_profiles -- --test-threads=4 2>&1 | tee /tmp/pr99-collection/store.log
          cargo clippy --locked -p server --features native-codex --lib --test codex_profiles_http --test auth_http -- -D warnings 2>&1 | tee /tmp/pr99-collection/clippy.log
      - name: Native contract generation, frontend build and unit regressions
        id: generate
        run: |
          set -euo pipefail
          cargo run --locked -q -p contracts --example generate > /tmp/pr99-collection/domain-v1.openapi.json
          mv /tmp/pr99-collection/domain-v1.openapi.json contracts/generated/domain-v1.openapi.json
          cargo run --locked -q -p server -- openapi > /tmp/pr99-collection/api-v2.openapi.json
          mv /tmp/pr99-collection/api-v2.openapi.json contracts/generated/api-v2.openapi.json
          npm --prefix apps/web run build 2>&1 | tee /tmp/pr99-collection/web-build.log
          npm --prefix apps/web test 2>&1 | tee /tmp/pr99-collection/web-unit.log
      - name: Existing settings browser regressions at all three viewports
        id: browser
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e -- tests/codex-settings.spec.ts 2>&1 | tee /tmp/pr99-collection/browser.log
      - name: Remove temporary inputs and publish the prepared source branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_BASE" -- Cargo.lock apps/web/package-lock.json runtimes/codex/package-lock.json migrations .github/workflows/ci.yml .github/workflows/web.yml .github/workflows/native-runtime.yml .github/workflows/deployment.yml .github/workflows/codeql.yml
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          authored = set(Path('/tmp/pr99-collection/authored-paths.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert len(authored) == 7
          assert all(path in authored or path.startswith(('contracts/generated/','apps/web/src/generated/')) for path in changed)
          PY
          git rm .github/pr99-collection-tests.patch .github/pr99-collection-source.patch .github/workflows/pr99-collection-preparation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove obsolete collection Codex settings updates'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/pr99-collection-api-20260921 | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/pr99-collection-api-20260921
          git rev-parse HEAD > /tmp/pr99-collection/published-commit.txt
      - name: Record actual results and source
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr99-collection
          printf '%s\n' "$STEP_RESULTS" > /tmp/pr99-collection/steps.json
          printf '%s\n' "$EXPECTED_HEAD" > /tmp/pr99-collection/input-commit.txt
          git add -A
          git archive "$(git write-tree)" | gzip > /tmp/pr99-collection/source.tar.gz
          git diff "$SOURCE_BASE" --stat > /tmp/pr99-collection/diff-stat.txt
          printf 'Focused preparation only; baseline-red proves the original defect and is not a passing product test. Full original final-Head CI and explicit clean independent read-only review remain required. No private account or owner-host deployment.\n' > /tmp/pr99-collection/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr99-collection-${{ github.run_id }}
          path: /tmp/pr99-collection
          if-no-files-found: error
          retention-days: 7
