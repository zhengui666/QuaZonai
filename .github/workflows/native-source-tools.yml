name: Native source tools
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-btc-training
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: btc-training-observer-634e094
          cache-bin: false
          cache-workspace-crates: false
          workspaces: runtimes/native/btc-training-launcher -> ../../../target-btc-training
      - name: Parse and test isolated observer
        run: |
          cargo fmt --manifest-path runtimes/native/btc-training-observer/Cargo.toml --check
          cargo test --locked --manifest-path runtimes/native/btc-training-observer/Cargo.toml
      - name: Build non-account launcher
        run: |
          mkdir -p btc-artifacts
          cargo metadata --locked --format-version 1 --manifest-path runtimes/native/btc-training-launcher/Cargo.toml > btc-artifacts/resolved-metadata.json
          export QZ_NATIVE_BUILD_METADATA="$PWD/btc-artifacts/resolved-metadata.json"
          export QZ_NATIVE_BUILD_LOCK="$PWD/runtimes/native/btc-training-launcher/Cargo.lock"
          cargo build --locked --manifest-path runtimes/native/btc-training-launcher/Cargo.toml
          cp target-btc-training/debug/qz-second-bar-launcher btc-artifacts/
          cp runtimes/native/btc-training-launcher/Cargo.lock btc-artifacts/
          btc-artifacts/qz-second-bar-launcher capabilities > btc-artifacts/capabilities.json
          python3 - <<'PYCODE'
          import json
          p=json.load(open('btc-artifacts/capabilities.json'))
          assert p['research']['configuredRunFactory'] and not p['account']['registration'] and not p['account']['compiled'] and not p['running']
          assert p['identity']['precision']=='high' and p['protocol']=='quazonai-native-process-v1'
          assert p['identity']['nautilusRevision']=='634e09456c949f488b2bfcf6b6897b33cbf218d7'
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc-training-observer-${{ github.sha }}
          path: btc-artifacts/
          if-no-files-found: error
          retention-days: 7
