name: Native data browser
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
concurrency:
  group: native-data-browser-${{ github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  native-data-browser:
    name: Data / real acquisition, Worker, OCI and browser bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-data-ci-only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source and bounded native test scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p apps/web/test-results/native-summary
          git rev-parse HEAD > apps/web/test-results/native-summary/tested-commit.txt
          date +%s > "$RUNNER_TEMP/native-data-started"
          docker version > apps/web/test-results/native-summary/docker-version.txt
          printf '%s\n' 'Synthetic three-candle acquisition through actual source plugin, preparation, production Runtime, shipped Worker and browser. No Codex/model inference, live source, market permission, PIT verification or qualification claim. One serial job, 45 minute upper bound; measured stage timings are in result.json.' > apps/web/test-results/native-summary/SCOPE.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify browser code and cleanup ownership boundaries
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          node --check apps/web/scripts/native-browser.mjs
          node --check apps/web/scripts/native-data-execution.mjs
          node --test apps/web/scripts/native-data-execution.test.mjs apps/web/scripts/native-user-services.test.mjs
          npm --prefix apps/web --ignore-scripts run typecheck
          npm --prefix apps/web --ignore-scripts run test
          node apps/web/node_modules/vite/bin/vite.js build --config apps/web/vite.config.ts apps/web
          node apps/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build default native stack and original candle preparation executables
        run: |
          set -euo pipefail
          started=$(date +%s)
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > apps/web/test-results/native-summary/rustc.txt
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all -- --check
          # The native-science feature enables unrelated Codex work. It is
          # deliberately absent: this path only needs the default shipped Worker.
          rustup run "$RUSTUP_TOOLCHAIN" cargo build --locked -p server -p runtime -p job --bin server --bin runtime --bin job
          rustup run "$RUSTUP_TOOLCHAIN" cargo build --locked -p job --features catalog-prepare --bin catalog-prepare --example browser_catalog_fixture
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p job --features catalog-prepare --test candle_ingest
          rustup run "$RUSTUP_TOOLCHAIN" cargo clippy --locked -p job --features catalog-prepare --example browser_catalog_fixture --test candle_ingest -- -D warnings
          printf '%s\n' "$(( $(date +%s) - started ))" > apps/web/test-results/native-summary/native-build-seconds.txt
      - name: Assemble the actual pinned default Job image
        run: |
          set -euo pipefail
          started=$(date +%s)
          CARGO_HOME="$(mktemp -d "$RUNNER_TEMP/assembly-cargo.XXXXXX")" \
            node runtimes/native/build-native-image.mjs --profile debug --output-dir "$RUNNER_TEMP/native-data-image"
          image=$(cat "$RUNNER_TEMP/native-data-image/image-id.txt")
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "QUAZONAI_NATIVE_JOB_IMAGE=$image" >> "$GITHUB_ENV"
          echo 'QUAZONAI_DOCKER_SOCKET=/var/run/docker.sock' >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/native-data-image/result.json" apps/web/test-results/native-summary/native-image-build.json
          printf '%s\n' "$(( $(date +%s) - started ))" > apps/web/test-results/native-summary/native-image-seconds.txt
      - name: Prepare pinned Caddy and the native user service manager
        run: |
          set -euo pipefail
          container=$(docker create caddy:2.11.4)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
          uid=$(id -u)
          test "$uid" -ne 0
          sudo loginctl enable-linger "$uid"
          sudo systemctl start "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          systemctl --user show --property=Version
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Execute real browser acquisition to frozen input to native publication
        working-directory: apps/web
        env:
          QUAZONAI_WEB_TEST_ADMIN_URL: postgresql://postgres:native-data-ci-only@127.0.0.1:55436/postgres
          QUAZONAI_WEB_DATA_MODE: native-execution
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: npm --ignore-scripts run test:e2e
      - name: Require unchanged source
        run: git diff --exit-code
      - name: Remove only the immutable image after verified owned-container cleanup
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/native-data-image/image-id.txt"; then
            # A missing cleanup certificate is not permission to guess ownership.
            node -e 'const f=require("node:fs"); const e=JSON.parse(f.readFileSync("apps/web/test-results/native-summary/native-data-execution.json")); if(e.cleanup_complete!==true) process.exit(1)'
            image=$(cat "$RUNNER_TEMP/native-data-image/image-id.txt")
            [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker image rm "$image"
          fi
      - name: Record measured elapsed time and preserve sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p apps/web/test-results/native-summary
          if test -f "$RUNNER_TEMP/native-data-started"; then
            elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/native-data-started") ))
            printf '%s\n' "$elapsed" > apps/web/test-results/native-summary/job-elapsed-seconds.txt
            printf 'Native data browser elapsed: %s seconds (45-minute job bound; not a billing estimate).\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-data-browser-${{ env.EXPECTED_HEAD }}
          path: apps/web/test-results/native-summary/
          if-no-files-found: error
          retention-days: 7
