name: Frontend

on:
  push:
    branches: [main, codex/production-rebuild]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai_frontend
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai_frontend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai_frontend
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai_frontend
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure temporary runtime paths
        run: |
          echo "QUAZONAI_PACKAGE_ROOT=${RUNNER_TEMP}/quazonai-packages" >> "$GITHUB_ENV"
          echo "QUAZONAI_MISSION_ROOT=${RUNNER_TEMP}/quazonai-missions" >> "$GITHUB_ENV"
          echo "CODEX_HOME=${RUNNER_TEMP}/codex-home" >> "$GITHUB_ENV"
      - name: Install backend test runtime
        run: python -m pip install -e 'backend[dev,research,mcp]'
      - name: Migrate real browser-test database
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Seed browser-test domain facts
        run: python backend/tests/frontend_e2e_seed.py
      - name: Start real FastAPI
        run: |
          nohup uvicorn main:create_app --factory --host 127.0.0.1 --port 8000 >/tmp/quazonai-api.log 2>&1 &
          echo $! >/tmp/quazonai-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = 60 ]; then
              cat /tmp/quazonai-api.log
              exit 1
            fi
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit and interaction tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser E2E against FastAPI/Postgres
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/quazonai-api.log || true
      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f /tmp/quazonai-api.pid ]; then kill "$(cat /tmp/quazonai-api.pid)" || true; fi
