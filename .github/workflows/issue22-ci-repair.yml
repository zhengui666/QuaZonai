name: Issue 22 CI fixture repair

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Repair strict-contract fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          domain = Path('backend/tests/integration/test_domain_api.py')
          text = domain.read_text()
          text = text.replace(
              'def _nautilus_candidate_metrics(experiment_id: UUID) -> dict:\n',
              'def _nautilus_candidate_metrics(experiment_id: UUID, alpha_id: UUID) -> dict:\n',
              1,
          )
          text = text.replace(
              '            "alpha_qualification_ids": [],\n',
              '            "alpha_qualification_ids": [str(alpha_id)],\n',
              1,
          )
          text = text.replace(
              '        experiment_id = uuid4()\n        candidate = PortfolioCandidate(\n',
              '        experiment_id = uuid4()\n        alpha_id = uuid4()\n        candidate = PortfolioCandidate(\n',
              1,
          )
          text = text.replace(
              '                {"instrument_id": "EUR/USD.SIM", "target_weight": 0.6},\n                {"instrument_id": "GBP/USD.SIM", "target_weight": 0.4},\n',
              '                {\n                    "alpha_qualification_id": str(alpha_id),\n                    "instrument_id": "EUR/USD.SIM",\n                    "target_weight": 0.6,\n                },\n                {\n                    "alpha_qualification_id": str(alpha_id),\n                    "instrument_id": "GBP/USD.SIM",\n                    "target_weight": 0.4,\n                },\n',
              1,
          )
          text = text.replace(
              '            metrics=_nautilus_candidate_metrics(experiment_id),\n',
              '            metrics=_nautilus_candidate_metrics(experiment_id, alpha_id),\n',
              1,
          )
          domain.write_text(text)

          promotion = Path('backend/tests/integration/test_nautilus_promotion.py')
          text = promotion.read_text()
          text = text.replace(
              'def _evidence(experiment_id: object) -> dict:\n',
              'def _evidence(experiment_id: object, mode: str = "DISCOVERY") -> dict:\n',
              1,
          )
          text = text.replace(
              '        "mode": "DISCOVERY",\n',
              '        "mode": mode,\n',
              1,
          )
          text = text.replace(
              '                evidence_json={} if sealed else _evidence(request.experiment_id),\n',
              '                evidence_json=(\n                    {}\n                    if sealed\n                    else _evidence(request.experiment_id, request.mode.value)\n                ),\n',
              1,
          )
          promotion.write_text(text)

          workflow = Path('.github/workflows/issue22-ci-repair.yml')
          workflow.unlink()
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(runtime): align strict Nautilus fixtures'
          git push --force-with-lease origin HEAD:feat/issue-22-remote-nautilus-runtime
