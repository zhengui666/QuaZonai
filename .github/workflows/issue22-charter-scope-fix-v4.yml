name: Finish Issue 22 Charter scope type fix

on:
  push:
    branches: [feat/issue-22-remote-nautilus-runtime]
    paths: [.github/workflows/issue22-charter-scope-fix-v4.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Reapply and finish Charter scope fix
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue22-charter-scope-fix.yml').read_text(encoding='utf-8')
          begin_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          begin = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, begin)
          script = workflow[begin:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, '<issue22-charter-scope-fix>', 'exec'), {'__name__': '__main__'})

          path = Path('backend/src/api/domain.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for universe in universes:\n        current = latest_by_key.get(universe.universe_key)\n        if current is None or universe.version_no > current.version_no:\n            latest_by_key[universe.universe_key] = universe\n'''
          new = '''    for universe in universes:\n        if (\n            universe.universe_key not in latest_by_key\n            or universe.version_no > latest_by_key[universe.universe_key].version_no\n        ):\n            latest_by_key[universe.universe_key] = universe\n'''
          if text.count(old) != 1:
              raise RuntimeError('latest-universe anchor changed')
          text = text.replace(old, new, 1)
          old = '''        universe = active_universes.get(revision.universe_version_id)\n        source = active_sources.get(revision.data_source_id)\n        if universe is None or source is None:\n            continue\n        if not market_scope_matches_universe(preview.market_scope, universe):\n            continue\n'''
          new = '''        matched_universe = active_universes.get(revision.universe_version_id)\n        matched_source = active_sources.get(revision.data_source_id)\n        if matched_universe is None or matched_source is None:\n            continue\n        if not market_scope_matches_universe(preview.market_scope, matched_universe):\n            continue\n'''
          if text.count(old) != 1:
              raise RuntimeError('matched scope anchor changed')
          text = text.replace(old, new, 1)
          old = '''        domains = dataset_revision_domains(revision, source)\n        if not domains:\n            continue\n        eligible.append((revision, universe, domains))\n'''
          new = '''        domains = dataset_revision_domains(revision, matched_source)\n        if not domains:\n            continue\n        eligible.append((revision, matched_universe, domains))\n'''
          if text.count(old) != 1:
              raise RuntimeError('eligible scope anchor changed')
          text = text.replace(old, new, 1)
          old = '''    if requested_scope in {None, "System inferred"}:\n'''
          new = '''    if requested_scope is None or requested_scope == "System inferred":\n'''
          if text.count(old) != 1:
              raise RuntimeError('market-scope narrowing anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflows
        run: rm -f .github/workflows/issue22-charter-scope-fix.yml .github/workflows/issue22-charter-scope-fix-v2.yml .github/workflows/issue22-charter-scope-fix-v3.yml .github/workflows/issue22-charter-scope-fix-v4.yml
      - name: Validate
        run: |
          python -m pip install --disable-pip-version-check -e 'backend[dev,research,agent]'
          python -m compileall -q backend/src
          ruff check --config backend/pyproject.toml \
            backend/src/api/domain.py backend/src/quant_runtime/data_scope.py \
            backend/src/quant_runtime/workspace.py backend/tests/integration/test_domain_api.py
          mypy --config-file backend/pyproject.toml backend/src
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          pytest -q backend/tests/integration/test_domain_api.py
      - name: Commit
        run: |
          git config user.name 'QuaZonai Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(research): freeze executable Charter scope'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
