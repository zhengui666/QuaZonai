name: Verify authored PR101 review repairs
on:
  push:
    branches: [ops/pr101-native-arrival-order]
    paths:
      - .github/workflows/pr101-review-fixes.yml
      - .opensdlc/tasks/polymarket-native-research/review-*.py
permissions:
  contents: write
concurrency:
  group: pr101-authored-review-repairs
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      EXPECTED_HEAD: f6639e2171264d397b9c97631a11cf5bba5688f1
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f6639e2171264d397b9c97631a11cf5bba5688f1
          path: source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: authored
          persist-credentials: false
          sparse-checkout: .opensdlc/tasks/polymarket-native-research
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: pr101-review-native-1.98.1-${{ github.run_id }}
          restore-keys: pr101-review-native-1.98.1-
      - name: Apply only the web-authored corrections to the exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/feat/polymarket-native-research | cut -f1)" = "$EXPECTED_HEAD"
          for script in review-contracts.py review-native.py review-bindings.py review-tests.py review-docs.py; do
            python3 "../authored/.opensdlc/tasks/polymarket-native-research/$script"
          done
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc -Vv
          cargo fmt --all
          git diff --stat
      - name: Compile all affected native contracts and runtime targets
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --features server/native-codex,runtime/native-oci,job/polymarket-history -- -D warnings
      - name: Execute actual source and native catalog regressions
        run: |
          set -euo pipefail
          cargo test --locked -p contracts -p domain
          cargo test --locked -p job --features polymarket-history
          cargo test --locked -p runtime --test catalog_scope
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate native contracts and verify the browser client
        run: |
          set -euo pipefail
          cargo run --locked -q -p contracts --example generate > "$RUNNER_TEMP/domain.json"
          cargo run --locked -q -p server -- openapi > "$RUNNER_TEMP/api.json"
          cargo run --locked -q -p runtime -- openapi > "$RUNNER_TEMP/runtime.json"
          cp "$RUNNER_TEMP/domain.json" contracts/generated/domain-v1.openapi.json
          cp "$RUNNER_TEMP/api.json" contracts/generated/api-v2.openapi.json
          cp "$RUNNER_TEMP/runtime.json" contracts/generated/runtime-v1.openapi.json
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web run generate
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          cargo fmt --all -- --check
      - name: Publish only the verified application changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/polymarket-native-research | cut -f1)" = "$EXPECTED_HEAD"
          test ! -e .github/workflows/pr101-review-fixes.yml
          test ! -e .opensdlc/tasks/polymarket-native-research/review-contracts.py
          git add apps crates tests contracts/generated DESIGN.md docs/polymarket-history.md .opensdlc/tasks/polymarket-native-research/task.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: bind native Polymarket settlement sources and target lifetime'
          git push origin HEAD:refs/heads/feat/polymarket-native-research
          git rev-parse HEAD
          git diff --exit-code
      - name: Preserve application diagnostics without generated success claims
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr101-review-evidence"
          git diff --binary > "$RUNNER_TEMP/pr101-review-evidence/worktree.diff"
          git rev-parse HEAD > "$RUNNER_TEMP/pr101-review-evidence/source-head.txt"
          git status --porcelain > "$RUNNER_TEMP/pr101-review-evidence/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr101-review-repairs-${{ github.run_id }}
          path: ${{ runner.temp }}/pr101-review-evidence/
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: pr101-review-native-1.98.1-${{ github.run_id }}
