name: Component research (development only)
on:
  pull_request:
    paths: ['.github/workflows/component-research.yml']
permissions:
  contents: read
jobs:
  rust-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Resolve public candidate sources without changing product locks
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidates/src /tmp/evidence
          exec > >(tee /tmp/evidence/research.log) 2>&1
          rustup toolchain install 1.98.0 --profile minimal
          cat > /tmp/candidates/Cargo.toml <<'TOML'
          [package]
          name = "science-candidates"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.98"
          [dependencies]
          rust-portfolio-opt = "=0.2.0"
          model-selection-rs = "=0.1.0"
          covstream = "=0.1.3"
          argon2 = "=0.5.3"
          tower_governor = "=0.8.0"
          TOML
          echo 'fn main() {}' > /tmp/candidates/src/main.rs
          cargo +1.98.0 generate-lockfile --manifest-path /tmp/candidates/Cargo.toml
          cargo +1.98.0 vendor --locked --manifest-path /tmp/candidates/Cargo.toml /tmp/candidates/vendor > /tmp/evidence/config.toml
          tar -C /tmp/candidates -czf /tmp/evidence/science-sources.tar.gz Cargo.toml Cargo.lock src vendor
          git archive --format=tar HEAD | gzip > /tmp/evidence/repository-source.tar.gz
          cargo +1.98.0 check --locked --manifest-path /tmp/candidates/Cargo.toml
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: science-development-${{ github.sha }}
          path: /tmp/evidence/
          retention-days: 1
          if-no-files-found: error
  frontend-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install official frontend candidates in a disposable workspace
        run: |
          set -euo pipefail
          mkdir -p /tmp/web /tmp/evidence
          exec > >(tee /tmp/evidence/web.log) 2>&1
          cat > /tmp/web/package.json <<'JSON'
          {"name":"quazonai-web","version":"2.0.0-dev.1","private":true,"type":"module","dependencies":{"antd":"6.6.2","@ant-design/icons":"6.0.0","react":"19.1.1","react-dom":"19.1.1","react-router-dom":"7.8.2","@tanstack/react-query":"5.85.5","echarts":"5.6.0","openapi-fetch":"0.14.0","workbox-window":"7.3.0"},"devDependencies":{"@vitejs/plugin-react":"5.0.2","vite":"7.1.3","typescript":"5.9.2","@types/react":"19.1.10","@types/react-dom":"19.1.9","vitest":"3.2.4","jsdom":"26.1.0","@testing-library/react":"16.3.0","@testing-library/jest-dom":"6.8.0","@playwright/test":"1.55.0","@axe-core/playwright":"4.10.2","openapi-typescript":"7.8.0","workbox-build":"7.3.0"}}
          JSON
          npm install --prefix /tmp/web --ignore-scripts --no-audit --no-fund
          npm ls --prefix /tmp/web --depth=0
          tar -C /tmp/web -czf /tmp/evidence/frontend-tools.tar.gz package.json package-lock.json node_modules
          npm ci --prefix runtimes/codex --ignore-scripts --no-audit --no-fund
          native="$PWD/runtimes/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test "$("$native" --version)" = 'codex-cli 0.144.4'
          cp "$native" /tmp/evidence/codex
          git archive --format=tar HEAD | gzip > /tmp/evidence/repository-source.tar.gz
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-development-${{ github.sha }}
          path: /tmp/evidence/
          retention-days: 1
          if-no-files-found: error
