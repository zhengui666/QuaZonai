name: Operator Auth E2E

on:
  pull_request:
    paths:
      - '.env.example'
      - 'DESIGN.md'
      - 'OPERATIONS.md'
      - 'CLI.md'
      - 'README.md'
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yml'
      - '.github/workflows/operator-auth-e2e.yml'
  push:
    branches: [main]
    paths:
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yml'
      - '.github/workflows/operator-auth-e2e.yml'

permissions:
  contents: read

concurrency:
  group: operator-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai_auth_e2e
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai_auth_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai_auth_e2e
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai_auth_e2e
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      QUAZONAI_PACKAGE_ROOT: /tmp/quazonai-auth-e2e/packages
      QUAZONAI_MISSION_ROOT: /tmp/quazonai-auth-e2e/missions
      CODEX_HOME: /tmp/quazonai-auth-e2e/codex-home
      QUAZONAI_AUTH_ENABLED: 'true'
      QUAZONAI_AUTH_USERNAME: operator
      QUAZONAI_AUTH_PASSWORD: correct horse battery staple
      QUAZONAI_AUTH_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      QUAZONAI_AUTH_COOKIE_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      QUAZONAI_API_TOKEN: auth-e2e-machine-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      QUAZONAI_AUTH_PUBLIC_ORIGIN: http://127.0.0.1:4173
      QUAZONAI_AUTH_SESSION_TTL_SECONDS: '43200'
      QUAZONAI_AUTH_TRUSTED_BROWSER_TTL_DAYS: '30'
      QUAZONAI_E2E_AUTH_ENABLED: 'true'
      QUAZONAI_E2E_AUTH_USERNAME: operator
      QUAZONAI_E2E_AUTH_PASSWORD: correct horse battery staple
      QUAZONAI_E2E_AUTH_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend test runtime
        run: python -m pip install -e 'backend[dev,research]'
      - name: Migrate auth E2E database
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Start authenticated FastAPI
        run: |
          nohup uvicorn main:create_app --factory --no-proxy-headers --host 127.0.0.1 --port 8000 >/tmp/quazonai-auth-api.log 2>&1 &
          echo $! >/tmp/quazonai-auth-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = 60 ]; then
              cat /tmp/quazonai-auth-api.log
              exit 1
            fi
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Authenticated browser lifecycle
        working-directory: frontend
        run: npx playwright test e2e/operator-auth.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-auth-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/quazonai-auth-api.log || true
      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f /tmp/quazonai-auth-api.pid ]; then kill "$(cat /tmp/quazonai-auth-api.pid)" || true; fi
