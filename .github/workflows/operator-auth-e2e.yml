name: Operator Auth E2E

on:
  pull_request:
    paths:
      - '.env.example'
      - 'DESIGN.md'
      - 'OPERATIONS.md'
      - 'CLI.md'
      - 'README.md'
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yml'
      - '.github/workflows/operator-auth-e2e.yml'
  push:
    branches: [main]
    paths:
      - '.env.example'
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yml'
      - '.github/workflows/operator-auth-e2e.yml'

permissions:
  contents: write

concurrency:
  group: operator-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-codex-findings:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-37-totp-only-auth'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Preserve deprecated-variable fail-closed detection without forwarding secrets
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = False

          def replace_once(path_value: str, old: str, new: str) -> None:
              global changed
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed = True
              elif new not in text:
                  raise SystemExit(f'{path}: neither old nor replacement text found')

          replace_once(
              'backend/src/settings.py',
              '_ALLOWED_ENVIRONMENTS = frozenset({"development", "production", "test"})\nTrustedProxyNetwork = ipaddress.IPv4Network | ipaddress.IPv6Network',
              '_ALLOWED_ENVIRONMENTS = frozenset({"development", "production", "test"})\n_LEGACY_AUTH_ENV_MARKERS = (\n    ("QUAZONAI_AUTH_USERNAME", "QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT"),\n    ("QUAZONAI_AUTH_PASSWORD", "QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT"),\n)\nTrustedProxyNetwork = ipaddress.IPv4Network | ipaddress.IPv6Network',
          )
          replace_once(
              'backend/src/settings.py',
              '''        legacy_auth_variables = tuple(\n            name\n            for name in ("QUAZONAI_AUTH_USERNAME", "QUAZONAI_AUTH_PASSWORD")\n            if _optional_raw_env(name) is not None\n        )\n        if operator_auth_enabled and legacy_auth_variables:\n''',
              '''        legacy_auth_variables: tuple[str, ...] = ()\n        if operator_auth_enabled:\n            legacy_auth_variables = tuple(\n                legacy_name\n                for legacy_name, marker_name in _LEGACY_AUTH_ENV_MARKERS\n                if (\n                    _optional_raw_env(legacy_name) is not None\n                    or _env_bool(marker_name, False)\n                )\n            )\n        if legacy_auth_variables:\n''',
          )
          replace_once(
              'compose.yml',
              '      QUAZONAI_AUTH_ENABLED: ${QUAZONAI_AUTH_ENABLED:-false}\n      QUAZONAI_AUTH_TOTP_SECRET: ${QUAZONAI_AUTH_TOTP_SECRET:-}',
              '      QUAZONAI_AUTH_ENABLED: ${QUAZONAI_AUTH_ENABLED:-false}\n      # Retired browser secrets stay outside the container. These Compose\n      # alternatives disclose only whether each old value is non-empty.\n      QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT: "${QUAZONAI_AUTH_USERNAME:+true}"\n      QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT: "${QUAZONAI_AUTH_PASSWORD:+true}"\n      QUAZONAI_AUTH_TOTP_SECRET: ${QUAZONAI_AUTH_TOTP_SECRET:-}',
          )
          replace_once(
              'backend/src/runners/research_missions.py',
              '        "QUAZONAI_AUTH_ENABLED": "",\n        # Deprecated browser credentials are still scrubbed so stale host secrets',
              '        "QUAZONAI_AUTH_ENABLED": "",\n        "QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT": "",\n        "QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT": "",\n        # Deprecated browser credentials are still scrubbed so stale host secrets',
          )
          replace_once(
              'backend/tests/unit/test_operator_auth_totp_only_contract.py',
              'import time\nfrom dataclasses import replace\n',
              'import time\nfrom dataclasses import replace\nfrom pathlib import Path\n',
          )
          replace_once(
              'backend/tests/unit/test_operator_auth_totp_only_contract.py',
              'from settings import Settings, SettingsError\n\n\ndef _enabled_settings',
              '''from settings import Settings, SettingsError\n\nREPO_ROOT = Path(__file__).resolve().parents[3]\nCOMPOSE_PATH = REPO_ROOT / "compose.yml"\nLEGACY_AUTH_ENV_MARKERS = (\n    ("QUAZONAI_AUTH_USERNAME", "QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT"),\n    ("QUAZONAI_AUTH_PASSWORD", "QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT"),\n)\n\n\ndef _enabled_settings''',
          )
          replace_once(
              'backend/tests/unit/test_operator_auth_totp_only_contract.py',
              '''    assert legacy_name in message\n    assert legacy_value not in message\n\n\n@pytest.mark.parametrize("legacy_name", ["QUAZONAI_AUTH_USERNAME", "QUAZONAI_AUTH_PASSWORD"])\n''',
              '''    assert legacy_name in message\n    assert legacy_value not in message\n\n\n@pytest.mark.parametrize(("legacy_name", "marker_name"), LEGACY_AUTH_ENV_MARKERS)\ndef test_enabled_auth_rejects_compose_legacy_presence_marker_by_original_name(\n    monkeypatch: pytest.MonkeyPatch,\n    legacy_name: str,\n    marker_name: str,\n) -> None:\n    _configure_enabled_env(monkeypatch)\n    monkeypatch.setenv(marker_name, "true")\n\n    with pytest.raises(SettingsError) as raised:\n        Settings.from_env()\n\n    message = str(raised.value)\n    assert legacy_name in message\n    assert marker_name not in message\n\n\n@pytest.mark.parametrize("legacy_name", ["QUAZONAI_AUTH_USERNAME", "QUAZONAI_AUTH_PASSWORD"])\n''',
          )
          replace_once(
              'backend/tests/unit/test_operator_auth_totp_only_contract.py',
              '''    assert configured.auth_enabled is False\n    assert not hasattr(configured, "operator_username")\n    assert not hasattr(configured, "operator_password")\n\n\ndef test_machine_authentication_uses_fixed_operator_subject''',
              '''    assert configured.auth_enabled is False\n    assert not hasattr(configured, "operator_username")\n    assert not hasattr(configured, "operator_password")\n\n\n@pytest.mark.parametrize(("_legacy_name", "marker_name"), LEGACY_AUTH_ENV_MARKERS)\ndef test_disabled_auth_keeps_compose_legacy_markers_dormant(\n    monkeypatch: pytest.MonkeyPatch,\n    _legacy_name: str,\n    marker_name: str,\n) -> None:\n    monkeypatch.setenv("QUAZONAI_AUTH_ENABLED", "false")\n    monkeypatch.setenv(marker_name, "not-a-boolean")\n\n    configured = Settings.from_env()\n\n    assert configured.auth_enabled is False\n\n\ndef test_compose_forwards_only_names_only_legacy_presence_markers() -> None:\n    compose = COMPOSE_PATH.read_text(encoding="utf-8")\n\n    for legacy_name, marker_name in LEGACY_AUTH_ENV_MARKERS:\n        assert f'      {marker_name}: "${{{legacy_name}:+true}}"' in compose\n        assert f"      {legacy_name}:" not in compose\n\n\ndef test_machine_authentication_uses_fixed_operator_subject''',
          )
          replace_once(
              'backend/tests/unit/test_operator_auth_secret_isolation.py',
              '    monkeypatch.setenv("QUAZONAI_AUTH_PASSWORD", legacy_password)\n    configured = replace(',
              '    monkeypatch.setenv("QUAZONAI_AUTH_PASSWORD", legacy_password)\n    monkeypatch.setenv("QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT", "true")\n    monkeypatch.setenv("QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT", "true")\n    configured = replace(',
          )
          replace_once(
              'backend/tests/unit/test_operator_auth_secret_isolation.py',
              '        "QUAZONAI_AUTH_ENABLED",\n        "QUAZONAI_AUTH_USERNAME",',
              '        "QUAZONAI_AUTH_ENABLED",\n        "QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT",\n        "QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT",\n        "QUAZONAI_AUTH_USERNAME",',
          )
          replace_once(
              '.github/workflows/ci.yml',
              '      - name: Compose configuration\n        run: docker compose --env-file .env.example config --quiet\n',
              '''      - name: Compose configuration\n        run: |\n          docker compose --env-file .env.example config --quiet\n          QUAZONAI_AUTH_ENABLED=true \\\n          QUAZONAI_AUTH_USERNAME=legacy-username-must-not-leak \\\n          QUAZONAI_AUTH_PASSWORD=legacy-password-must-not-leak \\\n            docker compose --env-file .env.example config --format json > /tmp/quazonai-compose.json\n          python - <<'PY_INNER'\n          import json\n          from pathlib import Path\n\n          rendered = Path("/tmp/quazonai-compose.json").read_text(encoding="utf-8")\n          config = json.loads(rendered)\n          environment = config["services"]["api"]["environment"]\n          assert environment["QUAZONAI_AUTH_LEGACY_USERNAME_PRESENT"] == "true"\n          assert environment["QUAZONAI_AUTH_LEGACY_PASSWORD_PRESENT"] == "true"\n          assert "QUAZONAI_AUTH_USERNAME" not in environment\n          assert "QUAZONAI_AUTH_PASSWORD" not in environment\n          assert "legacy-username-must-not-leak" not in rendered\n          assert "legacy-password-must-not-leak" not in rendered\n          PY_INNER\n''',
          )
          replace_once(
              'DESIGN.md',
              '旧浏览器 username/password 环境变量已退出受支持配置。认证启用时只要检测到任一非空旧变量，API 必须在启动阶段 fail closed，并且错误只指出变量名而不输出其值；这些旧值不得进入 `Settings`、日志、API、Cookie 或登录验证逻辑。认证关闭时仍保持 direct access，旧变量仅作为 dormant process environment 被忽略。',
              '旧浏览器 username/password 环境变量已退出受支持配置。认证启用时只要检测到任一非空旧变量，API 必须在启动阶段 fail closed，并且错误只指出变量名而不输出其值；Compose 不得把旧 Secret 值转发进 API 容器，只能用 `${QUAZONAI_AUTH_USERNAME:+true}` / `${QUAZONAI_AUTH_PASSWORD:+true}` 派生内部 names-only presence marker，由启动校验按原变量名拒绝；这些旧值与 marker 都不得进入 `Settings`、日志、API、Cookie 或登录验证逻辑。认证关闭时仍保持 direct access，旧变量与 marker 仅作为 dormant process environment 被忽略。',
          )
          replace_once(
              'OPERATIONS.md',
              '升级到 TOTP-only 认证时：保留现有 TOTP setup key、cookie key、machine API token、public origin 与 TTL 配置；从 `.env`/部署 Secrets 中删除旧浏览器用户名和密码变量后重启 API。旧 session/trusted-browser cookie 会失效，使用当前 TOTP 重新登录并按需重新勾选 `Trust this browser`。无需数据库迁移；TOTP setup key 不变时无需重新绑定 Google Authenticator。',
              '升级到 TOTP-only 认证时：保留现有 TOTP setup key、cookie key、machine API token、public origin 与 TTL 配置；从 `.env`/部署 Secrets 中删除旧浏览器用户名和密码变量后重启 API。Compose 只向 API 传递旧变量是否存在的 names-only marker，不转发旧 Secret 值；认证启用时遗留任一非空旧值都会按原变量名使启动 fail closed。旧 session/trusted-browser cookie 会失效，使用当前 TOTP 重新登录并按需重新勾选 `Trust this browser`。无需数据库迁移；TOTP setup key 不变时无需重新绑定 Google Authenticator。',
          )
          replace_once(
              'README.md',
              'TOTP-only is single-factor authentication and is weaker against online guessing than password + TOTP. Internet-facing deployments should still use HTTPS, narrowly scoped trusted-proxy configuration, and deployment-level network access controls. Non-empty deprecated browser username/password environment settings fail startup closed when authentication is enabled. This migration also invalidates pre-v3 session/trusted-browser cookies, so upgraded browsers must enter one current TOTP once; no database migration or authenticator re-binding is required when the TOTP setup secret is unchanged.',
              'TOTP-only is single-factor authentication and is weaker against online guessing than password + TOTP. Internet-facing deployments should still use HTTPS, narrowly scoped trusted-proxy configuration, and deployment-level network access controls. Non-empty deprecated browser username/password environment settings fail startup closed when authentication is enabled; Compose forwards only names-only presence markers and never the retired secret values. This migration also invalidates pre-v3 session/trusted-browser cookies, so upgraded browsers must enter one current TOTP once; no database migration or authenticator re-binding is required when the TOTP setup secret is unchanged.',
          )

          if not changed:
              raise SystemExit('no repair changes were required')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/settings.py backend/src/runners/research_missions.py \
            backend/tests/unit/test_operator_auth_totp_only_contract.py \
            backend/tests/unit/test_operator_auth_secret_isolation.py \
            compose.yml .github/workflows/ci.yml DESIGN.md OPERATIONS.md README.md
          git commit -m 'fix(auth): preserve legacy Compose fail-closed guard'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai_auth_e2e
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai_auth_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai_auth_e2e
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai_auth_e2e
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      QUAZONAI_PACKAGE_ROOT: /tmp/quazonai-auth-e2e/packages
      QUAZONAI_MISSION_ROOT: /tmp/quazonai-auth-e2e/missions
      CODEX_HOME: /tmp/quazonai-auth-e2e/codex-home
      QUAZONAI_AUTH_ENABLED: 'true'
      QUAZONAI_AUTH_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      QUAZONAI_AUTH_COOKIE_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      QUAZONAI_API_TOKEN: auth-e2e-machine-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      QUAZONAI_AUTH_PUBLIC_ORIGIN: http://127.0.0.1:4173
      QUAZONAI_AUTH_SESSION_TTL_SECONDS: '43200'
      QUAZONAI_AUTH_TRUSTED_BROWSER_TTL_DAYS: '30'
      QUAZONAI_E2E_AUTH_ENABLED: 'true'
      QUAZONAI_E2E_AUTH_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend test runtime
        run: python -m pip install -e 'backend[dev,research]'
      - name: Migrate auth E2E database
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Start authenticated FastAPI
        run: |
          nohup uvicorn main:create_app --factory --no-proxy-headers --host 127.0.0.1 --port 8000 >/tmp/quazonai-auth-api.log 2>&1 &
          echo $! >/tmp/quazonai-auth-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = 60 ]; then
              cat /tmp/quazonai-auth-api.log
              exit 1
            fi
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Authenticated browser lifecycle
        working-directory: frontend
        run: npx playwright test e2e/operator-auth.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-auth-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/quazonai-auth-api.log || true
      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f /tmp/quazonai-auth-api.pid ]; then kill "$(cat /tmp/quazonai-auth-api.pid)" || true; fi
