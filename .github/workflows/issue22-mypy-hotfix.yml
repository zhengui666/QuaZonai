name: Issue 22 mypy hotfix

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-mypy-hotfix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Repair Mission evidence typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/quant_runtime/workspace.py')
          text = path.read_text()
          old = '''            except QfError as exc:\n                with factory() as evidence_session:\n                    entry = evidence_session.get(SearchLedgerEntry, contract.experiment_id)\n                    if entry is not None:\n                        evidence_session.expunge(entry)\n                if entry is not None:\n                    write_evidence(workspace, entry)\n                else:\n                    write_workspace_json(\n'''
          new = '''            except QfError as exc:\n                with factory() as evidence_session:\n                    failed_entry = evidence_session.get(\n                        SearchLedgerEntry, contract.experiment_id\n                    )\n                    if failed_entry is not None:\n                        evidence_session.expunge(failed_entry)\n                if failed_entry is not None:\n                    write_evidence(workspace, failed_entry)\n                else:\n                    write_workspace_json(\n'''
          if text.count(old) != 1:
              raise SystemExit('workspace hotfix target not found exactly once')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/issue22-mypy-hotfix.yml').unlink()
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(runtime): type failed Mission evidence explicitly'
          git push --force-with-lease origin HEAD:feat/issue-22-remote-nautilus-runtime
