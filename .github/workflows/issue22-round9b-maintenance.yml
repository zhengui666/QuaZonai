name: Issue 22 round9b maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round9b_patch.py
      - .github/workflows/issue22-round9b-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply patch
        run: |
          python tools/issue22_round9b_patch.py
          rm tools/issue22_round9b_patch.py .github/workflows/issue22-round9b-maintenance.yml
          git diff --check
          python -m compileall -q backend/src nautilus_runtime/src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): close round9 CI regressions'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
