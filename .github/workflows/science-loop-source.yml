# Temporary exact authored import/module correction. Remove before delivery.
name: Native scientific loop preparation
on:
  pull_request:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  prepare:
    if: github.head_ref == 'codex/native-science-feedback-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Apply only the exact authored source and native formatting
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/scientific-source"
          git rev-parse HEAD > "$RUNNER_TEMP/scientific-source/tested-commit.txt"
          cat .github/science-loop.part1 .github/science-loop.part2 | gzip -dc > "$RUNNER_TEMP/scientific-source/authored.patch"
          git apply --check "$RUNNER_TEMP/scientific-source/authored.patch"
          git apply "$RUNNER_TEMP/scientific-source/authored.patch"
          cat > "$RUNNER_TEMP/scientific-source/imports.patch" <<'PATCH'
          --- a/apps/job/tests/support/market.rs
          +++ b/apps/job/tests/support/market.rs
          @@ -7,3 +7,3 @@
           mod market_catalog;
           pub use market_catalog::{count, instant, INTERVAL_NS};
          -use contracts::{portfolio::AllocationTargetV1, science::*, DbCounter, SchemaV1};
          +use contracts::{science::*, SchemaV1};
          PATCH
          git apply --check "$RUNNER_TEMP/scientific-source/imports.patch"
          git apply "$RUNNER_TEMP/scientific-source/imports.patch"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > "$RUNNER_TEMP/scientific-source/rustc.txt"
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all
          git diff --check
          git diff --exit-code -- Cargo.lock
      - name: Return exact source without commit, push or ref updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          const corrected = [
            'apps/job/tests/support/market.rs', 'apps/job/tests/support/market_catalog.rs',
            'apps/runtime/tests/native_research_loop.rs', 'apps/runtime/tests/support/scientific_catalog.rs',
            'tests/support/cycles.rs',
          ].sort();
          const changed = [
            ...execFileSync('git', ['diff', '--name-only', '-z', 'HEAD'], { encoding: 'utf8' }).split('\0'),
            ...execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z'], { encoding: 'utf8' }).split('\0'),
          ].filter(Boolean).sort();
          if (JSON.stringify(changed) !== JSON.stringify(corrected)) throw new Error('Unexpected source changes');
          const expected = [...corrected,
            '.github/workflows/native-runtime.yml', '.opensdlc/tasks/personal-production/task.md',
            'apps/runtime/tests/support/scientific_feedback.rs', 'apps/server/tests/support/codex_responses.rs',
            'docs/architecture/issue-62-execution.md',
          ].sort();
          const entries = [];
          for (const path of expected) {
            const content = await readFile(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (response.status !== 201) throw new Error(`Source staging failed: ${response.status}`);
            const blob = await response.json();
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            const output = `${process.env.RUNNER_TEMP}/scientific-source/files/${path}`;
            await mkdir(dirname(output), { recursive: true });
            await writeFile(output, content);
          }
          await writeFile(`${process.env.RUNNER_TEMP}/scientific-source/entries.json`, JSON.stringify({
            source_head: process.env.EXPECTED_HEAD, entries,
          }, null, 2) + '\n');
          NODE
      - name: Check native types and lints without changing the lock
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo clippy --locked -p runtime --all-targets --features native-oci --message-format=json -- -D warnings > "$RUNNER_TEMP/scientific-source/compiler.jsonl" 2> "$RUNNER_TEMP/scientific-source/compiler.stderr"
          git diff --exit-code -- Cargo.lock
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scientific-source'
          for entry in json.loads((root / 'entries.json').read_text())['entries']:
              path = entry['path']
              assert pathlib.Path(path).read_bytes() == (root / 'files' / path).read_bytes(), path
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scientific-source-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/scientific-source/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
