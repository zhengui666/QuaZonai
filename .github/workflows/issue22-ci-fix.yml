name: Apply Issue 22 CI regression fix

on:
  push:
    branches: [feat/issue-22-remote-nautilus-runtime]
    paths: [.github/workflows/issue22-ci-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Patch regression and mandate semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: patch anchor count={text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'backend/tests/integration/test_degradation_feedback.py',
              '''        unrelated_branch = ResearchBranch(\n''',
              '''        session.add(source)\n        session.flush()\n        unrelated_branch = ResearchBranch(\n''',
          )
          replace(
              'backend/tests/integration/test_degradation_feedback.py',
              '''        session.add_all([source, unrelated_branch, alpha, portfolio_program, downstream])\n''',
              '''        session.add_all([unrelated_branch, alpha, portfolio_program, downstream])\n''',
          )

          replace(
              'backend/src/quant_runtime/promotion.py',
              '''        actual = abs(\n            _require_evidence_metric(evidence, constraint=key, aliases=aliases)\n            if key == "max_drawdown"\n            else _require_evidence_metric(evidence, constraint=key, aliases=aliases)\n        )\n''',
              '''        actual = _require_evidence_metric(evidence, constraint=key, aliases=aliases)\n        if key == "max_drawdown":\n            actual = abs(actual)\n''',
          )

          old = '''        current_constraints = _validate_mandate_before_simulation(persisted_mandate, alpha)\n        if current_constraints != mandate_constraints:\n            raise QfError(\n                "PORTFOLIO_MANDATE_CHANGED",\n                "The bound Portfolio Mandate constraints changed during simulation.",\n                409,\n            )\n        _validate_mandate_after_simulation(current_constraints, simulation_evidence)\n        persisted_alpha = session.get(AlphaQualification, alpha_id)\n        if (\n            persisted_alpha is None\n            or persisted_alpha.state != "ACTIVE"\n            or persisted_alpha.degradation_state != "HEALTHY"\n        ):\n            raise QfError("ALPHA_NOT_PORTFOLIO_READY", "Selected Alpha changed before promotion.", 409)\n'''
          new = '''        persisted_alpha = session.get(AlphaQualification, alpha_id)\n        if (\n            persisted_alpha is None\n            or persisted_alpha.state != "ACTIVE"\n            or persisted_alpha.degradation_state != "HEALTHY"\n        ):\n            raise QfError("ALPHA_NOT_PORTFOLIO_READY", "Selected Alpha changed before promotion.", 409)\n        current_constraints = _validate_mandate_before_simulation(\n            persisted_mandate, persisted_alpha\n        )\n        if current_constraints != mandate_constraints:\n            raise QfError(\n                "PORTFOLIO_MANDATE_CHANGED",\n                "The bound Portfolio Mandate constraints changed during simulation.",\n                409,\n            )\n        _validate_mandate_after_simulation(current_constraints, simulation_evidence)\n'''
          replace('backend/src/quant_runtime/promotion.py', old, new)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/issue22-ci-fix.yml
      - name: Validate
        run: |
          python -m pip install --disable-pip-version-check -e 'backend[dev,research,agent]'
          python -m compileall -q backend/src
          ruff check --config backend/pyproject.toml backend/src backend/tests
          mypy --config-file backend/pyproject.toml backend/src
          pytest -q backend/tests/integration/test_degradation_feedback.py backend/tests/integration/test_nautilus_promotion.py backend/tests/integration/test_issue22_final_guards.py
      - name: Commit
        run: |
          git config user.name 'QuaZonai Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): preserve governance semantics under CI'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
