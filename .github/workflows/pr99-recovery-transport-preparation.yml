name: PR99 recovery and explicit transport preparation
on:
  push:
    branches: [codex/pr99-recovery-transport-20260921]
permissions:
  contents: read
concurrency:
  group: pr99-recovery-transport-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    services:
      postgres:
        image: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-recovery-transport-test
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      SOURCE_BASE: 027e156f58c8de5b7ab2eedbf795b23e72771aea
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DATABASE_URL: postgresql://postgres:disposable-recovery-transport-test@127.0.0.1:55434/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only authored changes
        id: apply
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr99-recovery-transport
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_BASE"
          git apply --check .github/pr99-recovery-transport.patch
          git apply .github/pr99-recovery-transport.patch
          git diff --name-only > /tmp/pr99-recovery-transport/authored-paths.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Native format and entrypoint regression
        id: rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          cargo test --locked -p server --bin server 2>&1 | tee /tmp/pr99-recovery-transport/worker-origin.log
          cargo clippy --locked -p server --bin server -- -D warnings 2>&1 | tee /tmp/pr99-recovery-transport/worker-clippy.log
      - name: Native frontend build and unit tests
        id: web
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web run build 2>&1 | tee /tmp/pr99-recovery-transport/web-build.log
          npm --prefix apps/web test 2>&1 | tee /tmp/pr99-recovery-transport/web-unit.log
      - name: Real browser recovery and theme state
        id: browser
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e -- tests/error-boundary.spec.ts tests/theme.spec.ts 2>&1 | tee /tmp/pr99-recovery-transport/browser.log
      - name: Native quota and lock regression in both test owners
        id: quota
        run: |
          set -euo pipefail
          scenario=qualified_portfolio::automatic_rebalance::quota::rebalance_daily_quota_survives_cancellation_and_policy_replacement
          cargo clippy --locked -p store --test experiment_compilations -- -D warnings 2>&1 | tee /tmp/pr99-recovery-transport/quota-clippy.log
          for repetition in 1 2 3; do
            cargo test --locked -p store --test experiment_compilations "$scenario" -- --exact --test-threads=4 2>&1 | tee "/tmp/pr99-recovery-transport/quota-store-$repetition.log"
          done
          cargo test --locked -p server --test portfolio_study_http "$scenario" -- --exact --test-threads=4 2>&1 | tee /tmp/pr99-recovery-transport/quota-http.log
      - name: Publish the verified tree only to this preparation branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_BASE" -- Cargo.lock apps/web/package-lock.json runtimes/codex/package-lock.json migrations contracts/generated apps/web/src/generated .github/workflows/ci.yml .github/workflows/web.yml .github/workflows/native-runtime.yml .github/workflows/personal-hosting.yml .github/workflows/codeql.yml
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          authored = set(Path('/tmp/pr99-recovery-transport/authored-paths.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == authored
          PY
          git rm .github/pr99-recovery-transport.patch .github/workflows/pr99-recovery-transport-preparation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain session theme and explicit Worker transport through recovery'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/pr99-recovery-transport-20260921 | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/pr99-recovery-transport-20260921
          git rev-parse HEAD > /tmp/pr99-recovery-transport/published-commit.txt
      - name: Preserve exact source and actual outcomes
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr99-recovery-transport
          printf '%s\n' "$STEP_RESULTS" > /tmp/pr99-recovery-transport/steps.json
          printf '%s\n' "$EXPECTED_HEAD" > /tmp/pr99-recovery-transport/input-commit.txt
          git add -A
          git archive "$(git write-tree)" | gzip > /tmp/pr99-recovery-transport/source.tar.gz
          git diff "$SOURCE_BASE" --stat > /tmp/pr99-recovery-transport/diff-stat.txt
          if test -d apps/web/test-results; then cp -R apps/web/test-results /tmp/pr99-recovery-transport/browser-results; fi
          printf 'Focused preparation only; named quota repetitions are not full Store/HTTP acceptance. All original final-Head PR CI and explicit independent read-only review remain required. No real account or owner-host deployment.\n' > /tmp/pr99-recovery-transport/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr99-recovery-transport-${{ github.run_id }}
          path: /tmp/pr99-recovery-transport
          if-no-files-found: error
          retention-days: 7
