name: Commit OpenAPI Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: commit-openapi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: sqlite+pysqlite:///:memory:
      QUAZONAI_ALEMBIC_URL: sqlite+pysqlite:///:memory:
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e 'backend[dev]'
      - name: Export canonical FastAPI contract
        run: |
          mkdir -p contracts/openapi
          python - <<'PY'
          import json
          from pathlib import Path
          from main import create_app
          from settings import Settings
          document = create_app(settings=Settings.from_env()).openapi()
          Path('contracts/openapi/quazonai-v1.json').write_text(
              json.dumps(document, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit snapshot only when generated contract differs
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          path=contracts/openapi/quazonai-v1.json
          if [ -z "$(git status --porcelain -- "$path")" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'build: export canonical OpenAPI contract'
          git push origin "HEAD:$BRANCH"
