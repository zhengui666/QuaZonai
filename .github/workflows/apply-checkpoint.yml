name: Apply exact prepared review source (one-time development)
on:
  pull_request:
    paths: ['.github/workflows/apply-checkpoint.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'zhengui666/QuaZonai' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply only fixed patch bytes with native Git, never execute product code
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor e8668ca850def834735414ed9ba94fed38d4aa7e HEAD
          cat .github/checkpoint/0 .github/checkpoint/1 .github/checkpoint/2 .github/checkpoint/3 .github/checkpoint/4 .github/checkpoint/5 .github/checkpoint/6 | base64 --decode | gzip -dc > /tmp/prepared.patch
          test "$(git hash-object /tmp/prepared.patch)" = fb648efbab67b70797cbc82c31c95dee666d5cfa
          git apply --check /tmp/prepared.patch
          git apply --index --whitespace=error /tmp/prepared.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(review): reserve mission turns and bound generated bigint contracts' -m 'Apply exact executor-prepared source verified locally with the unchanged committed Cargo lock. Follow-up CI must independently validate the resulting Head. No full-system acceptance is claimed.'
          git push origin HEAD:refs/heads/rewrite/issue-62-rust-evidence
