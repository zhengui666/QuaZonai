name: Issue 37 Finalize

on:
  pull_request:
    paths:
      - '.github/scripts/issue37_finalize.py'
      - '.github/workflows/issue37-finalize.yml'
      - 'DESIGN.md'
      - 'OPERATIONS.md'
      - 'README.md'
      - 'CLI.md'
      - 'backend/**'
      - 'frontend/**'
      - 'skills/**'

permissions:
  contents: write

concurrency:
  group: issue-37-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply final contract cleanup
        run: python .github/scripts/issue37_finalize.py
      - name: Remove one-shot finalizer
        run: rm .github/scripts/issue37_finalize.py .github/workflows/issue37-finalize.yml
      - name: Syntax-check Python changes
        run: python -m compileall -q backend/src backend/tests
      - name: Commit finalized implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'QuaZonai CI Finalizer'
          git config user.email 'quazonai-ci@localhost'
          git add -A
          git commit -m 'fix(auth): complete TOTP-only contract migration'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
