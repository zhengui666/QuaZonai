# Temporary native execution entry. Delete this and its exact patches before delivery.
# Applies only assistant-authored patches; no model, commit, branch update or push.
name: Runtime SQLite dependency resolution
on:
  pull_request:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  resolve:
    name: Draft / native lockfile and compatibility diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Record the exact source and native compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/sqlite-resolution"
          git rev-parse HEAD > "$RUNNER_TEMP/sqlite-resolution/tested-commit.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/sqlite-resolution/source.tar"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > "$RUNNER_TEMP/sqlite-resolution/rustc.txt"
      - name: Apply only the exact authored patches and native formatting
        run: |
          set -euo pipefail
          if test -f .github/sqlx-compatibility.patch.gz; then
            gzip --decompress --stdout .github/sqlx-compatibility.patch.gz > "$RUNNER_TEMP/sqlite-resolution/authored.patch"
            git apply --check --unidiff-zero "$RUNNER_TEMP/sqlite-resolution/authored.patch"
            git apply --unidiff-zero "$RUNNER_TEMP/sqlite-resolution/authored.patch"
            if test -f .github/sqlx-borrowed.patch; then
              git apply --check --unidiff-zero .github/sqlx-borrowed.patch
              git apply --unidiff-zero .github/sqlx-borrowed.patch
            fi
            if test -f .github/sqlx-docs.patch; then
              git apply --check --unidiff-zero .github/sqlx-docs.patch
              git apply --unidiff-zero .github/sqlx-docs.patch
            fi
            rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all
          fi
      - name: Resolve the declared versions using Cargo, not handwritten checksums
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo metadata --format-version 1 --all-features > "$RUNNER_TEMP/sqlite-resolution/cargo-metadata.json"
          cp Cargo.lock "$RUNNER_TEMP/sqlite-resolution/Cargo.lock"
          rustup run "$RUSTUP_TOOLCHAIN" cargo tree --locked -p runtime --edges normal,build > "$RUNNER_TEMP/sqlite-resolution/runtime-dependencies.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/sqlite-resolution/applied.diff"
      - name: Stage exact file blobs without publishing any commit or branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          const files = execFileSync('git', ['diff', '--name-only', '-z', 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          if (!files.includes('Cargo.lock')) files.unshift('Cargo.lock');
          const entries = [];
          for (const path of files) {
            if (!['Cargo.lock', 'docs/research/reuse.md', 'DESIGN.md'].includes(path) && !/^(apps|crates|tests)\/.*\.rs$/.test(path)) {
              throw new Error(`Unexpected generated change: ${path}`);
            }
            const content = await readFile(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (response.status !== 201) throw new Error(`File blob staging failed: HTTP ${response.status}`);
            const blob = await response.json();
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            const output = `${process.env.RUNNER_TEMP}/sqlite-resolution/files/${path}`;
            await mkdir(dirname(output), { recursive: true });
            await writeFile(output, content);
          }
          await writeFile(`${process.env.RUNNER_TEMP}/sqlite-resolution/staged-files.json`, JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            source_head: process.env.EXPECTED_HEAD,
            entries,
          }, null, 2) + '\n');
          NODE
      - name: Compile all workspace targets against the generated lockfile
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo check --locked --workspace --all-targets --all-features --message-format=json > "$RUNNER_TEMP/sqlite-resolution/compiler.jsonl"
          git diff --binary HEAD > "$RUNNER_TEMP/sqlite-resolution/after-check.diff"
          cmp "$RUNNER_TEMP/sqlite-resolution/applied.diff" "$RUNNER_TEMP/sqlite-resolution/after-check.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sqlite-resolution-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/sqlite-resolution/
          retention-days: 7
          if-no-files-found: error
