name: Rewrite dependency bootstrap (not acceptance)

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'crates/**'
      - 'runtimes/**'
      - 'tests/native/**'
      - 'tools/lock_science_runtime.py'
      - '.github/workflows/rewrite-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewrite-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Resolve candidate dependency locks
        run: |
          set -euo pipefail
          mkdir -p /tmp/qz-bootstrap-evidence
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python -m pip install uv==0.8.15
          uv pip compile --quiet --python-version 3.12 --generate-hashes --only-binary :all: runtimes/science/versions.txt -o /tmp/qz-bootstrap-evidence/science-requirements.lock
          cp Cargo.lock /tmp/qz-bootstrap-evidence/Cargo.lock
          cargo fmt --all -- --check
      - name: Compile and test Rust probe
        run: |
          set -euo pipefail
          export PYO3_PYTHON="$(command -v python)"
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked -p qz-job
      - name: Install exact scientific dependencies
        run: uv pip install --python "$(command -v python)" --require-hashes -r /tmp/qz-bootstrap-evidence/science-requirements.lock
      - name: Independent upstream numerical reference
        run: python tests/native/test_upstream_compatibility.py
      - name: Execute Rust bridge and Arrow round trip
        run: target/debug/qz-job verify-native --output /tmp/qz-bootstrap-evidence/native
      - name: Export verified platform dependency lock
        run: |
          set -euo pipefail
          mkdir /tmp/qz-verified-wheels
          python -m pip download --only-binary=:all: --require-hashes --no-deps -r /tmp/qz-bootstrap-evidence/science-requirements.lock -d /tmp/qz-verified-wheels
          python tools/lock_science_runtime.py /tmp/qz-verified-wheels /tmp/qz-bootstrap-evidence/science-linux-x86_64.lock
      - name: Install pinned native Codex and generate its real protocol schemas
        run: |
          set -euo pipefail
          npm install --prefix runtimes/codex --ignore-scripts --no-audit --no-fund
          test "$(runtimes/codex/node_modules/.bin/codex --version)" = 'codex-cli 0.144.4'
          mkdir /tmp/qz-codegen-home
          CODEX_HOME=/tmp/qz-codegen-home runtimes/codex/node_modules/.bin/codex app-server generate-json-schema --out /tmp/qz-bootstrap-evidence/codex-schema
          cp runtimes/codex/package-lock.json /tmp/qz-bootstrap-evidence/codex-package-lock.json
      - name: Verify actual Codex stdio handshake and complete model pagination
        run: |
          set -euo pipefail
          export CODEX_NATIVE_BIN="$PWD/runtimes/codex/node_modules/.bin/codex"
          export CODEX_PROBE_DIR=/tmp/qz-codex-probe
          timeout --kill-after=5s 90s cargo run --locked -p qz-job --example codex_contract
          cp /tmp/qz-codex-probe/codex-probe.json /tmp/qz-bootstrap-evidence/codex-probe.json
      - name: Export exact source snapshot for offline development
        if: always()
        run: |
          mkdir -p /tmp/qz-bootstrap-evidence
          git archive --format=tar HEAD | gzip > /tmp/qz-bootstrap-evidence/source.tar.gz
      - name: Upload generated locks and actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rewrite-bootstrap-${{ github.sha }}
          path: /tmp/qz-bootstrap-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Export native Codex development dependency
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/qz-dev-codex
          tar -C runtimes/codex -I 'zstd -T0 -3' -cf /tmp/qz-dev-codex/codex.tar.zst node_modules
      - name: Upload native Codex development dependency
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rewrite-dev-codex-${{ github.sha }}
          path: /tmp/qz-dev-codex/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  pgmq-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start isolated upstream PostgreSQL and PGMQ
        run: |
          set -euo pipefail
          docker pull ghcr.io/pgmq/pg18-pgmq:v1.10.0
          docker run --detach --name qz-pgmq-w0 --env POSTGRES_PASSWORD=fixture-only-disposable ghcr.io/pgmq/pg18-pgmq:v1.10.0
          for attempt in $(seq 1 60); do
            if docker exec qz-pgmq-w0 pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec qz-pgmq-w0 pg_isready -U postgres
      - name: Verify native transaction rollback, redelivery, and acknowledgement
        run: |
          set -euo pipefail
          mkdir -p /tmp/qz-pgmq-evidence
          docker image inspect --format '{{json .RepoDigests}}' ghcr.io/pgmq/pg18-pgmq:v1.10.0 > /tmp/qz-pgmq-evidence/image-version.json
          docker exec -i qz-pgmq-w0 psql -U postgres -v ON_ERROR_STOP=1 < tests/native/pgmq_contract.sql | tee /tmp/qz-pgmq-evidence/contract.log
      - name: Preserve actual PGMQ evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rewrite-pgmq-${{ github.sha }}
          path: /tmp/qz-pgmq-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable upstream instance
        if: always()
        run: docker rm --force --volumes qz-pgmq-w0
