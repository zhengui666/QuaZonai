name: Rewrite W0 compatibility (not full acceptance)

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'crates/**'
      - 'runtimes/**'
      - 'tests/native/**'
      - 'tools/lock_science_runtime.py'
      - 'DESIGN.md'
      - 'docs/architecture/**'
      - '.github/workflows/rewrite-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewrite-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Check committed Rust sources without rewriting them
        run: |
          set -euo pipefail
          mkdir -p /tmp/qz-bootstrap-evidence
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
      - name: Compile and test using the committed Cargo lock
        run: |
          set -euo pipefail
          export PYO3_PYTHON="$(command -v python)"
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked -p qz-job
      - name: Install scientific wheels using the committed platform hash lock
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r runtimes/science/requirements.lock
      - name: Independent upstream numerical reference
        run: python tests/native/test_upstream_compatibility.py
      - name: Execute Rust bridge and Arrow round trip
        run: target/debug/qz-job verify-native --output /tmp/qz-bootstrap-evidence/native
      - name: Install locked native Codex and generate its actual protocol schemas
        run: |
          set -euo pipefail
          npm ci --prefix runtimes/codex --ignore-scripts --no-audit --no-fund
          CODEX_NATIVE_BIN="$PWD/runtimes/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test "$("$CODEX_NATIVE_BIN" --version)" = 'codex-cli 0.144.4'
          mkdir /tmp/qz-codegen-home
          CODEX_HOME=/tmp/qz-codegen-home "$CODEX_NATIVE_BIN" app-server generate-json-schema --out /tmp/qz-bootstrap-evidence/codex-schema
      - name: Verify native stdio handshake and complete model pagination
        run: |
          set -euo pipefail
          # Own the native process directly, not a JavaScript wrapper's child.
          export CODEX_NATIVE_BIN="$PWD/runtimes/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          export CODEX_PROBE_DIR=/tmp/qz-codex-probe
          timeout --kill-after=5s 90s cargo run --locked -p qz-job --example codex_contract
          cp /tmp/qz-codex-probe/codex-probe.json /tmp/qz-bootstrap-evidence/codex-probe.json
      - name: Verify validation did not modify tracked sources
        run: git diff --exit-code
      - name: Export exact tested source and committed dependency locks
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/qz-bootstrap-evidence
          git rev-parse HEAD > /tmp/qz-bootstrap-evidence/tested-commit.txt
          git archive --format=tar HEAD | gzip > /tmp/qz-bootstrap-evidence/source.tar.gz
          cp Cargo.lock /tmp/qz-bootstrap-evidence/Cargo.lock
          cp runtimes/science/requirements.lock /tmp/qz-bootstrap-evidence/science-requirements.lock
          cp runtimes/codex/package-lock.json /tmp/qz-bootstrap-evidence/codex-package-lock.json
      - name: Upload actual compatibility evidence, not acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rewrite-bootstrap-${{ github.sha }}
          path: /tmp/qz-bootstrap-evidence/
          if-no-files-found: error
          retention-days: 7

  pgmq-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGMQ_IMAGE: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start isolated upstream PostgreSQL and PGMQ by immutable digest
        run: |
          set -euo pipefail
          docker pull "$PGMQ_IMAGE"
          docker run --detach --name qz-pgmq-w0 --env POSTGRES_PASSWORD=fixture-only-disposable "$PGMQ_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec qz-pgmq-w0 pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec qz-pgmq-w0 pg_isready -U postgres
      - name: Verify native transaction rollback, redelivery, and acknowledgement
        run: |
          set -euo pipefail
          mkdir -p /tmp/qz-pgmq-evidence
          docker image inspect --format '{{json .RepoDigests}}' "$PGMQ_IMAGE" > /tmp/qz-pgmq-evidence/image-version.json
          docker exec -i qz-pgmq-w0 psql -U postgres -v ON_ERROR_STOP=1 < tests/native/pgmq_contract.sql | tee /tmp/qz-pgmq-evidence/contract.log
      - name: Preserve actual PGMQ evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rewrite-pgmq-${{ github.sha }}
          path: /tmp/qz-pgmq-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable upstream instance
        if: always()
        run: docker rm --force --volumes qz-pgmq-w0
