name: Prepare local console integration
on:
  push:
    branches: [codex/local-ui-simplification-20260920]
    paths: ['.github/workflows/prepare-local-console.yml']
permissions:
  contents: read
concurrency:
  group: local-console-integration
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      MAIN: 2135def63ddde3e09d8e20ed4d2e31a6674d3c15
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate only the pinned main with authored conflict resolution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$MAIN^{commit}"
          mkdir -p /tmp/console-integration
          printf '%s\n' "$EXPECTED_HEAD" > /tmp/console-integration/input-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff --no-edit "$MAIN" > /tmp/console-integration/merge.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          python3 - <<'PY'
          import json, pathlib, subprocess
          expected=['apps/web/src/alphas.tsx','apps/web/src/generated/responses.cjs']
          actual=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          assert actual==expected,actual
          edits=json.loads(pathlib.Path('.github/local-console-integration.json').read_text())
          for edit in edits:
              path=pathlib.Path(edit['path'])
              assert str(path) in {'apps/web/src/alphas.tsx','apps/server/tests/support/equity_curve.rs','apps/web/tests/equity-curve.spec.ts','.opensdlc/tasks/local-ui-simplification-20260920/task.md'}
              content=path.read_text()
              assert content.count(edit['old'])==1,str(path)
              path.write_text(content.replace(edit['old'],edit['new']))
          PY
          # Bootstrap the generator from original bytes, never hand-edit generated code.
          git checkout --ours -- apps/web/src/generated/responses.cjs
          git add apps/web/src/alphas.tsx apps/web/src/generated/responses.cjs
          test -z "$(git diff --name-only --diff-filter=U)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the original native toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Format source and generate original Rust contracts
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee /tmp/console-integration/format.log
          cargo run --locked -q -p contracts --example generate > /tmp/console-integration/domain-v1.openapi.json
          mv /tmp/console-integration/domain-v1.openapi.json contracts/generated/domain-v1.openapi.json
          cargo run --locked -q -p server -- openapi > /tmp/console-integration/api-v2.openapi.json
          mv /tmp/console-integration/api-v2.openapi.json contracts/generated/api-v2.openapi.json
      - name: Generate and build the integrated frontend
        run: |
          set -euo pipefail
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web run build 2>&1 | tee /tmp/console-integration/web-build.log
      - name: Remove temporary files and publish the exact merge to the task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/local-console-integration.json .github/workflows/prepare-local-console.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: integrate native equity charts with local entry and both color themes'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/local-ui-simplification-20260920 | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/local-ui-simplification-20260920
          git rev-parse HEAD > /tmp/console-integration/published-commit.txt
      - name: Preserve actual outcomes and source
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/console-integration
          printf '%s\n' "$RESULTS" > /tmp/console-integration/steps.json
          git diff --stat HEAD > /tmp/console-integration/remaining-diff.txt
          python3 - <<'PY'
          import pathlib,subprocess,tarfile
          with tarfile.open('/tmp/console-integration/source.tar.gz','w:gz') as archive:
              for path in sorted(set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))):
                  if path and pathlib.Path(path).is_file(): archive.add(path,arcname=path,recursive=False)
          PY
          printf 'Preparation only: actual native formatting, contract generation and frontend build; not database/browser/runtime acceptance. No model coding or user account operation. Original final-Head CI and read-only review remain mandatory.\n' > /tmp/console-integration/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-integration-${{ github.run_id }}
          path: /tmp/console-integration
          retention-days: 7
          if-no-files-found: error
