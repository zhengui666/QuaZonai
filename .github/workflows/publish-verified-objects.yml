name: Temporary verified Git objects
on:
  pull_request:
    paths: ['.github/workflows/publish-verified-objects.yml']
permissions:
  contents: write
jobs:
  upload-objects:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      VERIFIED_BASE: e23c7f37b4754bcb060de9953eaaf2b3c8e04fcf
      BASE_TREE: dbd2447b6931c04a7174681344a44e47908338f7
      VERIFIED_TREE: 7a573474814440ef48c8e295ec9505e9fa362dc8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify an exact source tree, then upload objects without changing any ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$VERIFIED_BASE"
          test "$(git diff --name-only "$VERIFIED_BASE" "$EVENT_HEAD")" = '.github/workflows/publish-verified-objects.yml'
          : > "$RUNNER_TEMP/verified.patch.xz"
          for blob in ebf4b9343164a9bf56e733945fd510faeb9c3f8d ab1de655bd44af6689114b60aaa986f243918c40 8cb958c3ac1fadc960672499ca6dd55ef2ce89ad f267717e7552312f2050a2542fdbb3917803446c 061f12bb5b3a8b9c3552b0c5ca1fc43f6a8433ad 52b750fb7b6c19baadb7371849063e6990ffb2ee 6eaabe04e95350f6539acfbf1638dd37d0080484 e5a51a14d28c09b8d3ae0f66c87e728a352aa2c8 e40525b6cb8cf9e56b693a6d80e5f11c15c7d93d 21b97bf39bfdd4254d49dcabafd1252d2a2573c0 df19fcb4d0eeb440081db428659e877e4f6e0af3 629fcf653c3cb6373868e4be7a012b7045e17a02 09b6395d194de66da7dd04dbdd84cdc45fc8ec5d 92c921ac00861cc91a1158143377bb1ba8edce8e 576762be7a577fad7fabc57987eb20ef2e61f993; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/verified.patch.xz"
          done
          test "$(wc -c < "$RUNNER_TEMP/verified.patch.xz")" -eq 42384
          xz --decompress --stdout "$RUNNER_TEMP/verified.patch.xz" > "$RUNNER_TEMP/verified.patch"
          test "$(wc -c < "$RUNNER_TEMP/verified.patch")" -eq 288340
          git -c core.hooksPath=/dev/null checkout --detach "$VERIFIED_BASE"
          git -c core.hooksPath=/dev/null apply --check --index "$RUNNER_TEMP/verified.patch"
          git -c core.hooksPath=/dev/null apply --index "$RUNNER_TEMP/verified.patch"
          test "$(git write-tree)" = "$VERIFIED_TREE"
          git diff --cached --check
          test ! -e .github/workflows/publish-verified-objects.yml
          test -z "$(git diff --cached "$VERIFIED_BASE" -- Cargo.lock .github/workflows/ci.yml migrations/202609050001_domain.sql migrations/202609060001_browser_auth.sql migrations/202609060002_authority_invariants.sql migrations/202609060003_evidence_bindings.sql migrations/202609060004_doctor_boundary.sql migrations/202609060005_evaluation_publication.sql)"
          python3 - <<'PY'
          import base64, json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          def api(endpoint, body):
              result = subprocess.run(['gh','api','--method','POST',endpoint,'--input','-'], input=json.dumps(body).encode(), stdout=subprocess.PIPE, check=True)
              return json.loads(result.stdout)
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'zhengui666/QuaZonai':
              raise SystemExit('unexpected repository')
          entries = []
          names = git('diff','--cached','--name-only','--no-renames','-z').split(b'\0')
          for raw in filter(None, names):
              path = raw.decode('utf-8')
              staged = git('ls-files','--stage','--',path).decode().strip()
              if not staged:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              metadata, actual_path = staged.split('\t',1)
              mode, sha, stage = metadata.split()
              if actual_path != path or stage != '0' or mode not in ('100644','100755'):
                  raise SystemExit('unexpected index entry')
              content = git('cat-file','blob',sha)
              result = api(f'repos/{repo}/git/blobs', {'content':base64.b64encode(content).decode(), 'encoding':'base64'})
              if result['sha'] != sha:
                  raise SystemExit('native blob mismatch')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          if len(entries) != 35:
              raise SystemExit('unexpected changed file count')
          result = api(f'repos/{repo}/git/trees', {'base_tree':os.environ['BASE_TREE'],'tree':entries})
          if result['sha'] != os.environ['VERIFIED_TREE']:
              raise SystemExit('native tree mismatch')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(f"Uploaded exact native Git tree: `{result['sha']}`. 35 changed files. No commit or ref was changed; this is transport, not CI acceptance.\n")
          PY
