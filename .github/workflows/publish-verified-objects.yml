name: Temporary verified Git object transport
on:
  pull_request:
    paths: ['.github/workflows/publish-verified-objects.yml']
permissions:
  contents: write
jobs:
  upload-objects:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      VERIFIED_BASE: 6cada81a6f94bfa29831cf4ede220c8d3ca4e711
      BASE_TREE: c2924bbd5625867c90c8e199fe74cc88f5c817f3
      VERIFIED_TREE: 12be492cfd0c07681e1caab5fe8f93a1f8417e86
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the fixed candidate and upload native objects only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'zhengui666/QuaZonai'
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$VERIFIED_BASE"
          test "$(git diff --name-only "$VERIFIED_BASE" "$EVENT_HEAD")" = '.github/workflows/publish-verified-objects.yml'
          : > "$RUNNER_TEMP/review.patch.xz"
          for blob in baf20082894172c58e7e8c8755be0fcd36ecbfe2 5854f37f3c33dd53e47e23be251c5edbc941b029 e8aa991e269a1c205794ca23ebd3c73ed469a2d5; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/review.patch.xz"
          done
          test "$(wc -c < "$RUNNER_TEMP/review.patch.xz")" -eq 14208
          xz --decompress --stdout "$RUNNER_TEMP/review.patch.xz" > "$RUNNER_TEMP/review.patch"
          test "$(wc -c < "$RUNNER_TEMP/review.patch")" -eq 54218
          git -c core.hooksPath=/dev/null checkout --detach "$VERIFIED_BASE"
          git -c core.hooksPath=/dev/null apply --check --index "$RUNNER_TEMP/review.patch"
          git -c core.hooksPath=/dev/null apply --index "$RUNNER_TEMP/review.patch"
          test "$(git write-tree)" = "$VERIFIED_TREE"
          git diff --cached --check
          test ! -e .github/workflows/publish-verified-objects.yml
          test -z "$(git diff --cached --name-only -- Cargo.lock .github/workflows/ci.yml migrations/202609050001_domain.sql migrations/202609060001_browser_auth.sql migrations/202609060002_authority_invariants.sql migrations/202609060003_evidence_bindings.sql migrations/202609060004_doctor_boundary.sql migrations/202609060005_evaluation_publication.sql migrations/202609060006_upgrade_cutover.sql migrations/202609060007_control_authority.sql migrations/202609060008_machine_verification_limits.sql migrations/202609060009_native_sessions.sql)"
          : > "$RUNNER_TEMP/tree-entries.jsonl"
          count=0
          while IFS= read -r -d '' path; do
            staged="$(git ls-files --stage -- "$path")"
            test -n "$staged"
            metadata="${staged%%$'\t'*}"
            actual_path="${staged#*$'\t'}"
            read -r mode sha stage <<< "$metadata"
            test "$actual_path" = "$path"
            test "$stage" = '0'
            test "$mode" = '100644' -o "$mode" = '100755'
            git cat-file blob "$sha" | base64 -w 0 > "$RUNNER_TEMP/blob.b64"
            jq -n --rawfile content "$RUNNER_TEMP/blob.b64" '{content:$content,encoding:"base64"}' > "$RUNNER_TEMP/blob.json"
            actual_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)"
            test "$actual_sha" = "$sha"
            jq -cn --arg path "$path" --arg mode "$mode" --arg sha "$sha" '{path:$path,mode:$mode,type:"blob",sha:$sha}' >> "$RUNNER_TEMP/tree-entries.jsonl"
            count=$((count+1))
          done < <(git diff --cached --name-only --no-renames -z)
          test "$count" -eq 15
          jq -s --arg base "$BASE_TREE" '{base_tree:$base,tree:.}' "$RUNNER_TEMP/tree-entries.jsonl" > "$RUNNER_TEMP/tree.json"
          result="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree.json" --jq .sha)"
          test "$result" = "$VERIFIED_TREE"
          printf 'Uploaded verified native Git tree `%s`; %s changed files. No commit/ref changes, no tests or product acceptance are claimed by this transport.\n' "$result" "$count" >> "$GITHUB_STEP_SUMMARY"
