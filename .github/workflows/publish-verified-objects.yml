name: Temporary verified Git objects
on:
  pull_request:
    paths: ['.github/workflows/publish-verified-objects.yml']
permissions:
  contents: read
jobs:
  export-source:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      VERIFIED_BASE: 6999031ee7f70c79fc20f89aff04fb565860c316
      BASE_TREE: 5def870bb1e2b22b43da6448daf66d6fe0056037
      VERIFIED_TREE: 6b85afd88de8ffed0ff155b1aef0ee6f287d4e67
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Export exact public source and native blob references without any write API
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          git merge-base --is-ancestor "$VERIFIED_BASE" "$EVENT_HEAD"
          test "$(git rev-parse "$VERIFIED_BASE^{tree}")" = "$BASE_TREE"
          test "$(git diff --name-only "$VERIFIED_BASE" "$EVENT_HEAD")" = '.github/workflows/publish-verified-objects.yml'
          mkdir -p "$RUNNER_TEMP/verified-source"
          : > "$RUNNER_TEMP/verified-source/repair.patch.xz"
          for blob in c46ad120bb3de249e71c52e0ed130f73a27597f9 c6d99a8adc5f9ae1757ca4406409f7eb97ca7d4d 9f5410b4471652630a5fe434bf78270459149d45 ef12c832415bd351b7e17f1617b453fb3a28c877 b07e6dad35ca6b0a9fc3cf43f6133aa2b3bdaed1; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/verified-source/repair.patch.xz"
          done
          test "$(wc -c < "$RUNNER_TEMP/verified-source/repair.patch.xz")" -eq 21520
          xz --decompress --stdout "$RUNNER_TEMP/verified-source/repair.patch.xz" > "$RUNNER_TEMP/verified-source/repair.patch"
          test "$(wc -c < "$RUNNER_TEMP/verified-source/repair.patch")" -eq 86901
          git -c core.hooksPath=/dev/null checkout --detach "$VERIFIED_BASE"
          git -c core.hooksPath=/dev/null apply --check --index "$RUNNER_TEMP/verified-source/repair.patch"
          git -c core.hooksPath=/dev/null apply --index "$RUNNER_TEMP/verified-source/repair.patch"
          test "$(git write-tree)" = "$VERIFIED_TREE"
          git diff --cached --check
          git archive "$VERIFIED_TREE" | gzip > "$RUNNER_TEMP/verified-source/source.tar.gz"
          python3 - <<'PY'
          import json,os,subprocess
          def git(*args): return subprocess.check_output(['git',*args])
          entries=[]
          for raw in filter(None,git('diff','--cached','--name-only','--no-renames','-z').split(b'\0')):
              path=raw.decode()
              staged=git('ls-files','--stage','--',path).decode().strip()
              if not staged:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              metadata,actual=staged.split('\t',1)
              mode,sha,stage=metadata.split()
              assert actual==path and stage=='0' and mode in ('100644','100755')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          assert len(entries)==25
          with open(os.environ['RUNNER_TEMP']+'/verified-source/tree-elements.json','w') as f:
              json.dump(entries,f,indent=2)
          PY
          printf '%s\n' "$VERIFIED_TREE" > "$RUNNER_TEMP/verified-source/tree.txt"
          printf 'Public source transport only, not CI acceptance. No account, home, environment, database, user data or secrets.\n' > "$RUNNER_TEMP/verified-source/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source-${{ env.VERIFIED_TREE }}
          path: ${{ runner.temp }}/verified-source/
          retention-days: 1
          if-no-files-found: error
