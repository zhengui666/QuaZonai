name: Issue 36 Materialize

on:
  push:
    branches:
      - feat/ios-ipados-universal-app

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      QUAZONAI_ALEMBIC_URL: 'sqlite+pysqlite:///:memory:'
      QUAZONAI_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-ipados-universal-app
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install contract runtime
        run: python -m pip install -e 'backend[dev,research,agent]'
      - name: Materialize contracts docs and artwork
        run: |
          python tools/export_openapi.py --write
          python tools/generate_ios_assets.py
          python tools/materialize_issue36_docs.py
      - name: Commit materialized artifacts
        run: |
          touch .issue36-materialized
          git add DESIGN.md OPERATIONS.md README.md contracts/openapi/quazonai-v1.json ios/Packages/QuaZonaiAPI/Sources/QuaZonaiAPI/openapi.yaml ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png .issue36-materialized
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: materialize native client contracts and architecture'
          git push origin HEAD:feat/ios-ipados-universal-app
