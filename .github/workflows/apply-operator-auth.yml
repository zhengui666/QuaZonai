name: Apply operator authentication patch

on:
  push:
    branches:
      - codex/operator-totp-auth

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Materialize source changes
        run: |
          cat tools/auth-patch/part-* | base64 --decode | gzip --decompress > tools/apply_operator_auth.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_operator_auth.py")
          text = path.read_text(encoding="utf-8")
          path.write_text(
              text.replace("## Global invocation", "## Invocation grammar"),
              encoding="utf-8",
          )
          PY
          python tools/apply_operator_auth.py
          cat > backend/alembic/versions/0006_operator_auth.py <<'PYFILE'
          """Add the single-operator authentication state and trusted-browser registry.

          Revision ID: 0006_operator_auth
          Revises: 0005_performance_indexes
          """

          from __future__ import annotations

          from uuid import UUID

          import sqlalchemy as sa
          from alembic import op

          from db.models import OperatorAuthState, OperatorTotpUse, TrustedBrowser

          revision = "0006_operator_auth"
          down_revision = "0005_performance_indexes"
          branch_labels = None
          depends_on = None

          _AUTH_STATE_ID = UUID("a36fd7d7-f638-43f7-a0b6-5380b694408d")


          def upgrade() -> None:
              bind = op.get_bind()
              # 0001 creates current Base.metadata on a fresh database. checkfirst supports
              # both fresh upgrades and databases already stamped at 0005.
              for model in (OperatorAuthState, OperatorTotpUse, TrustedBrowser):
                  model.__table__.create(bind=bind, checkfirst=True)

              auth_state = OperatorAuthState.__table__
              existing = bind.execute(
                  sa.select(auth_state.c.id).where(auth_state.c.scope == "SYSTEM")
              ).scalar_one_or_none()
              if existing is None:
                  bind.execute(
                      sa.insert(auth_state).values(
                          id=_AUTH_STATE_ID,
                          scope="SYSTEM",
                          failed_attempts=0,
                      )
                  )


          def downgrade() -> None:
              bind = op.get_bind()
              for model in (TrustedBrowser, OperatorTotpUse, OperatorAuthState):
                  model.__table__.drop(bind=bind, checkfirst=True)
          PYFILE
          rm -rf tools/auth-patch tools/auth-patch-v2
          git diff --check
      - name: Research ownership boundary
        run: |
          test ! -e backend/src/api/deployments.py
          test ! -e backend/src/api/risk.py
          test ! -e backend/src/api/integrations.py
          test ! -e backend/src/db/deployment_models.py
          test ! -e backend/src/db/risk_models.py
          test ! -e backend/src/runners/live.py
          test ! -e backend/src/runners/live_node.py
          test ! -e backend/src/runners/live_supervisor.py
          test ! -d native/quazonai_nautilus_risk
          ! grep -R -n -E '/api/v1/(deployments|risk-accounts|execution-connections)|quazonai-live-supervisor|nautilus_trader' backend/src compose.yml backend/pyproject.toml
      - name: Install backend runtimes
        run: python -m pip install -e 'backend[dev,research,mcp,agent]'
      - name: Backend compile, lint and type check
        run: |
          python -m compileall -q backend/src backend/tests
          ruff check --config backend/pyproject.toml backend/src backend/tests
          mypy --config-file backend/pyproject.toml backend/src
      - name: Database preflight and migration
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Backend tests
        run: pytest -q backend/tests
      - name: Frontend install and checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(auth): add TOTP operator login'
          git push origin HEAD:codex/operator-totp-auth
