name: Issue 22 pipeline tests

on:
  push:
    branches:
      - issue-22-nautilus-first-remote-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'test: cover remote runtime failure and sealed blocking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-nautilus-first-remote-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/finalize_issue22_pipeline_tests.py
      - run: python -m pip install 'ruff>=0.15,<1'
      - run: ruff format --config backend/pyproject.toml backend/src/runners/quant_experiments.py backend/tests/integration/test_quant_experiment_pipeline.py scripts/finalize_issue22_pipeline_tests.py
      - run: ruff check --fix --config backend/pyproject.toml backend/src/runners/quant_experiments.py backend/tests/integration/test_quant_experiment_pipeline.py scripts/finalize_issue22_pipeline_tests.py
      - run: python -m compileall -q backend/src/runners/quant_experiments.py backend/tests/integration/test_quant_experiment_pipeline.py
      - name: Commit tests
        run: |
          git config user.name 'QuaZonai Issue 22 Worker'
          git config user.email 'quazonai-issue22@localhost'
          git rm scripts/finalize_issue22_pipeline_tests.py .github/workflows/issue22-pipeline-tests.yml
          git add -A
          git commit -m 'test: cover remote runtime failure and sealed blocking'
          git push origin HEAD:issue-22-nautilus-first-remote-runtime
