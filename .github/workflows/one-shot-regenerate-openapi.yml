name: One-shot regenerate OpenAPI

on:
  push:
    branches:
      - feat/ios-ipados-universal-app
    paths:
      - .github/workflows/one-shot-regenerate-openapi.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: sqlite+pysqlite:///:memory:
      QUAZONAI_ALEMBIC_URL: sqlite+pysqlite:///:memory:
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-ipados-universal-app
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Regenerate and commit canonical OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e 'backend[dev]'
          python tools/export_openapi.py --write
          python tools/export_openapi.py --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/openapi/quazonai-v1.json ios/Packages/QuaZonaiAPI/Sources/QuaZonaiAPI/openapi.yaml
          if git diff --cached --quiet; then
            echo 'OpenAPI already current'
            exit 0
          fi
          git commit -m 'chore: regenerate OpenAPI after TOTP-only merge'
          git push origin HEAD:feat/ios-ipados-universal-app
