name: Issue 22 candidate conformance repair

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-conformance-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Implement exact wheel reference replay
        run: |
          python - <<'PY'
          from pathlib import Path

          bundles = Path('backend/src/candidate_bundles.py')
          text = bundles.read_text()
          start = text.index('def build_candidate_verification_request(')
          end = text.index('\ndef _has_secret_value(', start)
          helper = '''def build_candidate_verification_request(\n    built: BuiltCandidateBundle, *, candidate_id: UUID\n) -> CandidateVerificationRequest:\n    """Extract the exact wheel and deterministic reference replay contract."""\n    with zipfile.ZipFile(io.BytesIO(built.archive_bytes)) as archive:\n        lineage = json.loads(archive.read("lineage.json"))\n        dataset_revision_ids = list(lineage.get("dataset_revision_ids", []))\n        if len(dataset_revision_ids) != 1:\n            raise QfError(\n                "CANDIDATE_CONFORMANCE_LINEAGE_INVALID",\n                "Candidate conformance requires exactly one portfolio-simulation Dataset Revision.",\n                500,\n                {"dataset_revision_ids": dataset_revision_ids},\n            )\n        fixture = {\n            "dataset_revision_id": dataset_revision_ids[0],\n            "strategy_config": json.loads(archive.read("strategy/strategy-config.json")),\n            "instrument_scope": json.loads(archive.read("data/instrument-scope.json")),\n            "backtest_run_config": json.loads(archive.read("runtime/backtest-run-config.json")),\n            "venue_config": json.loads(archive.read("runtime/venue-config.json")),\n            "risk_config": json.loads(archive.read("runtime/risk-config.json")),\n            "orders": json.loads(archive.read("validation/expected-orders.json")),\n            "fills": json.loads(archive.read("validation/expected-fills.json")),\n            "positions": json.loads(archive.read("validation/expected-positions.json")),\n            "statistics": json.loads(archive.read("validation/expected-statistics.json")),\n        }\n        wheel = archive.read("strategy/strategy.whl")\n    return CandidateVerificationRequest(\n        candidate_id=candidate_id,\n        manifest=built.manifest,\n        strategy_wheel_b64=base64.b64encode(wheel).decode("ascii"),\n        fixture=fixture,\n    )\n\n'''
          bundles.write_text(text[:start] + helper + text[end + 1:])

          engine = Path('nautilus_runtime/src/quazonai_nautilus_gateway/engine.py')
          text = engine.read_text()
          start = text.index('    def verify_candidate(')
          end = text.index('    @staticmethod\n    def _verify_wheel_inline', start)
          method = '''    def verify_candidate(self, request: CandidateVerificationRequest) -> dict[str, Any]:\n        findings: list[dict[str, Any]] = []\n        replay: dict[str, Any] | None = None\n        try:\n            wheel = base64.b64decode(request.strategy_wheel_b64, validate=True)\n        except ValueError:\n            wheel = b""\n            findings.append({"code": "STRATEGY_WHEEL_BASE64_INVALID"})\n\n        forbidden_markers = (\n            "password",\n            "secret",\n            "api_key",\n            "private_key",\n            "credential",\n            "access_token",\n            "auth_token",\n            "broker_token",\n            "broker_secret",\n        )\n\n        def walk(value: Any, path: str = "manifest") -> None:\n            if isinstance(value, dict):\n                for key, item in value.items():\n                    normalized = str(key).casefold().replace("-", "_")\n                    if any(marker in normalized for marker in forbidden_markers) and item not in (\n                        None,\n                        "",\n                        "INJECT_AT_REMOTE_RUNTIME_ONLY",\n                    ):\n                        findings.append(\n                            {"code": "LIVE_SECRET_IN_BUNDLE", "path": f"{path}.{key}"}\n                        )\n                    walk(item, f"{path}.{key}")\n            elif isinstance(value, list):\n                for index, item in enumerate(value):\n                    walk(item, f"{path}[{index}]")\n\n        walk(request.manifest)\n        required = {\n            "contract",\n            "contract_version",\n            "bundle_id",\n            "candidate_id",\n            "runtime",\n            "strategy",\n            "data",\n            "runtime_config",\n            "validation",\n            "evidence",\n            "lineage",\n            "target_weights",\n        }\n        missing = sorted(required.difference(request.manifest))\n        if missing:\n            findings.append({"code": "MANIFEST_FIELDS_MISSING", "fields": missing})\n        if request.manifest.get("contract") != CANDIDATE_BUNDLE_CONTRACT:\n            findings.append({"code": "BUNDLE_CONTRACT_INVALID"})\n        if request.manifest.get("contract_version") != CANDIDATE_BUNDLE_CONTRACT_VERSION:\n            findings.append({"code": "BUNDLE_CONTRACT_VERSION_INVALID"})\n        if str(request.manifest.get("candidate_id")) != str(request.candidate_id):\n            findings.append({"code": "CANDIDATE_ID_MISMATCH"})\n        runtime = request.manifest.get("runtime", {})\n        if runtime.get("name") != "NAUTILUS_TRADER":\n            findings.append({"code": "RUNTIME_NAME_INVALID"})\n        if runtime.get("version") != VALIDATED_NAUTILUS_VERSION:\n            findings.append({"code": "RUNTIME_VERSION_INVALID"})\n        if runtime.get("deployment") != "REMOTE_INDEPENDENT_RUNTIME":\n            findings.append({"code": "RUNTIME_DEPLOYMENT_INVALID"})\n        if runtime.get("paper_live_reuse") != "SAME_STRATEGY_WHEEL_AND_CONFIG":\n            findings.append({"code": "STRATEGY_REUSE_CONTRACT_INVALID"})\n        strategy = request.manifest.get("strategy", {})\n        if strategy.get("wheel") != "strategy/strategy.whl":\n            findings.append({"code": "STRATEGY_WHEEL_PATH_INVALID"})\n\n        fixture_required = {\n            "dataset_revision_id",\n            "strategy_config",\n            "instrument_scope",\n            "backtest_run_config",\n            "venue_config",\n            "risk_config",\n            "orders",\n            "fills",\n            "positions",\n            "statistics",\n        }\n        fixture_missing = sorted(fixture_required.difference(request.fixture))\n        if fixture_missing:\n            findings.append(\n                {"code": "CONFORMANCE_FIXTURE_INCOMPLETE", "fields": fixture_missing}\n            )\n\n        if wheel and not findings:\n            run_config = request.fixture.get("backtest_run_config")\n            catalog_key = run_config.get("catalog_key") if isinstance(run_config, dict) else None\n            if not isinstance(catalog_key, str) or not catalog_key:\n                findings.append({"code": "CONFORMANCE_CATALOG_MISSING"})\n            else:\n                try:\n                    replay = self._isolated_operation(\n                        "verify-candidate",\n                        {\n                            "wheel_b64": base64.b64encode(wheel).decode("ascii"),\n                            "manifest": request.manifest,\n                            "fixture": request.fixture,\n                        },\n                        catalog_key=catalog_key,\n                    )\n                except (\n                    GatewayContractError,\n                    ImportError,\n                    KeyError,\n                    TypeError,\n                    ValueError,\n                    zipfile.BadZipFile,\n                ) as exc:\n                    findings.append(\n                        {"code": "CONFORMANCE_REPLAY_FAILED", "detail": str(exc)}\n                    )\n\n        def canonical_rows(rows: Any, fields: tuple[str, ...]) -> list[dict[str, Any]]:\n            if not isinstance(rows, list):\n                return []\n            normalized = [\n                {field: _jsonable(row.get(field)) for field in fields}\n                for row in rows\n                if isinstance(row, dict)\n            ]\n            return sorted(normalized, key=lambda row: json.dumps(row, sort_keys=True))\n\n        if replay is not None:\n            comparisons = {\n                "orders": (\n                    "instrument_id",\n                    "side",\n                    "order_type",\n                    "status",\n                    "quantity",\n                    "filled_quantity",\n                ),\n                "fills": (\n                    "instrument_id",\n                    "side",\n                    "quantity",\n                    "price",\n                    "commission",\n                ),\n                "positions": (\n                    "instrument_id",\n                    "side",\n                    "quantity",\n                    "realized_pnl",\n                    "unrealized_pnl",\n                ),\n            }\n            for name, fields in comparisons.items():\n                expected_rows = canonical_rows(request.fixture.get(name), fields)\n                actual_rows = canonical_rows(replay.get(name), fields)\n                if actual_rows != expected_rows:\n                    findings.append(\n                        {\n                            "code": "CONFORMANCE_REFERENCE_MISMATCH",\n                            "section": name,\n                            "expected": expected_rows,\n                            "actual": actual_rows,\n                        }\n                    )\n            expected_stats = request.fixture.get("statistics", {})\n            actual_stats = replay.get("statistics", {})\n            for key in ("total_orders", "total_positions", "iterations"):\n                if isinstance(expected_stats, dict) and key in expected_stats:\n                    if actual_stats.get(key) != expected_stats.get(key):\n                        findings.append(\n                            {\n                                "code": "CONFORMANCE_REFERENCE_MISMATCH",\n                                "section": f"statistics.{key}",\n                                "expected": expected_stats.get(key),\n                                "actual": actual_stats.get(key),\n                            }\n                        )\n\n        return {\n            "protocol_version": PROTOCOL_VERSION,\n            "runtime_version": nautilus_version,\n            "candidate_id": request.candidate_id,\n            "compatible": not findings,\n            "findings": findings,\n        }\n\n'''
          engine.write_text(text[:start] + method + text[end:])

          Path('.github/workflows/issue22-conformance-repair.yml').unlink()
          PY
      - name: Commit conformance implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(runtime): replay Candidate Bundle reference fixture'
          git push --force-with-lease origin HEAD:feat/issue-22-remote-nautilus-runtime
