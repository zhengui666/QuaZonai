name: Apply issue 22 implementation

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/apply-issue22.yml
      - .github/scripts/apply_issue22.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-22-remote-nautilus-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply architecture migration
        run: python .github/scripts/apply_issue22.py
      - name: Format changed Python
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff format \
            backend/src/quant_runtime \
            backend/src/candidate_bundles.py \
            backend/src/candidate_packages.py \
            backend/src/db \
            backend/src/runners/research_missions.py \
            backend/src/runners/sealed_evaluation.py \
            backend/migrations/versions/0006_nautilus_first_runtime.py \
            backend/alembic/versions/0006_nautilus_first_runtime.py \
            nautilus_runtime \
            tools/check_quant_runtime_boundary.py 2>/dev/null || true
          ruff check --fix \
            backend/src/quant_runtime \
            backend/src/candidate_bundles.py \
            backend/src/candidate_packages.py \
            backend/src/runners/research_missions.py \
            backend/src/runners/sealed_evaluation.py \
            nautilus_runtime \
            tools/check_quant_runtime_boundary.py
      - name: Static boundary checks
        run: |
          python -m compileall -q backend/src/quant_runtime backend/src/candidate_bundles.py nautilus_runtime/src
          python tools/check_quant_runtime_boundary.py
      - name: Remove one-shot scaffolding and squash branch
        run: |
          rm -f .github/workflows/apply-issue22.yml
          rm -f .github/workflows/export-source.yml
          rm -f .github/scripts/apply_issue22.py
          git config user.name "QuaZonai Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset --soft origin/main
          git add -A
          git commit -m "feat(runtime): adopt remote Nautilus-first architecture"
          git push --force-with-lease origin HEAD:feat/issue-22-remote-nautilus-runtime
