name: Personal hosting
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    name: Deployment / native gateway and service syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Obtain the pinned native Caddy binary without starting a container
        run: |
          set -euo pipefail
          container=$(docker create caddy:2.11.4)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Verify actual gateway behavior with isolated synthetic peers
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: node --test deploy/proxy.test.mjs
      - name: Verify systemd syntax without starting or claiming real services
        run: |
          set -euo pipefail
          # systemd-analyze also requires ExecStart to exist. This syntax-only
          # fixture is confined to the disposable runner; it is not a QZ build.
          sudo install -D -m 0755 /usr/bin/true /opt/quazonai/current/bin/server
          systemd-analyze verify deploy/systemd/quazonai-api.service deploy/systemd/quazonai-worker.service
      - name: Require unchanged source
        run: git diff --exit-code
