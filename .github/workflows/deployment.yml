name: Personal hosting
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    name: Deployment / gateway and user-manager prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify guide installation commands with native Git and coreutils
        run: node --test deploy/install.test.mjs
      - name: Obtain the pinned native Caddy binary without starting a container
        run: |
          set -euo pipefail
          container=$(docker create caddy:2.11.4)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Verify actual gateway behavior with isolated synthetic peers
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: node --test deploy/proxy.test.mjs
      - name: Verify native user-manager launch and user-unit syntax
        run: |
          set -euo pipefail
          # Reuse the Store workflow's native user-manager setup.
          mission_uid=$(id -u)
          sudo loginctl enable-linger "$mission_uid"
          sudo systemctl start "user@$mission_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$mission_uid"
          systemctl --user show --property=Version
          # Syntax resolution only; this is not an executable QZ service.
          sudo install -D -m 0755 /usr/bin/true /opt/quazonai/current/bin/server
          systemd-analyze --user verify deploy/systemd/quazonai-api.service deploy/systemd/quazonai-worker.service
          # A user service must be able to create the bounded native user scope
          # used by Missions, without depending on an interactive login shell.
          probe="quazonai-deployment-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'systemctl --user stop "$probe.service" "$probe.scope" >/dev/null 2>&1 || true' EXIT
          systemd-run --user --unit="$probe.service" --wait --pipe --collect \
            /usr/bin/systemd-run --user --scope --quiet --collect --expand-environment=no \
            --unit="$probe.scope" --property=CPUQuota=25% --property=MemoryMax=64M \
            --property=MemorySwapMax=0 --property=TasksMax=32 --property=RuntimeMaxSec=10 \
            -- /usr/bin/prlimit --core=0:0 -- /usr/bin/true
      - name: Require unchanged source
        run: git diff --exit-code
