# Temporary exact-text transfer, removed before the final source is delivered.
# No model, code generation decision, commit, push or ref update is performed.
name: Materialize accepted account scope
on:
  pull_request:
permissions:
  contents: read
jobs:
  text:
    if: github.head_ref == 'codex/actions-account-scope-20260918' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Apply only the authored documentation diff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check .github/accepted-account-scope.patch
          git apply .github/accepted-account-scope.patch
          git diff --check
          mkdir -p "$RUNNER_TEMP/accepted-scope"
          git diff HEAD > "$RUNNER_TEMP/accepted-scope/applied.diff"
      - name: Return exact file candidates without publishing a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const paths = ['DESIGN.md', 'OPERATIONS.md'];
          const changed = execFileSync('git', ['diff', '--name-only', 'HEAD'], { encoding: 'utf8' }).trim().split('\n').sort();
          if (JSON.stringify(changed) !== JSON.stringify(paths)) throw new Error('Unexpected changes beyond the authored text');
          const entries = [];
          for (const path of paths) {
            const content = await readFile(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json', 'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (response.status !== 201) throw new Error(`Text staging failed: HTTP ${response.status}`);
            const blob = await response.json();
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            await writeFile(`${process.env.RUNNER_TEMP}/accepted-scope/${path}`, content);
          }
          await writeFile(`${process.env.RUNNER_TEMP}/accepted-scope/entries.json`, JSON.stringify({
            source_head: process.env.EXPECTED_HEAD, entries,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: accepted-scope-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/accepted-scope/
          if-no-files-found: error
          retention-days: 7
