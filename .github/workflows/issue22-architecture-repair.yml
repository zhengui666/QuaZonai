name: Issue 22 architecture repair

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-architecture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Apply review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, got {actual}: {old[:100]!r}")
              target.write_text(text.replace(old, new, count))

          # The trusted child derives its result path; SOURCE_BUNDLE never sees it in argv.
          replace(
              'nautilus_runtime/src/quazonai_nautilus_gateway/engine.py',
              '            output_path = workspace / "output.json"\n',
              '            output_path = workspace / ".trusted-result.json"\n',
          )
          replace(
              'nautilus_runtime/src/quazonai_nautilus_gateway/engine.py',
              '                    str(input_path),\n                    str(output_path),\n',
              '                    str(input_path),\n',
          )
          replace(
              'nautilus_runtime/src/quazonai_nautilus_gateway/engine.py',
              '    ExperimentMode,\n)\n',
              '    ExperimentMode,\n    _validate_restricted_strategy_source,\n)\n',
          )
          replace(
              'nautilus_runtime/src/quazonai_nautilus_gateway/engine.py',
              '            names = archive.namelist()\n            if not names or any(\n',
              '            names = archive.namelist()\n            for name in names:\n                if not name.endswith(".py"):\n                    continue\n                try:\n                    source = archive.read(name).decode("utf-8")\n                except UnicodeDecodeError as exc:\n                    raise GatewayContractError("wheel Python source must be UTF-8") from exc\n                _validate_restricted_strategy_source(name, source)\n            if not names or any(\n',
          )

          # Candidate Bundle: expose a canonical remote verification request and fail closed on secrets.
          replace(
              'backend/src/candidate_bundles.py',
              'from quant_runtime.contracts import PINNED_NAUTILUS_VERSION, StrategyArtifact\n',
              'from quant_runtime.contracts import (\n    PINNED_NAUTILUS_VERSION,\n    CandidateVerificationRequest,\n    StrategyArtifact,\n)\n',
          )
          marker = '\n\ndef _has_secret_value(value: Any, *, key: str = "") -> bool:\n'
          helper = '''\n\ndef build_candidate_verification_request(\n    built: BuiltCandidateBundle, *, candidate_id: UUID\n) -> CandidateVerificationRequest:\n    """Extract the exact immutable wheel/reference fixture for the remote conformance gate."""\n    with zipfile.ZipFile(io.BytesIO(built.archive_bytes)) as archive:\n        fixture = {\n            "orders": json.loads(archive.read("validation/expected-orders.json")),\n            "fills": json.loads(archive.read("validation/expected-fills.json")),\n            "positions": json.loads(archive.read("validation/expected-positions.json")),\n            "statistics": json.loads(archive.read("validation/expected-statistics.json")),\n        }\n        wheel = archive.read("strategy/strategy.whl")\n    return CandidateVerificationRequest(\n        candidate_id=candidate_id,\n        manifest=built.manifest,\n        strategy_wheel_b64=base64.b64encode(wheel).decode("ascii"),\n        fixture=fixture,\n    )\n\n\ndef _has_secret_value(value: Any, *, key: str = "") -> bool:\n'''
          replace('backend/src/candidate_bundles.py', marker, helper)
          replace(
              'backend/src/candidate_bundles.py',
              '        for marker in ("password", "private_key", "api_key", "broker_token", "broker_secret")\n',
              '        for marker in (\n            "password",\n            "private_key",\n            "api_key",\n            "secret",\n            "credential",\n            "access_token",\n            "auth_token",\n            "broker_token",\n            "broker_secret",\n        )\n',
          )

          # Mission research is bounded per contract: failed attempts become evidence, not Mission death.
          replace(
              'backend/src/quant_runtime/workspace.py',
              '    ResearchProgram,\n)\n',
              '    ResearchProgram,\n    SearchLedgerEntry,\n)\n',
          )
          replace(
              'backend/src/quant_runtime/workspace.py',
              '            contract = _load_contract(path, root=contracts_root)\n',
              '''            try:\n                contract = _load_contract(path, root=contracts_root)\n            except QfError as exc:\n                write_workspace_json(\n                    workspace,\n                    f"evidence/rejected-{path.stem}.json",\n                    {\n                        "state": "REJECTED",\n                        "contract_file": path.name,\n                        "failure_code": exc.code,\n                        "failure_message": exc.message,\n                    },\n                )\n                continue\n''',
          )
          replace(
              'backend/src/quant_runtime/workspace.py',
              '''            if contract.mode not in {ExperimentMode.DISCOVERY, ExperimentMode.PORTFOLIO}:\n                raise QfError(\n                    "EXPERIMENT_MODE_NOT_PERMITTED",\n                    "Research Missions may submit Discovery or Portfolio simulation only.",\n                    422,\n                    {"mode": contract.mode.value, "path": path.name},\n                )\n''',
              '''            if contract.mode not in {ExperimentMode.DISCOVERY, ExperimentMode.PORTFOLIO}:\n                write_workspace_json(\n                    workspace,\n                    f"evidence/rejected-{contract.experiment_id}.json",\n                    {\n                        "experiment_id": str(contract.experiment_id),\n                        "state": "REJECTED",\n                        "failure_code": "EXPERIMENT_MODE_NOT_PERMITTED",\n                        "failure_message": (\n                            "Research Missions may submit Discovery or Portfolio simulation only."\n                        ),\n                    },\n                )\n                already_executed.add(contract.experiment_id)\n                executed.append(contract.experiment_id)\n                continue\n''',
          )
          replace(
              'backend/src/quant_runtime/workspace.py',
              '''            if contract.strategy.kind != "SOURCE_BUNDLE":\n                raise QfError(\n                    "EXPERIMENT_STRATEGY_ARTIFACT_REQUIRED",\n                    "Research Missions must submit a self-contained SOURCE_BUNDLE strategy artifact.",\n                    422,\n                    {"path": path.name},\n                )\n''',
              '''            if contract.strategy.kind != "SOURCE_BUNDLE":\n                write_workspace_json(\n                    workspace,\n                    f"evidence/rejected-{contract.experiment_id}.json",\n                    {\n                        "experiment_id": str(contract.experiment_id),\n                        "state": "REJECTED",\n                        "failure_code": "EXPERIMENT_STRATEGY_ARTIFACT_REQUIRED",\n                        "failure_message": (\n                            "Research Missions must submit a self-contained SOURCE_BUNDLE strategy artifact."\n                        ),\n                    },\n                )\n                already_executed.add(contract.experiment_id)\n                executed.append(contract.experiment_id)\n                continue\n''',
          )
          replace(
              'backend/src/quant_runtime/workspace.py',
              '''            entry = coordinator.execute(\n                mission_id=mission_id,\n                program_id=program_id,\n                branch_id=branch_id,\n                request=contract,\n                sealed=False,\n            )\n            write_evidence(workspace, entry)\n            already_executed.add(contract.experiment_id)\n            executed.append(contract.experiment_id)\n''',
              '''            try:\n                entry = coordinator.execute(\n                    mission_id=mission_id,\n                    program_id=program_id,\n                    branch_id=branch_id,\n                    request=contract,\n                    sealed=False,\n                )\n            except QfError as exc:\n                with factory() as evidence_session:\n                    entry = evidence_session.get(SearchLedgerEntry, contract.experiment_id)\n                    if entry is not None:\n                        evidence_session.expunge(entry)\n                if entry is not None:\n                    write_evidence(workspace, entry)\n                else:\n                    write_workspace_json(\n                        workspace,\n                        f"evidence/rejected-{contract.experiment_id}.json",\n                        {\n                            "experiment_id": str(contract.experiment_id),\n                            "state": "REJECTED",\n                            "failure_code": exc.code,\n                            "failure_message": exc.message,\n                        },\n                    )\n            else:\n                write_evidence(workspace, entry)\n            already_executed.add(contract.experiment_id)\n            executed.append(contract.experiment_id)\n''',
          )

          # Portfolio promotion freezes instrument-level weights and the intended Paper consumer.
          replace(
              'backend/src/quant_runtime/promotion.py',
              '    DatasetRevision,\n    PortfolioCandidate,\n',
              '    DatasetRevision,\n    DownstreamSystem,\n    PortfolioCandidate,\n',
          )
          replace(
              'backend/src/quant_runtime/promotion.py',
              '        request_json = BacktestExperimentRequest.model_validate(simulation.request_json)\n        strategy = StrategyArtifact.model_validate(request_json.strategy)\n        candidate = PortfolioCandidate(\n',
              '''        request_json = BacktestExperimentRequest.model_validate(simulation.request_json)\n        strategy = StrategyArtifact.model_validate(request_json.strategy)\n        instrument_ids = list(dict.fromkeys(request_json.instrument_ids))\n        if not instrument_ids:\n            raise QfError(\n                "PORTFOLIO_INSTRUMENT_SCOPE_EMPTY",\n                "Portfolio simulation produced no governed instrument scope.",\n                500,\n            )\n        instrument_weight = 1.0 / len(instrument_ids)\n        downstreams = list(\n            session.scalars(\n                select(DownstreamSystem)\n                .where(\n                    DownstreamSystem.environment_type == "PAPER",\n                    DownstreamSystem.enabled.is_(True),\n                    DownstreamSystem.preflight_state == "READY",\n                    DownstreamSystem.package_contract_version == "2",\n                )\n                .order_by(DownstreamSystem.name, DownstreamSystem.id)\n            )\n        )\n        paper_downstream = next(\n            (\n                downstream\n                for downstream in downstreams\n                if not downstream.compatibility\n                or persisted_alpha.universe in downstream.compatibility\n            ),\n            None,\n        )\n        if paper_downstream is None:\n            raise QfError(\n                "PAPER_DOWNSTREAM_NOT_READY",\n                "No ready Candidate Bundle v2 Paper downstream matches the selected Alpha.",\n                409,\n            )\n        candidate = PortfolioCandidate(\n''',
          )
          replace(
              'backend/src/quant_runtime/promotion.py',
              '''            members=[\n                {\n                    "alpha_qualification_id": str(persisted_alpha.id),\n                    "alpha_name": alpha_name,\n                    "role": persisted_alpha.role,\n                    "target_weight": 1.0,\n                    "universe": alpha_universe,\n                    "instrument_ids": request_json.instrument_ids,\n                }\n            ],\n''',
              '''            members=[\n                {\n                    "alpha_qualification_id": str(persisted_alpha.id),\n                    "alpha_name": alpha_name,\n                    "role": persisted_alpha.role,\n                    "target_weight": instrument_weight,\n                    "universe": alpha_universe,\n                    "instrument_id": instrument_id,\n                }\n                for instrument_id in instrument_ids\n            ],\n''',
          )
          replace(
              'backend/src/quant_runtime/promotion.py',
              '''                    "selected_alpha_id": str(persisted_alpha.id),\n                    "target_weight": 1.0,\n''',
              '''                    "selected_alpha_id": str(persisted_alpha.id),\n                    "target_weight": 1.0,\n                    "instrument_weights": {\n                        instrument_id: instrument_weight for instrument_id in instrument_ids\n                    },\n''',
          )
          replace(
              'backend/src/quant_runtime/promotion.py',
              '''        approval = ApprovalSnapshot(\n            candidate_id=candidate.id,\n            purpose="PAPER",\n            state="PENDING",\n''',
              '''        approval = ApprovalSnapshot(\n            candidate_id=candidate.id,\n            purpose="PAPER",\n            state="PENDING",\n            downstream_system_id=paper_downstream.id,\n''',
          )

          # Approval consumes the frozen downstream, verifies the exact v2 wheel, and shares one Bundle UUID.
          replace(
              'backend/src/api/domain.py',
              '''from candidate_bundles import (\n    BUNDLE_CONTRACT_VERSION,\n    build_candidate_bundle,\n    resolve_bundle_archive,\n)\n''',
              '''from candidate_bundles import (\n    BUNDLE_CONTRACT_VERSION,\n    build_candidate_bundle,\n    build_candidate_verification_request,\n    resolve_bundle_archive,\n)\n''',
          )
          replace(
              'backend/src/api/domain.py',
              'from quant_runtime.data_scope import dataset_revision_domains, market_scope_matches_universe\n',
              'from quant_runtime.client import NautilusQuantRuntime, RemoteNautilusConfig\nfrom quant_runtime.data_scope import dataset_revision_domains, market_scope_matches_universe\n',
          )
          route_marker = '\n\n@router.post("/approvals/{approval_id}/approve", response_model=ApprovalView)\n'
          helper = '''\n\ndef _verify_candidate_bundle_remotely(built: Any, *, candidate_id: UUID) -> None:\n    verification_request = build_candidate_verification_request(\n        built, candidate_id=candidate_id\n    )\n    with NautilusQuantRuntime(RemoteNautilusConfig.from_env()) as runtime:\n        result = runtime.verify_candidate(verification_request)\n    if not result.compatible:\n        raise QfError(\n            "CANDIDATE_CONFORMANCE_FAILED",\n            "Remote Nautilus reference-fixture verification rejected the Candidate Bundle.",\n            422,\n            {"findings": result.findings},\n        )\n\n\n@router.post("/approvals/{approval_id}/approve", response_model=ApprovalView)\n'''
          replace('backend/src/api/domain.py', route_marker, helper)
          replace(
              'backend/src/api/domain.py',
              '            downstream = session.get(DownstreamSystem, payload.downstream_system_id)\n',
              '''            if (\n                approval.downstream_system_id is None\n                or approval.downstream_system_id != payload.downstream_system_id\n            ):\n                raise QfError(\n                    "APPROVAL_DOWNSTREAM_MISMATCH",\n                    "Approval is frozen to a different Paper/Live downstream dependency.",\n                    409,\n                )\n            downstream = session.get(DownstreamSystem, payload.downstream_system_id)\n''',
          )
          replace(
              'backend/src/api/domain.py',
              '''            built = build_candidate_bundle(\n                request.app.state.settings,\n                approval=approval,\n                candidate=candidate,\n                downstream=downstream,\n            )\n            package = CandidateBundle(\n                approval_id=approval.id,\n''',
              '''            approval.state = "APPROVED"\n            approval.revision += 1\n            bundle_id = uuid4()\n            built = build_candidate_bundle(\n                request.app.state.settings,\n                approval=approval,\n                candidate=candidate,\n                downstream=downstream,\n                bundle_id=bundle_id,\n            )\n            _verify_candidate_bundle_remotely(built, candidate_id=candidate.id)\n            package = CandidateBundle(\n                id=bundle_id,\n                approval_id=approval.id,\n''',
          )
          replace(
              'backend/src/api/domain.py',
              '''            approval.state = "APPROVED"\n            approval.downstream_system_id = downstream.id\n            approval.revision += 1\n''',
              '',
          )

          # Integration/browser fixtures now model the frozen downstream dependency.
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''        approval = ApprovalSnapshot(\n            candidate_id=candidate.id,\n            purpose="PAPER",\n            state="PENDING",\n''',
              '''        approval = ApprovalSnapshot(\n            candidate_id=candidate.id,\n            purpose="PAPER",\n            state="PENDING",\n            downstream_system_id=downstream.id,\n''',
          )
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''def test_approval_builds_package_and_authenticated_handoff_feedback(\n    engine: Engine,\n    settings: Settings,\n) -> None:\n''',
              '''def test_approval_builds_package_and_authenticated_handoff_feedback(\n    engine: Engine,\n    settings: Settings,\n    monkeypatch,\n) -> None:\n    monkeypatch.setattr(\n        "api.domain._verify_candidate_bundle_remotely",\n        lambda *args, **kwargs: None,\n    )\n''',
          )
          replace(
              'backend/tests/frontend_e2e_seed.py',
              '''        approval = ApprovalSnapshot(\n            id=APPROVAL_ID,\n            candidate_id=CANDIDATE_ID,\n            purpose="PAPER",\n            state="PENDING",\n''',
              '''        approval = ApprovalSnapshot(\n            id=APPROVAL_ID,\n            candidate_id=CANDIDATE_ID,\n            purpose="PAPER",\n            state="PENDING",\n            downstream_system_id=PAPER_DOWNSTREAM_ID,\n''',
          )

          # Promotion integration receives an explicit ready Paper consumer.
          replace(
              'backend/tests/integration/test_nautilus_promotion.py',
              '    DatasetRevision,\n    MarketUniverseVersion,\n',
              '    DatasetRevision,\n    DownstreamSystem,\n    MarketUniverseVersion,\n',
          )
          replace(
              'backend/tests/integration/test_nautilus_promotion.py',
              '''        portfolio = PortfolioProgram(\n            mandate_version_id=mandate_version_id,\n            mandate_name="Research Portfolio",\n            state="ACTIVE",\n        )\n        session.add_all([branch, discovery, sealed, mandate, portfolio])\n''',
              '''        portfolio = PortfolioProgram(\n            mandate_version_id=mandate_version_id,\n            mandate_name="Research Portfolio",\n            state="ACTIVE",\n        )\n        downstream = DownstreamSystem(\n            name=f"Paper {mandate_version_id}",\n            environment_type="PAPER",\n            enabled=True,\n            package_contract_version="2",\n            feedback_contract_version="1",\n            compatibility=[],\n            preflight_state="READY",\n            public_config={},\n        )\n        session.add_all([branch, discovery, sealed, mandate, portfolio, downstream])\n''',
          )

          workflow = Path('.github/workflows/issue22-architecture-repair.yml')
          workflow.unlink()
          PY
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(issue22): close runtime architecture review gaps'
          git push --force-with-lease origin HEAD:feat/issue-22-remote-nautilus-runtime
