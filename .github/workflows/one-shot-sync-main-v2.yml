name: One-shot sync main into issue 36 branch v2

on:
  push:
    branches:
      - feat/ios-ipados-universal-app
    paths:
      - .github/workflows/one-shot-sync-main-v2.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-ipados-universal-app
          fetch-depth: 0

      - name: Merge main while preserving native and browser TOTP contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            expected=$(printf '%s\n' backend/src/api/auth.py backend/src/errors.py | sort)
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected merge conflicts:'
              echo "$conflicts"
              exit 1
            fi

            git checkout --theirs -- backend/src/api/auth.py
            python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/api/auth.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    authenticate_totp_login,\n', '')
          text = text.replace(
              'from settings import Settings\n',
              'from settings import Settings\nfrom totp_core import verify_totp_once\n',
          )
          text = text.replace(
              'if not authenticate_totp_login(settings, runtime, totp_code=payload.totp_code):',
              'if not verify_totp_once(settings, runtime, payload.totp_code):',
          )
          path.write_text(text, encoding='utf-8')
          PY
            git add backend/src/api/auth.py

            git checkout --ours -- backend/src/errors.py
            python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/errors.py')
          text = path.read_text(encoding='utf-8').replace(
              'Invalid operator credentials.',
              'Operator authentication failed.',
          )
          path.write_text(text, encoding='utf-8')
          PY
            git add backend/src/errors.py
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            DESIGN.md OPERATIONS.md README.md backend/src/api/auth.py backend/src/errors.py
          python -m compileall -q backend/src
          git diff --check
          git commit -m 'merge: synchronize TOTP-only main into iOS branch'
          git push origin HEAD:feat/ios-ipados-universal-app
