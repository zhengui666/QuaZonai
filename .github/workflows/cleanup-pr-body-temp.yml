name: Clean issue 22 temporary marker
on:
  push:
    branches: [feat/issue-22-remote-nautilus-runtime]
    paths: [.github/workflows/cleanup-pr-body-temp.yml]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-22-remote-nautilus-runtime
      - run: |
          rm -f PR_BODY_ISSUE_22.tmp .github/workflows/cleanup-pr-body-temp.yml
          git config user.name "QuaZonai Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary workflow artifacts"
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
