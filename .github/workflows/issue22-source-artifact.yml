name: Issue 22 branch synchronization

on:
  push:
    branches:
      - issue-22-nautilus-first-remote-runtime

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.head_commit.message != 'docs: synchronize Nautilus-first architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-nautilus-first-remote-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply governed documentation and contract updates
        run: python scripts/apply_issue22_docs.py
      - name: Basic syntax validation
        run: python -m compileall -q backend/src scripts/apply_issue22_docs.py
      - name: Commit synchronized branch
        run: |
          git config user.name 'QuaZonai Issue 22 Worker'
          git config user.email 'quazonai-issue22@localhost'
          git rm scripts/apply_issue22_docs.py .github/workflows/issue22-source-artifact.yml
          git add DESIGN.md README.md OPERATIONS.md CLI.md backend/src/candidate_packages.py backend/tests/integration/test_domain_api.py
          git commit -m 'docs: synchronize Nautilus-first architecture'
          git push origin HEAD:issue-22-nautilus-first-remote-runtime
