name: Issue 22 round6 lint correction

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/issue22-round6-lint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Restore required cleanup import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/runners/research_missions.py')
          text = path.read_text(encoding='utf-8')
          marker = 'import os\n'
          if 'import shutil\n' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('research_missions import marker changed')
              text = text.replace(marker, marker + 'import shutil\n', 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/issue22-round6-lint-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): restore mission cleanup import"
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
