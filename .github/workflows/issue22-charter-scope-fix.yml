name: Apply Issue 22 Charter scope fix

on:
  push:
    branches: [feat/issue-22-remote-nautilus-runtime]
    paths: [.github/workflows/issue22-charter-scope-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply Charter scope fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(
                      f'{path}: expected {count} patch anchors, found {actual}: {old[:120]!r}'
                  )
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          Path('backend/src/quant_runtime/data_scope.py').write_text(
              '''"""Shared governed-data scope rules for immutable Research Charters and Missions."""\n\nfrom __future__ import annotations\n\nfrom db.models import DatasetRevision, GovernedDataSource, MarketUniverseVersion\n\n_DATA_TYPE_DOMAINS: dict[str, set[str]] = {\n    "quotetick": {"quotes", "market_data"},\n    "tradetick": {"trades", "market_data"},\n    "bar": {"bars", "market_data"},\n    "orderbookdelta": {"order_book", "market_data"},\n    "orderbookdeltas": {"order_book", "market_data"},\n}\n\n_MARKET_SCOPE_ALIASES: dict[str, set[str]] = {\n    "us_equities": {"us_equities", "us_equity", "equities", "equity", "stocks", "stock"},\n    "crypto_spot": {"crypto_spot", "crypto", "cryptocurrency", "digital_assets"},\n    "us_options": {"us_options", "options", "option"},\n    "futures": {"futures", "future"},\n    "fx": {"fx", "foreign_exchange", "forex"},\n}\n\n\ndef normalize_data_domain(value: object) -> str:\n    return str(value).strip().casefold().replace("-", "_").replace(" ", "_")\n\n\ndef dataset_revision_domains(\n    revision: DatasetRevision,\n    source: GovernedDataSource | None,\n) -> set[str]:\n    """Return semantic data domains; source field/column names are not domains."""\n    result = set(_DATA_TYPE_DOMAINS.get(normalize_data_domain(revision.nautilus_data_type), set()))\n    if source is not None:\n        config = source.public_config or {}\n        for key in ("data_domain", "domain"):\n            if config.get(key):\n                result.add(normalize_data_domain(config[key]))\n        configured = config.get("data_domains")\n        if isinstance(configured, list):\n            result.update(normalize_data_domain(value) for value in configured)\n    return {value for value in result if value}\n\n\ndef market_scope_matches_universe(\n    market_scope: str | list[str] | None,\n    universe: MarketUniverseVersion,\n) -> bool:\n    """Match the inferred Idea scope to a concrete active Universe Version."""\n    requested = market_scope if isinstance(market_scope, list) else [market_scope]\n    tokens = {normalize_data_domain(value) for value in requested if value}\n    if not tokens or tokens == {"system_inferred"}:\n        return True\n    universe_tokens = {\n        normalize_data_domain(universe.name),\n        normalize_data_domain(universe.universe_key),\n    }\n    expanded: set[str] = set()\n    for token in tokens:\n        expanded.add(token)\n        expanded.update(_MARKET_SCOPE_ALIASES.get(token, set()))\n    for canonical, aliases in _MARKET_SCOPE_ALIASES.items():\n        if universe_tokens.intersection(aliases | {canonical}):\n            universe_tokens.update(aliases)\n            universe_tokens.add(canonical)\n    return bool(expanded.intersection(universe_tokens))\n''',
              encoding='utf-8',
          )

          # Use one semantic-domain implementation in Mission publication.
          replace(
              'backend/src/quant_runtime/workspace.py',
              '''from errors import QfError\nfrom quant_runtime.contracts import BacktestExperimentRequest, ExperimentMode\n''',
              '''from errors import QfError\nfrom quant_runtime.contracts import BacktestExperimentRequest, ExperimentMode\nfrom quant_runtime.data_scope import dataset_revision_domains, normalize_data_domain\n''',
          )
          workspace = Path('backend/src/quant_runtime/workspace.py')
          text = workspace.read_text(encoding='utf-8')
          start = text.index('\n_DATA_TYPE_DOMAINS = {')
          end = text.index('\n\ndef prepare_experiment_workspace(', start)
          text = text[:start] + text[end:]
          text = text.replace(
              '_normalize_domain(value)',
              'normalize_data_domain(value)',
          )
          text = text.replace(
              'domains = _revision_domains(revision, source)',
              'domains = dataset_revision_domains(revision, source)',
          )
          old_source_guard = '''                domains = dataset_revision_domains(revision, source)\n                if not domains.intersection(allowed_domains):\n                    continue\n'''
          new_source_guard = '''                if (\n                    source is None\n                    or source.state != "ACTIVE"\n                    or source.preflight_state != "READY"\n                ):\n                    continue\n                domains = dataset_revision_domains(revision, source)\n                if not domains.intersection(allowed_domains):\n                    continue\n'''
          if text.count(old_source_guard) != 1:
              raise RuntimeError('workspace source guard anchor changed')
          workspace.write_text(text.replace(old_source_guard, new_source_guard, 1), encoding='utf-8')

          # Freeze concrete executable scope before an immutable Charter exists.
          replace(
              'backend/src/api/domain.py',
              '''from jobs import enqueue_job\n''',
              '''from jobs import enqueue_job\nfrom quant_runtime.data_scope import dataset_revision_domains, market_scope_matches_universe\n''',
          )
          domain = Path('backend/src/api/domain.py')
          text = domain.read_text(encoding='utf-8')
          marker = '''def _charter_view(item: ResearchCharter) -> CharterView:\n'''
          helper = '''def _resolve_frozen_research_scope(\n    session: Session,\n    preview: CharterView,\n) -> tuple[list[UUID], list[str], str | list[str]]:\n    """Resolve an Idea to concrete executable governed Discovery scope."""\n    revisions = list(\n        session.scalars(\n            select(DatasetRevision)\n            .where(\n                DatasetRevision.partition == "DISCOVERY",\n                DatasetRevision.quality_state == "VALID",\n                DatasetRevision.point_in_time_state == "VALID",\n                DatasetRevision.catalog_uri.is_not(None),\n                DatasetRevision.universe_version_id.is_not(None),\n                DatasetRevision.data_source_id.is_not(None),\n            )\n            .order_by(DatasetRevision.created_at.desc())\n        )\n    )\n    universe_ids = {\n        item.universe_version_id for item in revisions if item.universe_version_id is not None\n    }\n    source_ids = {item.data_source_id for item in revisions if item.data_source_id is not None}\n    universes = (\n        list(\n            session.scalars(\n                select(MarketUniverseVersion).where(\n                    MarketUniverseVersion.id.in_(universe_ids),\n                    MarketUniverseVersion.state == "ACTIVE",\n                )\n            )\n        )\n        if universe_ids\n        else []\n    )\n    sources = (\n        list(\n            session.scalars(\n                select(GovernedDataSource).where(\n                    GovernedDataSource.id.in_(source_ids),\n                    GovernedDataSource.state == "ACTIVE",\n                    GovernedDataSource.preflight_state == "READY",\n                )\n            )\n        )\n        if source_ids\n        else []\n    )\n    latest_by_key: dict[str, MarketUniverseVersion] = {}\n    for universe in universes:\n        current = latest_by_key.get(universe.universe_key)\n        if current is None or universe.version_no > current.version_no:\n            latest_by_key[universe.universe_key] = universe\n    active_universes = {item.id: item for item in latest_by_key.values()}\n    active_sources = {item.id: item for item in sources}\n\n    eligible: list[tuple[DatasetRevision, MarketUniverseVersion, set[str]]] = []\n    for revision in revisions:\n        if revision.universe_version_id is None or revision.data_source_id is None:\n            continue\n        universe = active_universes.get(revision.universe_version_id)\n        source = active_sources.get(revision.data_source_id)\n        if universe is None or source is None:\n            continue\n        if not market_scope_matches_universe(preview.market_scope, universe):\n            continue\n        catalog_uri = revision.catalog_uri or ""\n        if not catalog_uri.startswith("nautilus-catalog://") or not revision.instrument_scope:\n            continue\n        domains = dataset_revision_domains(revision, source)\n        if not domains:\n            continue\n        eligible.append((revision, universe, domains))\n\n    if not eligible:\n        raise QfError(\n            "RESEARCH_SCOPE_UNAVAILABLE",\n            "No executable governed Discovery dataset matches the inferred Research scope.",\n            422,\n            {"market_scope": preview.market_scope},\n        )\n\n    concrete_universes = {universe.id: universe for _, universe, _ in eligible}\n    requested_scope = preview.market_scope\n    if requested_scope in {None, "System inferred"}:\n        names = sorted({item.name for item in concrete_universes.values()})\n        if len(names) != 1:\n            raise QfError(\n                "RESEARCH_SCOPE_AMBIGUOUS",\n                "The Idea does not resolve to one configured executable market scope.",\n                422,\n                {"available_market_scopes": names},\n            )\n        frozen_market_scope: str | list[str] = names[0]\n    else:\n        frozen_market_scope = requested_scope\n\n    frozen_universe_ids = sorted(concrete_universes, key=str)\n    frozen_domains = sorted({domain for _, _, domains in eligible for domain in domains})\n    return frozen_universe_ids, frozen_domains, frozen_market_scope\n\n\n'''
          if text.count(marker) != 1:
              raise RuntimeError('charter view marker changed')
          domain.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')
          replace(
              'backend/src/api/domain.py',
              '''            preview = _charter_preview(payload.idea)\n            now = _now()\n            charter = ResearchCharter(\n                original_idea_text=preview.original_idea_text,\n                research_question=preview.research_question or preview.original_idea_text,\n                market_scope=preview.market_scope or "System inferred",\n                universe_version_ids=[],\n                prediction_horizon=preview.prediction_horizon,\n                allowed_data_domains=[],\n                explicit_exclusions=preview.explicit_exclusions,\n                material_assumptions=preview.material_assumptions,\n                system_assumptions=preview.system_assumptions,\n                created_at=now,\n            )\n''',
              '''            preview = _charter_preview(payload.idea)\n            universe_version_ids, allowed_data_domains, market_scope = (\n                _resolve_frozen_research_scope(session, preview)\n            )\n            now = _now()\n            charter = ResearchCharter(\n                original_idea_text=preview.original_idea_text,\n                research_question=preview.research_question or preview.original_idea_text,\n                market_scope=market_scope,\n                universe_version_ids=[str(value) for value in universe_version_ids],\n                prediction_horizon=preview.prediction_horizon,\n                allowed_data_domains=allowed_data_domains,\n                explicit_exclusions=preview.explicit_exclusions,\n                material_assumptions=preview.material_assumptions,\n                system_assumptions=[\n                    *preview.system_assumptions,\n                    "Universe Versions and data domains were frozen from executable governed Discovery revisions at Program creation.",\n                ],\n                created_at=now,\n            )\n''',
          )

          # Integration fixtures now model the required low-frequency admin setup.
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''    ForwardEvidenceEpisode,\n    Job,\n    PortfolioCandidate,\n''',
              '''    DatasetRevision,\n    ForwardEvidenceEpisode,\n    GovernedDataSource,\n    Job,\n    MarketUniverseVersion,\n    PortfolioCandidate,\n''',
          )
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''    PortfolioProgram,\n    ResearchProgram,\n)\n''',
              '''    PortfolioProgram,\n    ResearchCharter,\n    ResearchProgram,\n)\n''',
          )
          tests = Path('backend/tests/integration/test_domain_api.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''def _nautilus_candidate_metrics(experiment_id: UUID) -> dict:\n'''
          helper = '''def _seed_research_scope(\n    engine: Engine,\n    *,\n    name: str = "US Equities",\n    key: str = "US_EQUITIES",\n    instrument_id: str = "AAPL.XNAS",\n) -> UUID:\n    factory = create_session_factory(engine)\n    now = datetime.now(UTC)\n    universe_id = uuid4()\n    with factory() as session, session.begin():\n        universe = MarketUniverseVersion(\n            id=universe_id,\n            universe_key=f"{key}_{universe_id.hex[:8]}",\n            version_no=1,\n            name=name,\n            state="ACTIVE",\n            spec_json={},\n            created_at=now,\n        )\n        source = GovernedDataSource(\n            name=f"Governed quotes {universe_id}",\n            provider="Integration provider",\n            state="ACTIVE",\n            universe_scope=[name],\n            fields=["event_time", "available_time", "bid_price", "ask_price"],\n            preflight_state="READY",\n            public_config={"data_domains": ["quotes", "market_data"]},\n        )\n        session.add_all([universe, source])\n        session.flush()\n        session.add(\n            DatasetRevision(\n                data_source_id=source.id,\n                universe_version_id=universe.id,\n                universe_name=name,\n                revision_no=1,\n                event_start=now - timedelta(days=30),\n                event_end=now - timedelta(days=20),\n                available_start=now - timedelta(days=30),\n                available_end=now - timedelta(days=20),\n                row_count=100,\n                quality_state="VALID",\n                point_in_time_state="VALID",\n                partition="DISCOVERY",\n                created_at=now,\n                provider_name="Integration provider",\n                source_license="integration-test",\n                catalog_uri=f"nautilus-catalog://scope-{universe_id.hex}",\n                nautilus_data_type="QuoteTick",\n                instrument_scope=[instrument_id],\n                schema_revision="quote-v2",\n                quality_result={"state": "VALID"},\n                point_in_time_result={"state": "VALID"},\n                ingested_at=now,\n            )\n        )\n    return universe_id\n\n\n'''
          if text.count(marker) != 1:
              raise RuntimeError('domain test helper marker changed')
          tests.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''    client = _client(engine, settings)\n    headers = {"Idempotency-Key": "program-create-1"}\n''',
              '''    universe_id = _seed_research_scope(engine)\n    client = _client(engine, settings)\n    headers = {"Idempotency-Key": "program-create-1"}\n''',
          )
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''    assert program["state"] == "ACTIVE"\n    assert program["mission_count"] == 1\n''',
              '''    assert program["state"] == "ACTIVE"\n    assert program["mission_count"] == 1\n    assert program["charter"]["universe_version_ids"] == [str(universe_id)]\n    assert set(program["charter"]["allowed_data_domains"]) >= {"quotes", "market_data"}\n\n    factory = create_session_factory(engine)\n    with factory() as session:\n        charter = session.get(ResearchCharter, UUID(program["charter_id"]))\n        assert charter is not None\n        assert charter.universe_version_ids == [str(universe_id)]\n        assert set(charter.allowed_data_domains) >= {"quotes", "market_data"}\n''',
          )
          # Reuse the later factory assignment rather than creating another variable declaration.
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''    factory = create_session_factory(engine)\n    with factory() as session:\n        job = session.scalar(\n''',
              '''    with factory() as session:\n        job = session.scalar(\n''',
          )
          replace(
              'backend/tests/integration/test_domain_api.py',
              '''    client = _client(engine, settings)\n    idea = "Test short-horizon momentum in liquid US equities after realistic costs."\n''',
              '''    _seed_research_scope(engine)\n    client = _client(engine, settings)\n    idea = "Test short-horizon momentum in liquid US equities after realistic costs."\n''',
          )
          duplicate_marker = '''def _seed_candidate_approval(\n'''
          new_test = '''def test_program_creation_rejects_unavailable_inferred_scope(\n    engine: Engine,\n    settings: Settings,\n) -> None:\n    _seed_research_scope(engine, name="US Equities", key="US_EQUITIES")\n    client = _client(engine, settings)\n\n    response = client.post(\n        "/api/v1/research-programs",\n        headers={"Idempotency-Key": "scope-unavailable"},\n        json={\n            "idea": "Test crypto spot momentum after realistic costs and liquidity filters.",\n            "answers": {},\n        },\n    )\n    assert response.status_code == 422, response.text\n    assert response.json()["error"]["code"] == "RESEARCH_SCOPE_UNAVAILABLE"\n\n    factory = create_session_factory(engine)\n    with factory() as session:\n        assert session.scalar(select(func.count()).select_from(ResearchProgram)) == 0\n        assert session.scalar(select(func.count()).select_from(ResearchCharter)) == 0\n\n\n'''
          text = tests.read_text(encoding='utf-8')
          if text.count(duplicate_marker) != 1:
              raise RuntimeError('candidate approval marker changed')
          tests.write_text(text.replace(duplicate_marker, new_test + duplicate_marker, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/issue22-charter-scope-fix.yml
      - name: Validate
        run: |
          python -m pip install --disable-pip-version-check -e 'backend[dev,research,agent]'
          python -m compileall -q backend/src
          ruff check --config backend/pyproject.toml \
            backend/src/api/domain.py backend/src/quant_runtime/data_scope.py \
            backend/src/quant_runtime/workspace.py backend/tests/integration/test_domain_api.py
          mypy --config-file backend/pyproject.toml backend/src
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          pytest -q backend/tests/integration/test_domain_api.py
      - name: Commit
        run: |
          git config user.name 'QuaZonai Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(research): freeze executable Charter scope'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
