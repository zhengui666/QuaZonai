name: Apply authored local-console repair
on:
  push:
    branches: [codex/local-ui-simplification-20260920]
    paths: ['.github/local-console-repair.json']
permissions:
  contents: read
concurrency:
  group: local-console-authoring
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'zhengui666/QuaZonai' && github.ref == 'refs/heads/codex/local-ui-simplification-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply literal file edits and remove temporary transfer machinery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/local-console-repair
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          plan = json.loads(Path('.github/local-console-repair.json').read_text())
          assert plan['base'] == 'd7062806d9308939a035dc9a67d2e2c118f0889a'
          files = {}
          for entry in plan['files']:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert path.parts[0] in ('apps', 'crates', '.opensdlc') and str(path) not in files
              subprocess.run(['git', 'diff', '--exit-code', plan['base'], '--', str(path)], check=True)
              lines = path.read_text().splitlines(keepends=True)
              previous = 0
              for start, end, text in entry['edits']:
                  assert previous <= start <= end <= len(lines)
                  previous = end
              for start, end, text in reversed(entry['edits']):
                  lines[start:end] = text.splitlines(keepends=True)
              files[str(path)] = ''.join(lines)
          for name in plan['delete']:
              assert name.startswith('.github/local-console-') or name == '.github/workflows/local-console-edit.yml'
              assert Path(name).is_file() and not Path(name).is_symlink()
          for name, content in files.items():
              Path(name).write_text(content)
          for name in plan['delete']:
              Path(name).unlink()
          Path('/tmp/local-console-repair/authored-files.json').write_text(json.dumps(sorted(files), indent=2))
          PY
      - name: Native formatting only
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit the exact source to the existing task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair local-console regressions and remove temporary transfer files'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/local-ui-simplification-20260920 | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/local-ui-simplification-20260920
          git rev-parse HEAD > /tmp/local-console-repair/published-commit.txt
          git archive HEAD | gzip > /tmp/local-console-repair/source.tar.gz
          printf 'Literal authored edits and native formatting only. No application tests or review ran here.\n' > /tmp/local-console-repair/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-console-repair-${{ github.run_id }}
          path: /tmp/local-console-repair
          retention-days: 7
          if-no-files-found: error
