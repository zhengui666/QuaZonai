name: Local console authored edits
on:
  push:
    branches: [codex/local-ui-simplification-20260920]
    paths:
      - '.github/local-console-edits.json'
      - '.github/workflows/local-console-edit.yml'
permissions:
  contents: read
concurrency:
  group: local-console-authoring
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'zhengui666/QuaZonai' && github.ref == 'refs/heads/codex/local-ui-simplification-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    services:
      postgres:
        image: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-local-console-test
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DATABASE_URL: postgresql://postgres:isolated-local-console-test@127.0.0.1:55434/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only assistant-authored literal source edits
        id: apply
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/local-console-evidence
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          plan = json.loads(Path('.github/local-console-edits.json').read_text())
          source_base = plan['base']
          assert re.fullmatch(r'[a-f0-9]{40}', source_base)
          subprocess.run(['git', 'cat-file', '-e', source_base + '^{commit}'], check=True)
          entries = plan.get('files', [])
          for part in plan.get('parts', []):
              assert re.fullmatch(r'\.github/local-console-tests-[1-4]\.json', part)
              entries.extend(json.loads(Path(part).read_text()))
          prepared = {}
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'apps', 'crates', 'migrations', 'tests', 'docs', 'deploy', 'runtimes', '.opensdlc', 'AGENTS.md', 'DESIGN.md', 'README.md', 'OPERATIONS.md', 'CLI.md', 'Makefile', 'Cargo.toml'}
              assert str(path) not in prepared and not path.is_symlink()
              subprocess.run(['git', 'diff', '--exit-code', source_base, '--', str(path)], check=True)
              if entry.get('delete'):
                  assert path.is_file()
                  prepared[str(path)] = None
                  continue
              lines = path.read_text().splitlines(keepends=True) if path.exists() else []
              previous = 0
              for start, end, text in entry['edits']:
                  assert previous <= start <= end <= len(lines) and isinstance(text, str)
                  previous = end
              for start, end, text in reversed(entry['edits']):
                  lines[start:end] = text.splitlines(keepends=True)
              prepared[str(path)] = ''.join(lines)
          for correction in plan.get('replacements', []):
              path, old, new = correction['path'], correction['old'], correction['new']
              assert path in prepared and isinstance(prepared[path], str)
              assert old and prepared[path].count(old) == 1
              prepared[path] = prepared[path].replace(old, new)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('SOURCE_BASE=' + source_base + '\n')
          for name, content in prepared.items():
              path = Path(name)
              if content is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
          Path('/tmp/local-console-evidence/authored-paths.json').write_text(json.dumps(sorted(prepared), indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install native formatter and compiler
        id: toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Format exact authored Rust
        id: format
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee /tmp/local-console-evidence/format.log
      - name: Native library and binary check
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --workspace --lib --bins 2>&1 | tee /tmp/local-console-evidence/rust-check.log
      - name: Lint every native test and feature target
        id: targets
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo clippy --keep-going --workspace --all-targets --features server/native-codex,runtime/native-oci -- -D warnings 2>&1 | tee /tmp/local-console-evidence/all-targets.log
      - name: Generate real Rust contracts
        id: contracts
        if: steps.rust.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo run -q -p contracts --example generate > /tmp/local-console-evidence/domain-v1.openapi.json
          mv /tmp/local-console-evidence/domain-v1.openapi.json contracts/generated/domain-v1.openapi.json
          cargo run -q -p server -- openapi > /tmp/local-console-evidence/api-v2.openapi.json
          mv /tmp/local-console-evidence/api-v2.openapi.json contracts/generated/api-v2.openapi.json
      - name: Native frontend generation and production build
        id: web
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix apps/web install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web run build 2>&1 | tee /tmp/local-console-evidence/web-build.log
      - name: Frontend unit regressions
        id: unit
        continue-on-error: true
        run: |
          set -euo pipefail
          npm --prefix apps/web test 2>&1 | tee /tmp/local-console-evidence/web-unit.log
      - name: Browser regressions with bounded failure collection
        id: browser
        if: steps.web.outcome == 'success'
        continue-on-error: true
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e -- --max-failures=12 2>&1 | tee /tmp/local-console-evidence/browser.log
      - name: Actual PostgreSQL local authority and model persistence
        id: database_store
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --keep-going -p store --test auth --test browser_epoch --test codex_profiles --test control --test constraints -- --test-threads=4 2>&1 | tee /tmp/local-console-evidence/store-tests.log
      - name: Actual HTTP and migration regressions
        id: database_http
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo test --locked --keep-going -p server --test auth_http --test codex_profiles_http --test control_http --test migration_command --test data_http --test brief_http --test cycles_http --test mandate_http --test runs_http --test settings_http --test runtime_http -- --test-threads=4 2>&1 | tee /tmp/local-console-evidence/http-tests.log
      - name: Publish source only to the task branch
        id: publish
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code -- .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: verify direct local access and concise native-only settings'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/codex/local-ui-simplification-20260920 | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/local-ui-simplification-20260920
          git rev-parse HEAD > /tmp/local-console-evidence/published-commit.txt
      - name: Record source and actual step outcomes
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/local-console-evidence
          printf '%s\n' "$STEP_RESULTS" > /tmp/local-console-evidence/steps.json
          printf '%s\n' "$EXPECTED_HEAD" > /tmp/local-console-evidence/input-commit.txt
          git add -A
          git archive "$(git write-tree)" | gzip > /tmp/local-console-evidence/source.tar.gz
          git diff "${SOURCE_BASE:-$EXPECTED_HEAD}" --stat > /tmp/local-console-evidence/diff-stat.txt
          if test -d apps/web/test-results; then cp -R apps/web/test-results /tmp/local-console-evidence/browser-results; fi
          printf 'Development checkpoint only. Failed and skipped checks are not passes. Focused database tests and browser suite with 12-failure stop; not full PostgreSQL, packaged-service or real-account acceptance. Not reviewed or merged.\n' > /tmp/local-console-evidence/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-console-${{ github.run_id }}
          path: /tmp/local-console-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Fail on incomplete native verification
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ['RESULTS'])
          required = ['apply', 'format', 'rust', 'targets', 'contracts', 'web', 'unit', 'browser', 'database_store', 'database_http', 'publish']
          failed = [name for name in required if steps.get(name, {}).get('outcome') != 'success']
          assert not failed, 'Incomplete checks: ' + ', '.join(failed)
          PY
