name: Temporary pinned web dependency preparation
on:
  pull_request:
    paths: ['.github/workflows/prepare-web-dependencies.yml']
permissions:
  contents: read
jobs:
  public-inputs:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve public development inputs, not repository source or accounts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/web-dependencies
          cd /tmp/web-dependencies
          cat > package.json <<'JSON'
          {
            "name":"quazonai-web","version":"2.0.0-dev.1","private":true,"type":"module",
            "engines":{"node":">=22.16.0"},
            "dependencies":{"@ant-design/icons":"6.3.4","@tanstack/react-query":"5.102.8","antd":"6.6.2","ajv-formats":"3.0.1","openapi-fetch":"0.17.0","react":"19.2.8","react-dom":"19.2.8","react-router-dom":"7.8.0"},
            "devDependencies":{"@axe-core/playwright":"4.13.0","@biomejs/biome":"2.2.2","@playwright/test":"1.63.0","@testing-library/react":"16.3.3","@testing-library/user-event":"14.6.7","@types/node":"22.18.0","@types/react":"19.2.18","@types/react-dom":"19.2.7","@vitejs/plugin-react":"6.1.1","ajv":"8.20.0","jsdom":"30.0.1","openapi-typescript":"7.13.0","typescript":"5.9.2","vite":"8.2.2","vite-plugin-pwa":"1.3.0","vitest":"5.0.0","workbox-core":"7.4.1","workbox-precaching":"7.4.1","workbox-routing":"7.4.1","workbox-strategies":"7.4.1"}
          }
          JSON
          node -e 'JSON.parse(require("fs").readFileSync("package.json","utf8"))'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all > dependency-tree.txt
          tar -czf node-modules.tar.gz node_modules
          printf 'Public pinned development inputs and native npm lock only. No source execution, credentials, home, CI token or acceptance claim.\n' > SCOPE.txt
          test -s package-lock.json
          test -s node-modules.tar.gz
          test -s dependency-tree.txt
          test -s SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-web-inputs-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/web-dependencies/package*.json
            /tmp/web-dependencies/node-modules.tar.gz
            /tmp/web-dependencies/dependency-tree.txt
            /tmp/web-dependencies/SCOPE.txt
          retention-days: 1
          if-no-files-found: error
