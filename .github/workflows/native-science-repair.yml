# Temporary exact-source/native-lock preparation. Remove before final-source validation.
name: Native science source repair
on:
  pull_request:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
jobs:
  prepare:
    if: github.head_ref == 'codex/native-science-feedback-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Apply only authored source and keep the accepted native package graph
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/research-repair"
          git rev-parse HEAD > "$RUNNER_TEMP/research-repair/tested-commit.txt"
          cp Cargo.lock "$RUNNER_TEMP/research-repair/baseline-Cargo.lock"
          gzip -dc .github/native-science-repair.patch.gz > "$RUNNER_TEMP/research-repair/authored.patch"
          git apply --check "$RUNNER_TEMP/research-repair/authored.patch"
          git apply "$RUNNER_TEMP/research-repair/authored.patch"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > "$RUNNER_TEMP/research-repair/rustc.txt"
          rustup run "$RUSTUP_TOOLCHAIN" cargo metadata --format-version 1 --all-features > "$RUNNER_TEMP/research-repair/metadata.json"
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all
          git diff --check
          python3 - <<'PY'
          import os, pathlib, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'research-repair'
          before = tomllib.loads((root / 'baseline-Cargo.lock').read_text())
          after = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          assert len(before['package']) == len(after['package'])
          changed = []
          for old, new in zip(before['package'], after['package'], strict=True):
              if old == new:
                  continue
              assert old['name'] == new['name'] == 'runtime'
              assert {k: v for k, v in old.items() if k != 'dependencies'} == {k: v for k, v in new.items() if k != 'dependencies'}
              assert set(new['dependencies']) - set(old['dependencies']) == {'server', 'uuid'}
              assert not (set(old['dependencies']) - set(new['dependencies']))
              changed.append('runtime')
          assert changed == ['runtime']
          (root / 'package-graph.txt').write_text('Native Cargo retained every original package/version/source and dependency list except Runtime adding server and uuid test edges.\n')
          PY
          git diff --binary HEAD > "$RUNNER_TEMP/research-repair/applied.diff"
      - name: Return exact file candidates without commit, push or branch update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          const expected = ['Cargo.lock', 'apps/runtime/Cargo.toml', 'apps/runtime/tests/native_research_loop.rs', 'tests/support/cycles.rs'];
          const changed = execFileSync('git', ['diff', '--name-only', '-z', 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean).sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error('Unexpected source changes');
          const entries = [];
          for (const path of expected) {
            const content = await readFile(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (response.status !== 201) throw new Error(`Source staging failed: ${response.status}`);
            const blob = await response.json();
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            const output = `${process.env.RUNNER_TEMP}/research-repair/files/${path}`;
            await mkdir(dirname(output), { recursive: true });
            await writeFile(output, content);
          }
          await writeFile(`${process.env.RUNNER_TEMP}/research-repair/entries.json`, JSON.stringify({
            source_head: process.env.EXPECTED_HEAD, entries,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-repair-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/research-repair/
          retention-days: 7
          if-no-files-found: error
