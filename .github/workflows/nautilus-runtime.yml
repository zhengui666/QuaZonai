name: Nautilus Runtime

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  remote-nautilus-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      QUAZONAI_NAUTILUS_RUNTIME_URL: http://127.0.0.1:9010
      QUAZONAI_NAUTILUS_RUNTIME_TOKEN: ci-nautilus-runtime-token
      QUAZONAI_NAUTILUS_SEALED_RUNTIME_URL: http://127.0.0.1:9011
      QUAZONAI_NAUTILUS_SEALED_RUNTIME_TOKEN: ci-sealed-nautilus-runtime-token
      QUAZONAI_NAUTILUS_VERSION: 1.231.0
      QUAZONAI_NAUTILUS_CONTRACT_VERSION: '2'
      QUAZONAI_NAUTILUS_RUNTIME_TIMEOUT_SECONDS: '180'
      QUAZONAI_NAUTILUS_RUNTIME_POLL_SECONDS: '0.05'
      QUAZONAI_NAUTILUS_RUNTIME_VERIFY_TLS: 'false'
      QUAZONAI_NAUTILUS_CATALOG_ROOT: /tmp/quazonai-nautilus-catalogs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install QuaZonai and pinned remote runtime
        run: python -m pip install -e 'backend[dev,research,nautilus-runtime]'
      - name: Verify exact Nautilus pin
        run: |
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("nautilus_trader") == "1.231.0"
          PY
      - name: Migrate database
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Start independent remote runtime
        run: |
          QUAZONAI_NAUTILUS_RUNTIME_TOKEN=ci-nautilus-runtime-token QUAZONAI_NAUTILUS_CATALOG_ROOT="$QUAZONAI_NAUTILUS_CATALOG_ROOT/research" QUAZONAI_NAUTILUS_PORT=9010 quazonai-nautilus-runtime > /tmp/quazonai-nautilus-research.log 2>&1 &
          echo $! > /tmp/quazonai-nautilus-research.pid
          QUAZONAI_NAUTILUS_RUNTIME_TOKEN=ci-sealed-nautilus-runtime-token QUAZONAI_NAUTILUS_CATALOG_ROOT="$QUAZONAI_NAUTILUS_CATALOG_ROOT/sealed" QUAZONAI_NAUTILUS_PORT=9011 quazonai-nautilus-runtime > /tmp/quazonai-nautilus-sealed.log 2>&1 &
          echo $! > /tmp/quazonai-nautilus-sealed.pid
          for attempt in $(seq 1 90); do
            research_ok=0
            sealed_ok=0
            curl --fail --silent -H 'Authorization: Bearer ci-nautilus-runtime-token' -H 'X-QuaZonai-Quant-Contract: 2' http://127.0.0.1:9010/v1/capabilities > /tmp/research-capabilities.json && research_ok=1
            curl --fail --silent -H 'Authorization: Bearer ci-sealed-nautilus-runtime-token' -H 'X-QuaZonai-Quant-Contract: 2' http://127.0.0.1:9011/v1/capabilities > /tmp/sealed-capabilities.json && sealed_ok=1
            if [ "$research_ok" = 1 ] && [ "$sealed_ok" = 1 ]; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              cat /tmp/quazonai-nautilus-research.log
              cat /tmp/quazonai-nautilus-sealed.log
              exit 1
            fi
            sleep 2
          done
      - name: Real Idea to Paper feedback E2E
        run: pytest -q backend/tests/integration/test_nautilus_remote_runtime.py
      - name: Build isolated remote runtime image
        run: docker build --file deploy/Dockerfile.nautilus-runtime --tag quazonai-nautilus-runtime-ci .
      - name: Runtime logs
        if: always()
        run: |
          cat /tmp/quazonai-nautilus-research.log || true
          cat /tmp/quazonai-nautilus-sealed.log || true
      - name: Stop independent runtime
        if: always()
        run: |
          if test -f /tmp/quazonai-nautilus-research.pid; then
            kill "$(cat /tmp/quazonai-nautilus-research.pid)" || true
          fi
          if test -f /tmp/quazonai-nautilus-sealed.pid; then
            kill "$(cat /tmp/quazonai-nautilus-sealed.pid)" || true
          fi
