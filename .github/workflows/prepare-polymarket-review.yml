name: Prepare Polymarket review corrections
on:
  push:
    branches: [feat/polymarket-native-research]
    paths:
      - .github/workflows/prepare-polymarket-review.yml
      - .opensdlc/tasks/polymarket-native-research/review-fixes.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: polymarket-native-preparation
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    if: github.ref == 'refs/heads/feat/polymarket-native-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-native-rust-1.98.1-${{ github.run_id }}
          restore-keys: polymarket-native-rust-1.98.1-
      - name: Apply authored correction and native formatting
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          script=.opensdlc/tasks/polymarket-native-research/review-fixes.py
          if test -f "$script"; then
            python3 "$script"
            git rm "$script"
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc -Vv
          cargo fmt --all
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'fix: apply authored Polymarket review corrections and native formatting'
            git push origin HEAD:refs/heads/feat/polymarket-native-research
          fi
          git rev-parse HEAD
      - name: Compile affected native entrypoints without waiving warnings
        run: |
          set -euo pipefail
          cargo clippy --locked -p job --features polymarket-history --all-targets -- -D warnings
          cargo clippy --locked -p runtime --features native-oci --all-targets -- -D warnings
          cargo clippy --locked -p server --features native-codex --all-targets -- -D warnings
      - name: Execute source and lifecycle regressions
        run: |
          set -euo pipefail
          cargo test --locked -p contracts -p domain
          cargo test --locked -p job --features polymarket-history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Regenerate original Rust and Web contracts
        run: |
          set -euo pipefail
          cargo run --locked -q -p contracts --example generate > "$RUNNER_TEMP/domain.json"
          cargo run --locked -q -p server -- openapi > "$RUNNER_TEMP/api.json"
          cargo run --locked -q -p runtime -- openapi > "$RUNNER_TEMP/runtime.json"
          cp "$RUNNER_TEMP/domain.json" contracts/generated/domain-v1.openapi.json
          cp "$RUNNER_TEMP/api.json" contracts/generated/api-v2.openapi.json
          cp "$RUNNER_TEMP/runtime.json" contracts/generated/runtime-v1.openapi.json
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web run generate
          git add contracts/generated/ apps/web/src/generated/
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'build: regenerate frozen native settlement contracts'
            git push origin HEAD:refs/heads/feat/polymarket-native-research
          fi
          git diff --exit-code
          git rev-parse HEAD
      - name: Web contract and behavior regression
        run: |
          set -euo pipefail
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          git diff --exit-code
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-native-rust-1.98.1-${{ github.run_id }}
