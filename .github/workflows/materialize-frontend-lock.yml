name: Materialize frontend lock

on:
  push:
    branches:
      - codex/production-rebuild
    paths:
      - '.github/workflows/materialize-frontend-lock.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Materialize exact lockfile
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(frontend): commit package lock'
          git push origin HEAD:codex/production-rebuild

# one-shot: remove this workflow after the lock commit is present
