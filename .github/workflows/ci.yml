name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Nautilus-first ownership boundary
        run: |
          test ! -e backend/src/api/deployments.py
          test ! -e backend/src/api/risk.py
          test ! -e backend/src/api/integrations.py
          test ! -e backend/src/db/deployment_models.py
          test ! -e backend/src/db/risk_models.py
          test ! -e backend/src/runners/live.py
          test ! -e backend/src/runners/live_node.py
          test ! -e backend/src/runners/live_supervisor.py
          test ! -d backend/src/mcp_gateway
          test ! -d native/quazonai_nautilus_risk
          ! grep -R -n -E '/api/v1/(deployments|risk-accounts|execution-connections)|quazonai-live-supervisor|quazonai-mcp-gateway|mcp_gateway|QUAZONAI_MCP_' backend/src compose.yml backend/pyproject.toml deploy/Dockerfile.backend
          ! grep -R -n -E 'mcp_gateway|PyJWT' backend/pyproject.toml deploy/Dockerfile.backend THIRD_PARTY_NOTICES.md
          grep -q '"mcp>=' backend/pyproject.toml
          allowed='backend/src/runners/nautilus_remote_runtime.py'
          imports=$(grep -R -l -E '(^|[[:space:]])(from|import)[[:space:]]+nautilus_trader' backend/src || true)
          for path in $imports; do
            test "$path" = "$allowed" || { echo "NautilusTrader import escaped remote runtime boundary: $path"; exit 1; }
          done
          ! grep -R -n -E 'TradingNode|LiveNode|submit_order|cancel_order|modify_order' backend/src/api backend/src/quant_runtime
      - name: Install product and test runtimes
        run: python -m pip install -e 'backend[dev,research,agent,nautilus-runtime]'
      - name: PMXT plugin regression tests
        run: |
          mkdir -p /tmp/quazonai-pmxt-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/quazonai-pmxt-wheel plugins/pmxt-archive
          python -m pip install --no-deps /tmp/quazonai-pmxt-wheel/*.whl
          pytest -q plugins/pmxt-archive/tests
      - name: Compile
        run: python -m compileall -q backend/src
      - name: Lint
        run: ruff check --config backend/pyproject.toml backend/src backend/tests
      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/src
      - name: Runtime import smoke
        run: |
          python - <<'PY'
          import openai_codex
          import optuna
          import pyarrow
          import quant_runtime
          import quazonai
          print(quazonai.__version__)
          print(quant_runtime.PINNED_NAUTILUS_VERSION)
          PY
      - name: Database preflight and migration
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Core tests
        run: pytest -q -m 'not nautilus' backend/tests
      - name: Remote Nautilus integration
        env:
          QUAZONAI_NAUTILUS_RUNTIME_URL: http://127.0.0.1:8011
          QUAZONAI_NAUTILUS_RUNTIME_TOKEN: ci-remote-nautilus-token
          QUAZONAI_NAUTILUS_SEALED_RUNTIME_URL: http://127.0.0.1:8012
          QUAZONAI_NAUTILUS_SEALED_RUNTIME_TOKEN: ci-sealed-nautilus-token
          QUAZONAI_NAUTILUS_CATALOG_ROOT: /tmp/quazonai-nautilus-catalogs
          QUAZONAI_NAUTILUS_VERSION: 1.231.0
          QUAZONAI_NAUTILUS_CONTRACT_VERSION: '2'
          QUAZONAI_NAUTILUS_RUNTIME_VERIFY_TLS: 'false'
        run: |
          rm -rf "$QUAZONAI_NAUTILUS_CATALOG_ROOT"
          QUAZONAI_NAUTILUS_RUNTIME_TOKEN=ci-remote-nautilus-token QUAZONAI_NAUTILUS_CATALOG_ROOT="$QUAZONAI_NAUTILUS_CATALOG_ROOT/research" QUAZONAI_NAUTILUS_PORT=8011 quazonai-nautilus-runtime > /tmp/nautilus-research-runtime.log 2>&1 &
          research_pid=$!
          QUAZONAI_NAUTILUS_RUNTIME_TOKEN=ci-sealed-nautilus-token QUAZONAI_NAUTILUS_CATALOG_ROOT="$QUAZONAI_NAUTILUS_CATALOG_ROOT/sealed" QUAZONAI_NAUTILUS_PORT=8012 quazonai-nautilus-runtime > /tmp/nautilus-sealed-runtime.log 2>&1 &
          sealed_pid=$!
          cleanup() {
            kill "$research_pid" "$sealed_pid" 2>/dev/null || true
            cat /tmp/nautilus-research-runtime.log
            cat /tmp/nautilus-sealed-runtime.log
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            research_ok=0
            sealed_ok=0
            curl --fail --silent -H 'Authorization: Bearer ci-remote-nautilus-token' -H 'X-QuaZonai-Quant-Contract: 2' http://127.0.0.1:8011/v1/capabilities > /tmp/nautilus-research-capabilities.json && research_ok=1
            curl --fail --silent -H 'Authorization: Bearer ci-sealed-nautilus-token' -H 'X-QuaZonai-Quant-Contract: 2' http://127.0.0.1:8012/v1/capabilities > /tmp/nautilus-sealed-capabilities.json && sealed_ok=1
            if [ "$research_ok" = 1 ] && [ "$sealed_ok" = 1 ]; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              exit 1
            fi
            sleep 1
          done
          pytest -q -m nautilus backend/tests/integration/test_nautilus_remote_runtime.py
      - name: Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Production control-plane image build
        run: |
          docker build --file deploy/Dockerfile.backend --tag quazonai-ci .
          docker run --rm --entrypoint python quazonai-ci - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('nautilus_trader') is None
          PY
      - name: Remote Nautilus image build
        run: |
          docker build --file deploy/Dockerfile.nautilus-runtime --tag quazonai-nautilus-ci .
          docker run --rm --entrypoint python quazonai-nautilus-ci - <<'PY'
          import nautilus_trader
          assert nautilus_trader.__version__ == '1.231.0'
          PY
      - name: Research service smoke
        env:
          QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai
          QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai
        run: |
          docker network inspect quazonai-runtime >/dev/null 2>&1 || docker network create quazonai-runtime
          docker compose --env-file .env.example up --detach --build
          proxy_id=$(docker compose --env-file .env.example ps -q nautilus-runtime-proxy)
          test -n "$proxy_id"
          test "$(docker inspect "$proxy_id" --format '{{.State.Status}}')" = running
          test "$(docker inspect "$proxy_id" --format '{{.RestartCount}}')" = 0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health > /tmp/quazonai-health.json; then
              python - <<'PY'
          import json
          data = json.load(open('/tmp/quazonai-health.json', encoding='utf-8'))
          if not data.get('live') or not data.get('ready'):
              raise SystemExit(1)
          PY
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose --env-file .env.example ps
              docker compose --env-file .env.example logs --no-color
              exit 1
            fi
            sleep 2
          done
          for proxy_attempt in $(seq 1 15); do
            proxy_status=$(docker inspect "$proxy_id" --format '{{.State.Status}}')
            proxy_restarts=$(docker inspect "$proxy_id" --format '{{.RestartCount}}')
            if [ "$proxy_status" != running ] || [ "$proxy_restarts" != 0 ]; then
              docker compose --env-file .env.example ps
              docker compose --env-file .env.example logs --no-color nautilus-runtime-proxy
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root"'
          docker compose --env-file .env.example ps
      - name: Stop Compose
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
