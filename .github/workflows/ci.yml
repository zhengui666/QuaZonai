name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Research ownership boundary
        run: |
          test ! -e backend/src/api/deployments.py
          test ! -e backend/src/api/risk.py
          test ! -e backend/src/api/integrations.py
          test ! -e backend/src/db/deployment_models.py
          test ! -e backend/src/db/risk_models.py
          test ! -e backend/src/runners/live.py
          test ! -e backend/src/runners/live_node.py
          test ! -e backend/src/runners/live_supervisor.py
          test ! -d backend/src/mcp_gateway
          test ! -d native/quazonai_nautilus_risk
          ! grep -R -n -E '/api/v1/(deployments|risk-accounts|execution-connections)|quazonai-live-supervisor|quazonai-mcp-gateway|mcp_gateway|QUAZONAI_MCP_' backend/src compose.yml backend/pyproject.toml deploy/Dockerfile.backend
          ! grep -R -n -E 'backend\[[^]]*mcp|PyJWT' backend/pyproject.toml deploy/Dockerfile.backend THIRD_PARTY_NOTICES.md
          python tools/check_quant_runtime_boundary.py
      - name: Install product runtimes
        run: python -m pip install -e 'backend[dev,research,agent]'
      - name: Compile
        run: python -m compileall -q backend/src
      - name: Lint
        run: ruff check --config backend/pyproject.toml backend/src backend/tests
      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/src
      - name: Runtime import smoke
        run: |
          python - <<'PY'
          import openai_codex
          import optuna
          import pyarrow
          import quazonai
          print(quazonai.__version__)
          PY
      - name: Database preflight and migration
        run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - name: Tests
        run: pytest -q backend/tests
      - name: Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Production image build
        run: docker build --file deploy/Dockerfile.backend --tag quazonai-ci .
      - name: Research service smoke
        env:
          QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai
          QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai
        run: |
          docker compose --env-file .env.example up --detach --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health > /tmp/quazonai-health.json; then
              python - <<'PY'
          import json
          data = json.load(open('/tmp/quazonai-health.json', encoding='utf-8'))
          if not data.get('live') or not data.get('ready'):
              raise SystemExit(1)
          PY
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose --env-file .env.example ps
              docker compose --env-file .env.example logs --no-color
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root"'
          docker compose --env-file .env.example ps
      - name: Stop Compose
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  nautilus-runtime:
    name: Real remote Nautilus runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OS capability sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          APPARMOR
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-ipc --unshare-pid --unshare-net -- true
      - name: Install pinned remote runtime
        run: python -m pip install -e 'nautilus_runtime[dev]'
      - name: Real BacktestNode and candidate conformance integration
        run: pytest -q nautilus_runtime/tests
