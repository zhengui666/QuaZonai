name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docs-links:
    name: Documentation / local links and anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact event Head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -c core.quotePath=false ls-files -- '*.md' > "$RUNNER_TEMP/documentation-files"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --files-from '${{ runner.temp }}/documentation-files'
          output: ${{ runner.temp }}/lychee.md
          token: ''
  rust-native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the exact event Head before executing repository code
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Export only the committed application dependency inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence/dependency-inputs
          git archive HEAD Cargo.toml Cargo.lock \
            apps/web/package.json apps/web/package-lock.json \
            runtimes/codex/package.json runtimes/codex/package-lock.json \
            | tar --extract --directory /tmp/native-evidence/dependency-inputs
          printf '%s\n' 'Source lockfile inventory only: includes optional/development/platform packages, not proven linked binaries or deployed images. Unknown licenses remain unknown; this is not license clearance or a vulnerability audit. Preserve original lockfiles and Syft metadata to distinguish Git sources.' > /tmp/native-evidence/sbom-scope.txt
      - name: Install the pinned upstream SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.52.0
      - name: Generate native source dependency inventories
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT_BIN" version > /tmp/native-evidence/syft-version.txt
          "$SYFT_BIN" scan dir:/tmp/native-evidence/dependency-inputs \
            -o syft-json=/tmp/native-evidence/source-dependencies.syft.json \
            -o spdx-json=/tmp/native-evidence/source-dependencies.spdx.json
          jq -e '
            .descriptor.name == "syft" and .descriptor.version == "1.52.0" and
            (.artifacts | length > 0) and
            ([.artifacts[].locations[]?.accessPath] |
              any(.[]; endswith("Cargo.lock")) and
              any(.[]; endswith("apps/web/package-lock.json")) and
              any(.[]; endswith("runtimes/codex/package-lock.json")))
          ' /tmp/native-evidence/source-dependencies.syft.json
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
            /tmp/native-evidence/source-dependencies.spdx.json
          git diff --exit-code
      - name: Prepare isolated native filesystem fault test
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence
          cp /usr/bin/unshare /tmp/native-evidence/unshare
          cat > /tmp/native-evidence/artifact-filesystem.apparmor <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile quazonai-ci-artifact-filesystem /tmp/native-evidence/unshare flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /tmp/native-evidence/artifact-filesystem.apparmor
          echo 'QZ_TEST_UNSHARE=/tmp/native-evidence/unshare' >> "$GITHUB_ENV"
      - name: Verify committed Rust sources and native dependency graph
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > /tmp/native-evidence/rustc.txt
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all -- --check
          rustup run "$RUSTUP_TOOLCHAIN" cargo clippy --locked --workspace --all-targets --features server/native-codex,runtime/native-oci -- -D warnings
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked --workspace --exclude store --exclude server
          rustup run "$RUSTUP_TOOLCHAIN" cargo build --locked --workspace --all-targets
          rustup run "$RUSTUP_TOOLCHAIN" cargo tree --locked -e normal > /tmp/native-evidence/dependencies.txt
          if grep -Eq '(^|[[:space:]])pyo3(-ffi)? v' /tmp/native-evidence/dependencies.txt; then
            echo 'Unexpected Python bridge in the native runtime' >&2
            exit 1
          fi
      - name: Compare native-generated contracts without changing the checkout
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo run --locked -q -p contracts --example generate > /tmp/native-evidence/domain-v1.openapi.json
          diff -u contracts/generated/domain-v1.openapi.json /tmp/native-evidence/domain-v1.openapi.json
          rustup run "$RUSTUP_TOOLCHAIN" cargo run --locked -q -p server -- openapi > /tmp/native-evidence/api-v2.openapi.json
          diff -u contracts/generated/api-v2.openapi.json /tmp/native-evidence/api-v2.openapi.json
          make check-cli
          node tests/contracts/decimal-wire.mjs | tee /tmp/native-evidence/decimal-wire.log
          node tests/contracts/bigint-wire.mjs | tee /tmp/native-evidence/bigint-wire.log
          node tests/contracts/fraction-wire.mjs | tee /tmp/native-evidence/fraction-wire.log
      - name: Execute real Rust solver, Nautilus and Arrow round-trip
        run: target/debug/job verify-native --output /tmp/native-evidence/native
      - name: Install locked official Codex and verify native stdio
        run: |
          set -euo pipefail
          npm ci --prefix runtimes/codex --ignore-scripts --no-audit --no-fund
          export CODEX_NATIVE_BIN="$PWD/runtimes/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test "$("$CODEX_NATIVE_BIN" --version)" = 'codex-cli 0.144.4'
          mkdir /tmp/codex-schema-home
          CODEX_HOME=/tmp/codex-schema-home "$CODEX_NATIVE_BIN" app-server generate-json-schema --out /tmp/native-evidence/codex-schema
          export CODEX_PROBE_DIR=/tmp/codex-probe
          # The workspace/all-targets build above already produced this binary.
          # Keep compilation outside the native protocol's 90-second deadline:
          # a separate cargo run can rebuild a differently unified dependency graph.
          test -x target/debug/examples/codex_contract
          timeout --kill-after=5s 90s target/debug/examples/codex_contract
          cp /tmp/codex-probe/codex-probe.json /tmp/native-evidence/codex-probe.json
          # Real official process, loopback Responses fixture, native persistence
          # and process restart. No account or paid inference is used by this job.
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p server --features native-codex --test codex_native 2>&1 | tee /tmp/native-evidence/codex-client.log
      - name: Reject legacy paths and prefixed directories
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)qz-[^/]*/|^(backend|frontend|plugins)/'; then
            echo 'Forbidden legacy or prefixed directory remains' >&2
            exit 1
          fi
          test ! -e compose.yml
          test ! -d runtimes/science
          test ! -d .github/updates
          test ! -d .github/changes
          test ! -e .github/workflows/publish-native-source.yml
          test ! -e .github/workflows/apply-review-fixes.yml
          git diff --exit-code
      - name: Remove the job-only filesystem test profile
        if: always()
        run: |
          profile=/tmp/native-evidence/artifact-filesystem.apparmor
          if test -f "$profile"; then sudo apparmor_parser -R "$profile"; fi
      - name: Record exactly tested source and actual outcomes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence
          git rev-parse HEAD > /tmp/native-evidence/tested-commit.txt
          git archive --format=tar HEAD | gzip > /tmp/native-evidence/source.tar.gz
          cp Cargo.lock /tmp/native-evidence/Cargo.lock
          printf 'Native foundation only. This is not full W0-W8/T01-T42 acceptance.\n' > /tmp/native-evidence/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ env.EXPECTED_HEAD }}
          path: /tmp/native-evidence/
          retention-days: 7
          if-no-files-found: error
  database-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGMQ_IMAGE: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the exact event Head before executing repository code
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Execute PostgreSQL and PGMQ transaction contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/database-evidence
          git rev-parse HEAD > /tmp/database-evidence/tested-commit.txt
          database_password=$(openssl rand -hex 24)
          echo "::add-mask::$database_password"
          docker pull "$PGMQ_IMAGE"
          docker run --detach --name native-database --env "POSTGRES_PASSWORD=$database_password" "$PGMQ_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec native-database pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec native-database pg_isready -h 127.0.0.1 -U postgres
          docker exec -i --env "PGPASSWORD=$database_password" native-database psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 < tests/native/pgmq_contract.sql | tee /tmp/database-evidence/contract.log
          docker image inspect --format '{{json .RepoDigests}}' "$PGMQ_IMAGE" > /tmp/database-evidence/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: database-evidence-${{ env.EXPECTED_HEAD }}
          path: /tmp/database-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable database
        if: always()
        run: docker rm --force --volumes native-database
  store-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PGMQ_IMAGE: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the exact event Head before executing repository code
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Start isolated PostgreSQL and verify extension version
        run: |
          set -euo pipefail
          mkdir -p /tmp/store-evidence
          git rev-parse HEAD > /tmp/store-evidence/tested-commit.txt
          database_password=$(openssl rand -hex 24)
          echo "::add-mask::$database_password"
          echo "DATABASE_URL=postgres://postgres:${database_password}@127.0.0.1:55432/postgres" >> "$GITHUB_ENV"
          docker pull "$PGMQ_IMAGE"
          docker run --detach --name store-database --publish 127.0.0.1:55432:5432 --env "POSTGRES_PASSWORD=$database_password" "$PGMQ_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec store-database pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec store-database pg_isready -h 127.0.0.1 -U postgres
          docker exec --env "PGPASSWORD=$database_password" store-database psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'SELECT version()' > /tmp/store-evidence/database-version.txt
          docker image inspect --format '{{json .RepoDigests}}' "$PGMQ_IMAGE" > /tmp/store-evidence/image.json
      - name: Prepare the native user resource manager for Mission tests
        run: |
          set -euo pipefail
          mission_uid=$(id -u)
          sudo loginctl enable-linger "$mission_uid"
          sudo systemctl start "user@$mission_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$mission_uid"
          systemctl --user show --property=Version > /tmp/store-evidence/systemd-version.txt
          prlimit --version > /tmp/store-evidence/prlimit-version.txt
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Run every Store test against real independently migrated databases
        env:
          QZ_TEST_PG_CONTAINER: store-database
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > /tmp/store-evidence/rustc.txt
          npm ci --prefix runtimes/codex --ignore-scripts --no-audit --no-fund
          export CODEX_NATIVE_BIN="$PWD/runtimes/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test "$("$CODEX_NATIVE_BIN" --version)" = 'codex-cli 0.144.4'
          # Allow the pinned sandbox launcher to use Ubuntu's restricted user namespaces.
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > /tmp/store-evidence/userns-restriction.txt
          cat > /tmp/store-evidence/quazonai-ci-codex.apparmor <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile quazonai-ci-codex "$CODEX_NATIVE_BIN" flags=(unconfined) {
            userns,
          }
          EOF
          cp /usr/bin/unshare /tmp/store-evidence/unshare
          cat >> /tmp/store-evidence/quazonai-ci-codex.apparmor <<'EOF'
          profile quazonai-ci-cycle-filesystem /tmp/store-evidence/unshare flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /tmp/store-evidence/quazonai-ci-codex.apparmor
          export QZ_TEST_UNSHARE=/tmp/store-evidence/unshare
          # Isolated native homes and synthetic Responses only, never real credentials.
          # Includes native account/HTTP and App Server -> stdio MCP -> HTTP -> PG.
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p store -p server --features server/native-codex -- --test-threads=4 2>&1 | tee /tmp/store-evidence/tests.log
          git diff --exit-code
      - name: Remove the job-only native sandbox profile
        if: always()
        run: |
          set -euo pipefail
          profile=/tmp/store-evidence/quazonai-ci-codex.apparmor
          if test -f "$profile"; then sudo apparmor_parser -R "$profile"; fi
      - name: Preserve exact migrations and qualification of the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/store-evidence
          cp Cargo.lock /tmp/store-evidence/Cargo.lock
          cp migrations/*.sql /tmp/store-evidence/
          printf 'Native Store/HTTP/Codex fixture tests. Not full real-account, research-to-delivery, or production acceptance.\n' > /tmp/store-evidence/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-evidence-${{ env.EXPECTED_HEAD }}
          path: /tmp/store-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this disposable database
        if: always()
        run: docker rm --force --volumes store-database
  foundation-checks:
    if: always()
    needs: [docs-links, rust-native-contracts, database-native, store-postgres]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every foundation check to succeed
        env:
          DOCS_RESULT: ${{ needs.docs-links.result }}
          RUST_RESULT: ${{ needs.rust-native-contracts.result }}
          DATABASE_RESULT: ${{ needs.database-native.result }}
          STORE_RESULT: ${{ needs.store-postgres.result }}
        run: |
          test "$DOCS_RESULT" = success
          test "$RUST_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$STORE_RESULT" = success
          echo 'Maintained-source checks passed; full product acceptance is tracked separately in docs/architecture/issue-62-execution.md.'
