name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: true
env:
  TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      science: ${{ steps.paths.outputs.science }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          science=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            science=false
            if git diff --name-only "$BASE_REVISION" HEAD | grep -E '^(Cargo\.(toml|lock)|rust-toolchain\.toml|apps/(job|service|research|cli)/|crates/|packages/contracts/|runtimes/(native|data)/|deploy/|Makefile|\.github/)' >/dev/null; then science=true; fi
          fi
          echo "science=$science" >> "$GITHUB_OUTPUT"
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            apps/service/package-lock.json
            apps/research/package-lock.json
            apps/cli/package-lock.json
      - run: |
          npm ci --prefix apps/service --no-audit --no-fund
          npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/cli --ignore-scripts --no-audit --no-fund
      - run: make check-ts check-deploy
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - run: make check-web
      - run: node apps/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
        env:
          PI_SCRATCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-${{ env.TEST_REVISION }}
          path: ${{ runner.temp }}/quazonai-web-playwright/
          if-no-files-found: ignore
          retention-days: 7
  science-core:
    needs: scope
    if: needs.scope.outputs.science == 'true'
    # glibc baseline is compatible with the pinned bookworm Node image.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PROFILE: ${{ github.event_name == 'push' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            apps/service/package-lock.json
            apps/research/package-lock.json
      - run: |
          npm ci --prefix apps/service --no-audit --no-fund
          npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quazonai-science-v2
          key: ubuntu-22-${{ env.PROFILE }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Build each required native executable once
        run: bash deploy/docker/native-build.sh "$PROFILE" "$RUNNER_TEMP/native-artifacts"
      - name: Retained native rules, real science and integrated Node core scenario
        env:
          QZ_JOB_BINARY: ${{ runner.temp }}/native-artifacts/job
        run: make check-science check-core PROFILE="$PROFILE"
      - name: Retain the exact tested native binaries, not a second build
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/native-artifacts/tested-revision"
          tar -czf "$RUNNER_TEMP/native.tar.gz" -C "$RUNNER_TEMP/native-artifacts" job source-tools catalog-prepare browser_catalog_fixture tested-revision
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ env.TEST_REVISION }}
          path: ${{ runner.temp }}/native.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
