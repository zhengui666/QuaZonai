name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
concurrency:
  group: native-ci-${{ github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  rust-native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain before cache restore
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Restore dependency-only Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Compiler/host, env, member manifests and Cargo.lock are also action inputs.
          prefix-key: quazonai-native-deps-v1
          key: ubuntu-24.04-host-dev-test-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', 'tests/native/rust_unit.sh', 'tests/native/portfolio_release_regression.sh') }}
          workspaces: ". -> target"
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: true
      - name: Compile all Rust targets and optional feature paths
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > /tmp/native-evidence/rustc.txt
          # Compile Docker-specific adapters without executing container acceptance.
          rustup run "$RUSTUP_TOOLCHAIN" cargo check --locked --workspace --all-targets --all-features
          rustup run "$RUSTUP_TOOLCHAIN" cargo build --locked --workspace --lib --bins --features job/catalog-prepare,job/polymarket-history,job/native-paper-test,job/native-sandbox-test,server/native-codex
      - name: Run classified Rust rule and local component tests
        run: |
          set -euo pipefail
          bash tests/native/rust_unit.sh rustup run "$RUSTUP_TOOLCHAIN" cargo 2>&1 | tee /tmp/native-evidence/tests.log
      - name: Record exactly tested source and actual outcomes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-evidence
          git rev-parse HEAD > /tmp/native-evidence/tested-commit.txt
          git archive --format=tar HEAD | gzip > /tmp/native-evidence/source.tar.gz
          cp Cargo.lock /tmp/native-evidence/Cargo.lock
          printf 'All-target/all-feature Rust check; lib/bin build; classified rule/local component tests. Integration/example linking, doctests, native services and broad PG business chains run in rust-regression.yml; two original real-PG stack cases remain required in store-postgres.\n' > /tmp/native-evidence/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ env.EXPECTED_HEAD }}
          path: /tmp/native-evidence/
          retention-days: 7
          if-no-files-found: error
  store-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PGMQ_IMAGE: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Start isolated PostgreSQL and verify extension version
        run: |
          set -euo pipefail
          mkdir -p /tmp/store-evidence
          git rev-parse HEAD > /tmp/store-evidence/tested-commit.txt
          database_password=$(openssl rand -hex 24)
          echo "::add-mask::$database_password"
          echo "DATABASE_URL=postgres://postgres:${database_password}@127.0.0.1:55432/postgres" >> "$GITHUB_ENV"
          docker pull "$PGMQ_IMAGE"
          docker run --detach --name store-database --publish 127.0.0.1:55432:5432 --env "POSTGRES_PASSWORD=$database_password" "$PGMQ_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec store-database pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec store-database pg_isready -h 127.0.0.1 -U postgres
          docker exec -i --env "PGPASSWORD=$database_password" store-database psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 < tests/native/pgmq_contract.sql | tee /tmp/store-evidence/pgmq-contract.log
          docker exec --env "PGPASSWORD=$database_password" store-database psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'SELECT version()' > /tmp/store-evidence/database-version.txt
          docker image inspect --format '{{json .RepoDigests}}' "$PGMQ_IMAGE" > /tmp/store-evidence/image.json
      - name: Run both original portfolio release stack regressions against real PostgreSQL
        env:
          QZ_TEST_PG_CONTAINER: store-database
          QZ_TEST_EVIDENCE: /tmp/store-evidence
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > /tmp/store-evidence/rustc.txt
          bash tests/native/portfolio_release_regression.sh rustup run "$RUSTUP_TOOLCHAIN" cargo
      - name: Run the recorded feature HTTP boundary against real PostgreSQL
        if: ${{ !cancelled() }}
        env:
          QZ_TEST_EVIDENCE: /tmp/store-evidence
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Use the existing disposable PostgreSQL and PGMQ instance}"
          evidence=${QZ_TEST_EVIDENCE:?}
          mkdir -p "$evidence"
          case=registered_features_keep_original_bytes_and_source_through_http
          phase=list
          trap 'status=$?; printf "phase=%s\nexit=%s\n" "$phase" "$status" > "$evidence/recorded-features-status.txt"' EXIT
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p server --features native-codex --test recorded_features_http "$case" -- --exact --list 2>&1 | tee "$evidence/recorded-features-list.log"
          test "$(grep -Fxc -- "$case: test" "$evidence/recorded-features-list.log" || true)" -eq 1
          phase=execute
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p server --features native-codex --test recorded_features_http "$case" -- --exact --nocapture --test-threads=1 2>&1 | tee "$evidence/recorded-features-test.log"
          test "$(grep -Fxc -- 'running 1 test' "$evidence/recorded-features-test.log" || true)" -eq 1
          grep -Eq -- '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$evidence/recorded-features-test.log"
          phase=verified
      - name: Preserve exact migrations and qualification of the evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/store-evidence
          cp Cargo.lock /tmp/store-evidence/Cargo.lock
          cp migrations/*.sql /tmp/store-evidence/
          printf 'Required scope: real PostgreSQL/PGMQ migrations and unchanged qualified_portfolio::release_freezes_original_package_and_replays_without_republishing, required to execute once in each of Store experiment_compilations and Server native-codex portfolio_study_http. Consult store-status.txt, server-status.txt and combined-status.txt for actual outcomes; missing outcomes are not a pass. Also required: registered_features_keep_original_bytes_and_source_through_http in Server native-codex recorded_features_http, with exactly one listed and executed non-ignored passing test. Consult recorded-features-list.log, recorded-features-test.log and recorded-features-status.txt for this separate boundary; missing or phase other than verified is not a pass. No complete Store/Server/HTTP/Codex suite claim.\n' > /tmp/store-evidence/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-evidence-${{ env.EXPECTED_HEAD }}
          path: /tmp/store-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this disposable database
        if: always()
        run: docker rm --force --volumes store-database
