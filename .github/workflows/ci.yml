name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref == 'refs/heads/dev' && github.sha || github.ref }}
  cancel-in-progress: true
env:
  TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  scope:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      science: ${{ steps.paths.outputs.science }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          science=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            science=false
            if git diff --name-only "$BASE_REVISION" HEAD | grep -E '^(Cargo\.(toml|lock)|rust-toolchain\.toml|apps/(job|nautilus|service|research|cli)/|crates/|packages/contracts/|runtimes/(native|data)/|deploy/|Makefile|\.github/)' >/dev/null; then science=true; fi
          fi
          echo "science=$science" >> "$GITHUB_OUTPUT"
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            apps/service/package-lock.json
            apps/research/package-lock.json
            apps/cli/package-lock.json
      - run: |
          npm ci --prefix apps/service --no-audit --no-fund
          npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/cli --ignore-scripts --no-audit --no-fund
      - run: make check-ts check-deploy
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/service/package-lock.json
            apps/research/package-lock.json
      - run: |
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/service --no-audit --no-fund
          npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
      - run: make check-web
      - name: Use the official Ubuntu mirror for browser dependencies
        run: |
          shopt -s nullglob
          apt_sources=(/etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
          has_apt_sources=false
          for apt_source in "${apt_sources[@]}"; do
            [[ -f "$apt_source" ]] || continue
            has_apt_sources=true
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' "$apt_source"
          done
          "$has_apt_sources" || { echo 'No supported APT source files found'; exit 1; }
      - run: node apps/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
        env:
          PI_SCRATCH_DIR: ${{ runner.temp }}
          QUAZONAI_WEB_E2E_PREVIEW: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-${{ env.TEST_REVISION }}
          path: ${{ runner.temp }}/quazonai-web-playwright/
          if-no-files-found: ignore
          retention-days: 7
  native-artifacts:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PROFILE: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quazonai-science-v2
          key: ubuntu-22-${{ env.PROFILE }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Build native artifacts for this revision
        run: bash deploy/docker/native-build.sh "$PROFILE" "$RUNNER_TEMP/native-artifacts"
      - name: Package native artifacts
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/native-artifacts/tested-revision"
          tar -czf "$RUNNER_TEMP/native.tar.gz" -C "$RUNNER_TEMP/native-artifacts" job source-tools catalog-prepare job-high-precision catalog-prepare-high-precision market-history native-manifest.json tested-revision
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ env.TEST_REVISION }}
          path: ${{ runner.temp }}/native.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  science-core:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.science == 'true'
    # glibc baseline is compatible with the pinned bookworm Node image.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # PRs can restore the base branch's release cache; a PR-only debug cache
      # cannot seed other PRs or the subsequent dev push.
      PROFILE: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TEST_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            apps/service/package-lock.json
            apps/research/package-lock.json
      - run: |
          npm ci --prefix apps/service --no-audit --no-fund
          npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Check native formatting before compiling the scientific stack
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: quazonai-science-v2
          key: ubuntu-22-${{ env.PROFILE }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Build each required native executable once
        run: bash deploy/docker/native-build.sh "$PROFILE" "$RUNNER_TEMP/native-artifacts"
      - name: Retained native rules and real science
        run: make check-science PROFILE="$PROFILE" QZ_EXPORT_OBSERVED_FIXTURES=0 QZ_SCIENCE_TEST_FILTER_ARGS="--skip export_disjoint_native_pm_revision_when_requested"
      - name: Verify remote Nautilus integration
        env:
          QZ_JOB_BINARY: ${{ runner.temp }}/native-artifacts/job
          QZ_PM_NATIVE_FIXTURE: ${{ runner.temp }}/qz-pm-native-fixture/source.json
          QZ_PM_FORWARD_FIXTURE_DIR: ${{ runner.temp }}/qz-pm-forward-fixture
        run: node --experimental-strip-types --test apps/service/test/remote-native.ts
      - name: Mapped public history in the optional native format
        run: |
          profile_args=()
          if [[ "$PROFILE" == release ]]; then profile_args+=(--release); fi
          python3 -I -B -m unittest discover -s runtimes/data -p test_cryptohftdata.py -v
          cargo test --locked "${profile_args[@]}" -p job --features market-history,catalog-prepare,hyperliquid-offline --bin market-history --test catalog --test catalog_prepare --test managed --test instrument_versions --test native_instrument_updates
          tick_fixture="$RUNNER_TEMP/tick-native-fixture"
          test ! -e "$tick_fixture"
          QZ_TICK_NATIVE_FIXTURE_DIR="$tick_fixture" cargo test --locked "${profile_args[@]}" -p job --features market-history,catalog-prepare,hyperliquid-offline --lib ticks::
          cargo test --locked "${profile_args[@]}" -p job --features market-history,catalog-prepare,hyperliquid-offline --lib catalog::currencies
          test -s "$tick_fixture/prepared/catalog-metadata.json"
          test -s "$tick_fixture/SOFTWARE_FIXTURE.txt"
          test -x "$RUNNER_TEMP/native-artifacts/job"
          test -x "$RUNNER_TEMP/native-artifacts/job-high-precision"
          QZ_JOB_BINARY="$RUNNER_TEMP/native-artifacts/job" QZ_TICK_JOB_BINARY="$RUNNER_TEMP/native-artifacts/job-high-precision" QZ_TICK_NATIVE_FIXTURE_DIR="$tick_fixture" node --experimental-strip-types --test apps/service/test/tick-native.test.ts
      - name: Retain the exact tested native binaries, not a second build
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/native-artifacts/tested-revision"
          tar -czf "$RUNNER_TEMP/native.tar.gz" -C "$RUNNER_TEMP/native-artifacts" job source-tools catalog-prepare job-high-precision catalog-prepare-high-precision market-history native-manifest.json tested-revision
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ env.TEST_REVISION }}
          path: ${{ runner.temp }}/native.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
