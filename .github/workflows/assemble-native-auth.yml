name: Assemble native authentication adapter (development only)

on:
  pull_request:
    paths:
      - '.github/workflows/assemble-native-auth.yml'

permissions:
  contents: read

concurrency:
  group: assemble-native-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate only the executor-prepared native adapter
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 385fd0c9eae4d2a909ad4edc669a328852accc18 HEAD
          python3 - <<'PY'
          import json, re, tomllib
          from pathlib import Path
          manifest = Path('Cargo.toml')
          text = manifest.read_text()
          members = tomllib.loads(text)['workspace']['members']
          assert 'crates/store' in members
          for name in ['Cargo.toml','src/lib.rs','src/authentication.rs','src/secrets.rs','tests/authentication.rs']:
              assert (Path('crates/integrations') / name).is_file(), name
          if 'crates/integrations' not in members:
              members.append('crates/integrations')
              text, count = re.subn(r'(?m)^members = \[[^\n]*\]', 'members = '+json.dumps(members), text, count=1)
              assert count == 1, 'unexpected workspace format; do not guess'
              manifest.write_text(text)
          test = Path('crates/integrations/tests/authentication.rs')
          original = test.read_text()
          old = '    assert!(uri.contains("digits=6"));'
          replacement = '    let parsed = totp_rs::TOTP::from_url(&uri).unwrap();\n    assert_eq!(parsed.digits, 6);\n    assert_eq!(parsed.step, 30);'
          if old in original:
              test.write_text(original.replace(old, replacement, 1))
          ci = Path('.github/workflows/ci.yml')
          content = ci.read_text()
          if not re.search(r'(?m)^  workflow_dispatch:', content):
              content, count = re.subn(r'(?m)^on:\s*\n', 'on:\n  workflow_dispatch:\n', content, count=1)
              assert count == 1, 'unexpected CI trigger format; do not guess'
              ci.write_text(content)
          research = Path('docs/research/reuse.md')
          text = research.read_text()
          marker = '## Native authentication integration: versioned upstream boundary'
          if marker not in text:
              research.write_text(text+'\n\n'+marker+'\n\n'
                  'This adapter uses Rust implementations; no Python exception is requested. '
                  'It is not a browser authentication service or evidence of complete T36 acceptance.\n\n'
                  '- totp-rs 5.7.0: native SHA-1, six digits, 30-second TOTP and otpauth URI; '
                  'https://docs.rs/totp-rs/5.7.0/totp_rs/struct.TOTP.html . '
                  'Tests use RFC 6238 Appendix B reference outputs; '
                  'https://www.rfc-editor.org/rfc/rfc6238#appendix-B . '
                  'Database time, monotonic accepted step, rate limits and operator enrollment remain Store responsibilities.\n'
                  '- Argon2 0.5.3: native salted PHC verifier for random 256-bit bootstrap capabilities; '
                  'https://docs.rs/argon2/0.5.3/argon2/ . '
                  'This is the native cryptography exception, not a QZ business hash gate.\n'
                  '- chacha20poly1305 0.10.1: native XChaCha20-Poly1305 authenticated encryption; '
                  'https://docs.rs/chacha20poly1305/0.10.1/chacha20poly1305/ . '
                  'The UUID reference and purpose are authenticated additional data. '
                  'Secret bytes never belong in domain receipts or public API results.\n'
                  '- cap-std 3.4.5 and rustix 1.1.4: bounded directory-relative access and no-follow native file opens; '
                  'https://docs.rs/cap-std/3.4.5/cap_std/fs/struct.Dir.html and '
                  'https://docs.rs/rustix/1.1.4/rustix/fs/struct.OFlags.html . '
                  'Only trusted processes receive the private directory; this does not prove Agent/container isolation.\n\n'
                  'The local adapter publishes a UUID reference only after file and directory synchronization. '
                  'Failed partial writes are unreferenced encrypted objects, never successful authority. '
                  'A damaged or missing master key fails startup; existing keys are not automatically replaced. '
                  'Actual formatting, compilation and test outcomes are recorded by the development workflow and subsequent read-only CI, '
                  'not inferred from this research entry.\n')
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo fmt -p integrations
      - name: Compile and verify upstream cryptography without credentials
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          mkdir -p /tmp/auth-adapter-evidence
          cargo check -p integrations 2>&1 | tee /tmp/auth-adapter-evidence/check.log
          cargo fmt -p integrations -- --check
          cargo clippy --locked -p integrations --all-targets -- -D warnings 2>&1 | tee /tmp/auth-adapter-evidence/clippy.log
          cargo test --locked -p integrations 2>&1 | tee /tmp/auth-adapter-evidence/tests.log
          git diff --stat > /tmp/auth-adapter-evidence/prepared-diff.txt
          printf '%s\n' 'Development adapter verification only; not complete authentication or rewrite acceptance.' > /tmp/auth-adapter-evidence/scope.txt
      - name: Publish the tested integration and remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/assemble-native-auth.yml
          git add Cargo.toml Cargo.lock crates/integrations docs/research/reuse.md .github/workflows/ci.yml .github/workflows/assemble-native-auth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(auth): integrate verified native Rust capability, TOTP and secret adapters' -m 'Native library reuse with reference and negative tests. This is an authentication integration foundation, not full browser login or Issue 62 acceptance. Remove the one-time development workflow; subsequent CI validates the committed lock and exact source.'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$BRANCH"
          unset AUTH
          git rev-parse HEAD > /tmp/auth-adapter-evidence/published-head.txt
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/dispatches" --method POST -f "ref=$BRANCH"
      - name: Preserve actual results, not acceptance claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-auth-adapter-${{ github.run_id }}
          path: /tmp/auth-adapter-evidence/
          if-no-files-found: error
          retention-days: 7
