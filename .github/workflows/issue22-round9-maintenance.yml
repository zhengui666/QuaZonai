name: Issue 22 round9 maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round9_patch.py
      - tools/fix_issue22_round9_patch.py
      - tools/fix_issue22_round9_workflow_patch.py
      - .github/workflows/issue22-round9-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply transparent closure patch
        run: |
          python tools/fix_issue22_round9_patch.py
          python tools/fix_issue22_round9_workflow_patch.py
          python tools/issue22_round9_patch.py
          python -m compileall -q backend/src backend/tests nautilus_runtime/src nautilus_runtime/tests
          git diff --check
          rm tools/fix_issue22_round9_patch.py tools/fix_issue22_round9_workflow_patch.py tools/issue22_round9_patch.py
          git config user.name 'Zheng UI'
          git config user.email 'aa64966298@163.com'
          git add -A
          git commit -m 'fix(runtime): close codex round9 lifecycle findings'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
