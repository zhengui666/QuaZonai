name: Issue 22 round9 maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round9_patch.py
      - .github/workflows/issue22-round9-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply transparent reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/issue22_round9_patch.py")
          text = path.read_text(encoding="utf-8")

          old = 'replace_once(p, "                    created_at=_now(),\\n", "                    created_at=received_at,\\n")'
          new = '''replace_once(
              p,
              "                    sample_size=sample_size,\\n                    created_at=_now(),\\n                )\\n",
              "                    sample_size=sample_size,\\n                    created_at=received_at,\\n                )\\n",
          )'''
          if old not in text:
              raise SystemExit("round9 hotfix: episode created_at patch source not found")
          text = text.replace(old, new, 1)

          anchor = 'p = "backend/tests/integration/test_issue22_final_guards.py"\nreplace_once(\n'
          insertion = '''p = "backend/tests/integration/test_issue22_final_guards.py"
          replace_once(
              p,
              "    candidate_id = uuid4()\\n    approval_id = uuid4()\\n",
              "",
          )
          replace_once(
          '''
          if anchor not in text:
              raise SystemExit("round9 hotfix: final-guards anchor not found")
          text = text.replace(anchor, insertion, 1)

          duration_anchor = '''replace_once(
              p,
              ''' + "'''" + '''            if payload.state == "FEEDBACK_COMPLETE":\\n                start, end, sample_size = _validate_complete_feedback(handoff, payload)\\n                episode = ForwardEvidenceEpisode(\\n''' + "'''" + ''',
          '''
          duration_patch = '''replace_once(
              p,
              "    if end > start and (end - start).total_seconds() < minimum_duration:\\n",
              "    if (\\n        start.tzinfo is not None\\n        and start.utcoffset() is not None\\n        and end.tzinfo is not None\\n        and end.utcoffset() is not None\\n        and end > start\\n        and (end - start).total_seconds() < minimum_duration\\n    ):\\n",
          )
          '''
          if duration_anchor not in text:
              raise SystemExit("round9 hotfix: feedback duration anchor not found")
          text = text.replace(duration_anchor, duration_patch + duration_anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python tools/issue22_round9_patch.py
          # GitHub Actions' token may not update workflow files. Restore CI here;
          # the connector applies that reviewed workflow change separately.
          git checkout -- .github/workflows/ci.yml
          rm tools/issue22_round9_patch.py
          git diff --check
          python -m compileall -q backend/src nautilus_runtime/src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): close codex round9 findings'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
