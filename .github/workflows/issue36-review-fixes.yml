name: Issue 36 API Client Compatibility Fix

on:
  push:
    branches:
      - feat/ios-ipados-universal-app
    paths:
      - '.github/workflows/issue36-review-fixes.yml'

permissions:
  contents: write

jobs:
  restore-query-items:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/ios-ipados-universal-app
      - name: Restore API query-item propagation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ios/QuaZonai/Core/APIClient.swift')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    public func requestJSON(
                  path: String,
                  method: HTTPMethod = .get,
                  body: JSONValue? = nil,
          ''',
                  '''    public func requestJSON(
                  path: String,
                  method: HTTPMethod = .get,
                  queryItems: [URLQueryItem] = [],
                  body: JSONValue? = nil,
          ''',
                  1,
              ),
              (
                  '''        var (data, response) = try await perform(
                  path: path,
                  method: method,
                  body: encoded,
          ''',
                  '''        var (data, response) = try await perform(
                  path: path,
                  method: method,
                  queryItems: queryItems,
                  body: encoded,
          ''',
                  1,
              ),
              (
                  '''            (data, response) = try await perform(
                      path: path,
                      method: method,
                      body: encoded,
          ''',
                  '''            (data, response) = try await perform(
                      path: path,
                      method: method,
                      queryItems: queryItems,
                      body: encoded,
          ''',
                  1,
              ),
              (
                  '''    private func perform(
                  path: String,
                  method: HTTPMethod,
                  body: Data? = nil,
          ''',
                  '''    private func perform(
                  path: String,
                  method: HTTPMethod,
                  queryItems: [URLQueryItem] = [],
                  body: Data? = nil,
          ''',
                  1,
              ),
              (
                  '''        var request = URLRequest(url: try endpoint(path: path))
          ''',
                  '''        var request = URLRequest(url: try endpoint(path: path, queryItems: queryItems))
          ''',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s), found {count}: {old!r}')
              text = text.replace(old, new, expected)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate compatibility restoration
        run: |
          git diff --check
          grep -q 'queryItems: \[URLQueryItem\] = \[\]' ios/QuaZonai/Core/APIClient.swift
          grep -q 'queryItems: queryItems' ios/QuaZonai/Core/APIClient.swift
          python tools/client_parity.py
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'QuaZonai Review Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/QuaZonai/Core/APIClient.swift
          git commit -m 'fix: preserve API query items across retries'
          git push origin HEAD:feat/ios-ipados-universal-app
