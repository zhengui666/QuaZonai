name: Issue 36 API Client Compatibility Fix

on:
  push:
    branches:
      - feat/ios-ipados-universal-app
    paths:
      - '.github/workflows/issue36-review-fixes.yml'

permissions:
  contents: write

jobs:
  restore-query-items:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/ios-ipados-universal-app
      - name: Restore API query-item propagation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ios/QuaZonai/Core/APIClient.swift")
          lines = path.read_text(encoding="utf-8").splitlines()

          request_start = lines.index("    public func requestJSON(")
          request_end = lines.index("    public func authorizedRequest(path: String, queryItems: [URLQueryItem] = []) throws -> URLRequest {")
          request_lines = lines[request_start:request_end]

          method_index = request_start + request_lines.index("        method: HTTPMethod = .get,")
          if lines[method_index + 1] != "        queryItems: [URLQueryItem] = [],":
              lines.insert(method_index + 1, "        queryItems: [URLQueryItem] = [],")
              request_end += 1

          propagated = 0
          index = request_start
          while index < request_end:
              if lines[index].strip() == "method: method,":
                  indentation = lines[index][:-len(lines[index].lstrip())]
                  expected = f"{indentation}queryItems: queryItems,"
                  if lines[index + 1] != expected:
                      lines.insert(index + 1, expected)
                      request_end += 1
                      propagated += 1
                      index += 1
              index += 1
          if propagated != 2:
              raise SystemExit(f"expected to restore two request retry call sites, restored {propagated}")

          perform_start = lines.index("    private func perform(")
          perform_method = lines.index("        method: HTTPMethod,", perform_start)
          if lines[perform_method + 1] != "        queryItems: [URLQueryItem] = [],":
              lines.insert(perform_method + 1, "        queryItems: [URLQueryItem] = [],")

          request_line = "        var request = URLRequest(url: try endpoint(path: path))"
          replacement = "        var request = URLRequest(url: try endpoint(path: path, queryItems: queryItems))"
          request_index = lines.index(request_line, perform_start)
          lines[request_index] = replacement

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Validate compatibility restoration
        run: |
          git diff --check
          test "$(grep -c 'queryItems: queryItems' ios/QuaZonai/Core/APIClient.swift)" -eq 4
          python tools/client_parity.py
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'QuaZonai Review Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/QuaZonai/Core/APIClient.swift
          git commit -m 'fix: preserve API query items across retries'
          git push origin HEAD:feat/ios-ipados-universal-app
