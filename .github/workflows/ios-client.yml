name: iOS Client

on:
  workflow_call:
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'ios/**'
      - 'tools/client_parity.py'
      - 'tools/export_openapi.py'
      - 'tools/generate_ios_assets.py'
      - '.github/workflows/ios-client.yml'
  push:
    branches:
      - main
      - feat/ios-ipados-universal-app
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'ios/**'
      - 'tools/client_parity.py'
      - 'tools/export_openapi.py'
      - 'tools/generate_ios_assets.py'
      - '.github/workflows/ios-client.yml'

permissions:
  contents: read

concurrency:
  group: ios-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: OpenAPI and client parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      QUAZONAI_ALEMBIC_URL: 'sqlite+pysqlite:///:memory:'
      QUAZONAI_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend contract runtime
        run: python -m pip install -e 'backend[dev]'
      - name: Check canonical OpenAPI contract
        run: python tools/export_openapi.py --check
      - name: Validate native authentication and operation IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path('contracts/openapi/quazonai-v1.json').read_text(encoding='utf-8'))
          paths = schema['paths']
          login = paths['/api/v1/auth/mobile/login']['post']
          body = login['requestBody']['content']['application/json']['schema']
          ref = body.get('$ref')
          if ref:
              node = schema
              for part in ref.removeprefix('#/').split('/'):
                  node = node[part]
              body = node
          properties = set(body.get('properties', {}))
          required = set(body.get('required', []))
          assert 'totp_code' in properties and 'totp_code' in required
          assert 'username' not in properties
          assert 'password' not in properties
          assert body.get('additionalProperties') is False

          operation_ids = []
          for path, item in paths.items():
              for method, operation in item.items():
                  if method.lower() not in {'get', 'post', 'put', 'patch', 'delete'}:
                      continue
                  operation_id = operation.get('operationId')
                  assert operation_id, f'missing operationId: {method.upper()} {path}'
                  operation_ids.append(operation_id)
          assert len(operation_ids) == len(set(operation_ids)), 'duplicate operationId'
          schemes = schema['components']['securitySchemes']
          assert {'BrowserSession', 'MobileAccessBearer', 'MobileRefreshBearer', 'MachineBearer'} <= set(schemes)
          assert paths['/api/v1/auth/mobile/refresh']['post']['security'] == [{'MobileRefreshBearer': []}]
          PY
      - name: Cross-client capability gate
        run: python tools/client_parity.py
      - name: Upload canonical wire contracts
        uses: actions/upload-artifact@v4
        with:
          name: quazonai-openapi-${{ github.sha }}
          path: |
            contracts/openapi/quazonai-v1.json
            ios/Packages/QuaZonaiAPI/Sources/QuaZonaiAPI/openapi.yaml
          if-no-files-found: error
          retention-days: 7

  native-build:
    name: Swift build, unit tests and archive
    needs: contracts
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quazonai-openapi-${{ github.sha }}
          path: .
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      - name: Generate release artwork and Xcode project
        run: |
          python3 tools/generate_ios_assets.py
          xcodegen generate --spec ios/project.yml
      - name: Resolve Swift packages
        run: xcodebuild -skipPackagePluginValidation -project ios/QuaZonai.xcodeproj -scheme QuaZonai -resolvePackageDependencies
      - name: Select simulators
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import re
          import subprocess

          payload = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          devices = []
          for runtime, values in payload['devices'].items():
              version = tuple(int(part) for part in re.findall(r'\d+', runtime))
              for device in values:
                  if device.get('isAvailable'):
                      devices.append((version, device['name'], device['udid']))
          for family, prefix in [('IPHONE', 'iPhone'), ('IPAD', 'iPad')]:
              matches = sorted(item for item in devices if item[1].startswith(prefix))
              if not matches:
                  raise SystemExit(f'No available {prefix} simulator')
              print(f'{family}_UDID={matches[-1][2]}')
          PY
      - name: Swift unit tests on iPhone
        run: |
          set -o pipefail
          xcodebuild test \
            -skipPackagePluginValidation \
            -project ios/QuaZonai.xcodeproj \
            -scheme QuaZonai \
            -destination "platform=iOS Simulator,id=${IPHONE_UDID}" \
            -only-testing:QuaZonaiTests \
            -resultBundlePath "${RUNNER_TEMP}/QuaZonai-unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Compile iPad application
        run: |
          xcodebuild build \
            -skipPackagePluginValidation \
            -project ios/QuaZonai.xcodeproj \
            -scheme QuaZonai \
            -destination "platform=iOS Simulator,id=${IPAD_UDID}" \
            CODE_SIGNING_ALLOWED=NO
      - name: Release archive without signing
        run: |
          xcodebuild archive \
            -skipPackagePluginValidation \
            -project ios/QuaZonai.xcodeproj \
            -scheme QuaZonai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/QuaZonai.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          test -f "${RUNNER_TEMP}/QuaZonai.xcarchive/Info.plist"
          test -f "${RUNNER_TEMP}/QuaZonai.xcarchive/Products/Applications/QuaZonai.app/PrivacyInfo.xcprivacy"
          ditto -c -k --sequesterRsrc --keepParent "${RUNNER_TEMP}/QuaZonai.xcarchive" "${RUNNER_TEMP}/QuaZonai.xcarchive.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: quazonai-ios-archive-${{ github.sha }}
          path: ${{ runner.temp }}/QuaZonai.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quazonai-ios-build-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  native-ui:
    name: ${{ matrix.label }} Operator E2E
    needs: contracts
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            prefix: iPhone
            label: iPhone
          - family: iPad
            prefix: iPad
            label: iPad
    env:
      QUAZONAI_ENV: test
      QUAZONAI_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      QUAZONAI_UI_SERVER: 'http://127.0.0.1:8000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quazonai-openapi-${{ github.sha }}
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure SQLite test instance
        run: |
          echo "QUAZONAI_DATABASE_URL=sqlite+pysqlite:///${RUNNER_TEMP}/quazonai-ios.db" >> "$GITHUB_ENV"
          echo "QUAZONAI_ALEMBIC_URL=sqlite+pysqlite:///${RUNNER_TEMP}/quazonai-ios.db" >> "$GITHUB_ENV"
          echo "QUAZONAI_PACKAGE_ROOT=${RUNNER_TEMP}/quazonai-packages" >> "$GITHUB_ENV"
          echo "QUAZONAI_MISSION_ROOT=${RUNNER_TEMP}/quazonai-missions" >> "$GITHUB_ENV"
          echo "CODEX_HOME=${RUNNER_TEMP}/codex-home" >> "$GITHUB_ENV"
      - name: Install backend and seed real API
        run: |
          python -m pip install -e backend
          python - <<'PY'
          from db.models import Base
          from db.session import create_database_engine
          from settings import Settings
          Base.metadata.create_all(create_database_engine(Settings.from_env()))
          PY
          python backend/tests/frontend_e2e_seed.py
          nohup uvicorn main:create_app --factory --no-proxy-headers --host 127.0.0.1 --port 8000 >"${RUNNER_TEMP}/quazonai-ios-api.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/quazonai-ios-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = 60 ]; then
              cat "${RUNNER_TEMP}/quazonai-ios-api.log"
              exit 1
            fi
            sleep 1
          done
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          python3 tools/generate_ios_assets.py
          xcodegen generate --spec ios/project.yml
      - name: Select ${{ matrix.family }} simulator
        run: |
          DEVICE_UDID=$(python3 - <<'PY'
          import json
          import re
          import subprocess
          payload = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          prefix = '${{ matrix.prefix }}'
          matches = []
          for runtime, devices in payload['devices'].items():
              version = tuple(int(part) for part in re.findall(r'\d+', runtime))
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith(prefix):
                      matches.append((version, device['name'], device['udid']))
          if not matches:
              raise SystemExit(f'No available {prefix} simulator')
          print(sorted(matches)[-1][2])
          PY
          )
          echo "DEVICE_UDID=${DEVICE_UDID}" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.family }} UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -skipPackagePluginValidation \
            -project ios/QuaZonai.xcodeproj \
            -scheme QuaZonai \
            -destination "platform=iOS Simulator,id=${DEVICE_UDID}" \
            -only-testing:QuaZonaiUITests \
            -resultBundlePath "${RUNNER_TEMP}/QuaZonai-${{ matrix.label }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quazonai-${{ matrix.label }}-ui-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/QuaZonai-${{ matrix.label }}.xcresult
            ${{ runner.temp }}/quazonai-ios-api.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/quazonai-ios-api.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/quazonai-ios-api.pid")" || true
          fi
