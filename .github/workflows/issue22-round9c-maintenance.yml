name: Issue 22 round9c maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round9c_patch.py
      - .github/workflows/issue22-round9c-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Apply patch
        run: |
          python tools/issue22_round9c_patch.py
          rm tools/issue22_round9c_patch.py .github/workflows/issue22-round9c-maintenance.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): mount isolated gateway package root'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
