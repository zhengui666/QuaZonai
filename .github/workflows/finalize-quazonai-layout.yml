name: Finalize QuaZonai layout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Remove remaining legacy namespace and abbreviation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old = root / 'backend/src/mcp'
          new = root / 'backend/src/mcp_gateway'
          if old.is_dir() and not new.exists(): old.rename(new)

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.name == 'finalize-quazonai-layout.yml': continue
              try: text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError): continue
              updated = text
              updated = updated.replace('from mcp.auth import ', 'from mcp_gateway.auth import ')
              updated = updated.replace('from mcp.client import ', 'from mcp_gateway.client import ')
              updated = updated.replace('from mcp.config import ', 'from mcp_gateway.config import ')
              updated = updated.replace('from mcp.policy import ', 'from mcp_gateway.policy import ')
              updated = updated.replace('from mcp.server import create_server', 'from mcp_gateway.server import create_server')
              updated = updated.replace('from mcp.main import ', 'from mcp_gateway.main import ')
              updated = updated.replace('backend/src/mcp/', 'backend/src/mcp_gateway/')
              updated = updated.replace('"mcp.main:main"', '"mcp_gateway.main:main"')
              updated = re.sub(r'\bQF\b', 'QZ', updated)
              updated = re.sub(r'\bqf\b', 'quazonai', updated)
              updated = updated.replace('codex/quazonai-nautilus-redesign', 'main')
              updated = updated.replace('codex/quazonai-production-closure', 'main')
              if updated != text: path.write_text(updated, encoding='utf-8')
          PY

          test ! -e backend/src/mcp
          test -d backend/src/mcp_gateway
          if git grep -n -E '\bQF\b|\bqf\b|[Qq]uant[Ff]oundry' -- ':!.github/workflows/finalize-quazonai-layout.yml' ':!.github/workflows/ci.yml'; then exit 1; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/finalize-quazonai-layout.yml' ':!.github/workflows/ci.yml'
          git commit -m "refactor: remove remaining legacy QuaZonai abbreviations"
          git push origin HEAD:main
