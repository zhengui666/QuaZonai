name: Issue 22 round5 maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round5_patch.py
      - .github/workflows/issue22-round5-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply transparent reviewed patch
        run: |
          python tools/issue22_round5_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path("nautilus_runtime/tests/test_gateway_api.py")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): close codex round5 findings"
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
