name: Prepare exact numeric repairs (development only)

on:
  pull_request:
    paths:
      - '.github/workflows/repair-precise-evidence.yml'
      - 'tools/repair_precise_evidence.mjs'

permissions:
  contents: read

concurrency:
  group: exact-numeric-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply fixed executor-authored repairs, not generated model code
        run: |
          set -euo pipefail
          node tools/repair_precise_evidence.mjs
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
      - name: Test the prepared source using the committed dependency lock
        run: |
          set -euo pipefail
          mkdir -p /tmp/exact-numeric-evidence
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee /tmp/exact-numeric-evidence/clippy.log
          cargo +1.98.0 test --locked --workspace 2>&1 | tee /tmp/exact-numeric-evidence/tests.log
          cargo +1.98.0 run --locked --quiet -p contracts --example generate > /tmp/exact-numeric-evidence/schema.json
          cp /tmp/exact-numeric-evidence/schema.json contracts/generated/domain-v1.openapi.json
          cargo +1.98.0 fmt --all -- --check
          git diff --check
          git diff --binary > /tmp/exact-numeric-evidence/source.patch
          git rev-parse HEAD > /tmp/exact-numeric-evidence/base.txt
          printf 'Prepared-source tests only; not full Issue62 acceptance.\n' > /tmp/exact-numeric-evidence/SCOPE.txt
      - name: Preserve actual test output and safe generated data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-numeric-repair-${{ github.run_id }}
          path: /tmp/exact-numeric-evidence/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      BASE: ${{ github.event.pull_request.head.sha }}
      BRANCH: rewrite/issue-62-rust-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve same-run generated data without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/exact-numeric-inputs
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "exact-numeric-repair-$GITHUB_RUN_ID" --dir /tmp/exact-numeric-inputs
          test "$(cat /tmp/exact-numeric-inputs/base.txt)" = "$BASE"
      - name: Reproduce the fixed transformation with no application execution
        run: |
          set -euo pipefail
          node tools/repair_precise_evidence.mjs
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup run 1.98.0 rustfmt --edition 2021 crates/contracts/src/scalars.rs crates/contracts/src/budget.rs crates/contracts/src/runs.rs crates/domain/src/evidence.rs crates/contracts/tests/exact_numeric_contract.rs crates/domain/tests/exact_thresholds.rs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='/tmp/exact-numeric-inputs/schema.json';
          assert(fs.statSync(path).size < 2_000_000);
          const document=JSON.parse(fs.readFileSync(path,'utf8'));
          assert.equal(document.openapi,'3.1.0');
          assert(document.components?.schemas?.BudgetV1);
          fs.copyFileSync(path,'contracts/generated/domain-v1.openapi.json');
          JS
          git diff --check
          git diff --binary > /tmp/reproduced.patch
          cmp /tmp/exact-numeric-inputs/source.patch /tmp/reproduced.patch
          # No source from the build artifact is applied: the fixed transformation
          # is independently reproduced. Only generated JSON is accepted as data.
          git rm -- tools/repair_precise_evidence.mjs .github/workflows/repair-precise-evidence.yml
          git add -- crates/contracts/src/scalars.rs crates/contracts/src/budget.rs crates/contracts/src/runs.rs crates/domain/src/evidence.rs crates/contracts/tests/exact_numeric_contract.rs crates/domain/tests/exact_thresholds.rs contracts/generated/domain-v1.openapi.json DESIGN.md docs/architecture/issue-62-execution.md .github/workflows/ci.yml
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(evidence): compare frozen thresholds exactly and publish bounded wire contracts' -m 'Preserve exact decimal policy bounds, add all integer representation maxima and regression tests. Define durable native turn reservations and exact release/approval relationships in DESIGN without claiming Store implementation. Remove one-time preparation tooling. The new Head still requires independent CI and review; this is not full product acceptance.'
      - name: Fast-forward only the authorized PR branch and request read-only CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          test "$current" = "$BASE"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          unset auth
          committed="$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$committed"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f "ref=$BRANCH"
          printf 'Published verified source commit: %s\n' "$committed"
