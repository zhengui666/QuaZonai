name: Issue 22 maintenance patch

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - name: Snapshot source before maintenance
        uses: actions/upload-artifact@v4
        with:
          name: issue22-source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch when present
        run: |
          if [ ! -f tools/issue22_patch.py ]; then
            echo "No maintenance patch present."
            exit 0
          fi
          python tools/issue22_patch.py
          rm -f tools/issue22_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): close latest issue 22 review findings"
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
