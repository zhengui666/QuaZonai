name: Issue 37 Codex Review Fixes

on:
  pull_request:
    paths:
      - '.github/scripts/issue37_fix_codex_review.py'
      - '.github/workflows/issue37-fix-codex-review.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply Codex review fixes
        run: python .github/scripts/issue37_fix_codex_review.py
      - name: Remove one-shot fixer
        run: rm .github/scripts/issue37_fix_codex_review.py .github/workflows/issue37-fix-codex-review.yml
      - name: Commit fixes
        run: |
          git config user.name 'QuaZonai CI Finalizer'
          git config user.email 'quazonai-ci@localhost'
          git add -A
          git commit -m 'fix(auth): preserve Compose legacy guard and TOTP-only design'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
