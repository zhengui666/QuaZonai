name: Temporary exact lifecycle source transport
on:
  pull_request:
    paths: ['.github/workflows/transfer-lifecycle-source.yml']
permissions:
  contents: write
jobs:
  transfer:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      VERIFIED_BASE: a41e8709576d344919ffbe121b2619932793fe0d
      BASE_TREE: bd2c8a7ef266c846d9d5ddadbfb0fc7c1441112e
      VERIFIED_TREE: d4fa98522706d8208be821191c191062b92ade9b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Transfer source only without executing product code or updating refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$VERIFIED_BASE"
          test "$(git diff --name-only "$VERIFIED_BASE" HEAD)" = '.github/workflows/transfer-lifecycle-source.yml'
          : > "$RUNNER_TEMP/lifecycle.patch.xz"
          for blob in 48e6be1755e6e323f830aaa4c286cc849deef2b4 90b2af30505c5274b5444c222aa7059c5ede850a b4ece8e5f0d760984b6e8aacdf5811e66e732545 68715107c2e2df99fcb830bb6bf48953084487e7; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> "$RUNNER_TEMP/lifecycle.patch.xz"
          done
          test "$(wc -c < "$RUNNER_TEMP/lifecycle.patch.xz")" -eq 34820
          test "$(git hash-object "$RUNNER_TEMP/lifecycle.patch.xz")" = ca2d9571beebbf0f6d6ab80855367b7425c4ad42
          xz --decompress --stdout "$RUNNER_TEMP/lifecycle.patch.xz" > "$RUNNER_TEMP/lifecycle.patch"
          test "$(wc -c < "$RUNNER_TEMP/lifecycle.patch")" -eq 179152
          git -c core.hooksPath=/dev/null checkout --detach "$VERIFIED_BASE"
          git -c core.hooksPath=/dev/null apply --check --index "$RUNNER_TEMP/lifecycle.patch"
          git -c core.hooksPath=/dev/null apply --index "$RUNNER_TEMP/lifecycle.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$VERIFIED_TREE"
          test ! -e .github/workflows/transfer-lifecycle-source.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 - <<'PY'
          import base64, json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args])
          def post(endpoint, value):
              return json.loads(subprocess.check_output(['gh','api','--method','POST',endpoint,'--input','-'], input=json.dumps(value).encode()))
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'zhengui666/QuaZonai':
              raise SystemExit('unexpected repository')
          entries=[]
          for raw in filter(None, git('diff','--cached','--name-only','--no-renames','-z').split(b'\0')):
              path=raw.decode()
              line=git('ls-files','--stage','--',path).decode().strip()
              if not line:
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              meta, actual=line.split('\t',1)
              mode, sha, stage=meta.split()
              if stage!='0' or mode not in ('100644','100755') or actual!=path:
                  raise SystemExit('invalid staged entry')
              result=post(f'repos/{repo}/git/blobs',{'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})
              if result['sha']!=sha:
                  raise SystemExit('blob identity mismatch')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          if len(entries)!=23:
              raise SystemExit('unexpected change count')
          tree=post(f'repos/{repo}/git/trees',{'base_tree':os.environ['BASE_TREE'],'tree':entries})
          if tree['sha']!=os.environ['VERIFIED_TREE']:
              raise SystemExit('tree identity mismatch')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"Uploaded exact native Git tree `{tree['sha']}`. No product code executed, no commit/ref changed. Source transfer only, not CI or product acceptance.\n")
          PY
