name: One-shot operator auth contract hardening

on:
  push:
    branches:
      - feat/operator-totp-auth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-totp-auth
          fetch-depth: 0

      - name: Patch governed authentication contract
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "DESIGN.md",
              "- 密码、TOTP setup secret、cookie key 与 API token 都是启动级 secret；Web/API 不回读、不写事件、不写日志；",
              "- 密码、TOTP setup secret、cookie key 与 API token 都是启动级 secret；Web/API 不回读、不写事件、不写日志；\n"
              "- `QUAZONAI_AUTH_COOKIE_KEY` 必须与 `QUAZONAI_MASTER_KEY` 使用不同的随机 32-byte key material；两者解码结果相同即启动失败，不能用用途不同代替密钥分离；\n"
              "- `QUAZONAI_API_TOKEN` 必须可直接序列化为 RFC 6750 Bearer `b64token`：长度 32–4096，只允许 ASCII 字母、数字、`-._~+/` 与末尾可选 `=`；空白、CR/LF、控制字符、非 ASCII 或其他字符必须在启动时拒绝；",
          )
          replace_once(
              "DESIGN.md",
              "- browser cookie 认证的 unsafe request 必须与 `QUAZONAI_AUTH_PUBLIC_ORIGIN` 做精确同源校验；启用认证的 production origin 必须使用 HTTPS；`SameSite=Strict` 不是唯一 CSRF 控制；",
              "- `QUAZONAI_AUTH_PUBLIC_ORIGIN` 必须解析并保存为 canonical browser origin：scheme/host 小写，Unicode hostname 转为小写 IDNA ASCII，IPv6 使用压缩后的 bracketed literal，HTTP `:80` / HTTPS `:443` 默认端口省略，非默认端口保留；credential、非根 path、params、query、fragment、非法 host 或非法 port 必须拒绝；\n"
              "- browser cookie 认证的 unsafe request 必须把请求 `Origin` 用同一 canonicalizer 解析后再与配置 origin 做恒定时间精确比较；等价浏览器序列化（例如 `https://EXAMPLE.com:443` 与 `https://example.com`）必须匹配，不同 scheme/host/effective port 必须拒绝；启用认证的 production origin 必须使用 HTTPS；`SameSite=Strict` 不是唯一 CSRF 控制；",
          )
          replace_once(
              "DESIGN.md",
              "Provider/Data/Handoff secret 使用既有 AES-256-GCM + externally injected master key 边界；Operator browser cookie 使用独立 externally injected `QUAZONAI_AUTH_COOKIE_KEY`，不能复用 browser credential 作为业务 secret。API 永不回读 plaintext/ciphertext/nonce。Operator password/TOTP setup secret/API token/cookie key 不得进入前端 bundle、事件、日志、Codex Mission shell 或持久数据库。",
              "Provider/Data/Handoff secret 使用既有 AES-256-GCM + externally injected master key 边界；Operator browser cookie 使用 independently generated、externally injected `QUAZONAI_AUTH_COOKIE_KEY`。该 key 解码后不得与 `QUAZONAI_MASTER_KEY` 相同，不能复用 browser credential 作为业务 secret。API 永不回读 plaintext/ciphertext/nonce。Operator password/TOTP setup secret/API token/cookie key 不得进入前端 bundle、事件、日志、Codex Mission shell 或持久数据库。",
          )
          replace_once(
              "DESIGN.md",
              "- [ ] cookie-authenticated unsafe request 的 Origin 不匹配时被拒绝；",
              "- [ ] configured/browser Origin 经同一 canonical browser-origin 规则归一化，默认端口、大小写、IDNA 与 IPv6 等价表示可以匹配，不同 effective origin 被拒绝；\n"
              "- [ ] `QUAZONAI_AUTH_COOKIE_KEY` 与有效 `QUAZONAI_MASTER_KEY` 解码值相同时启动失败；\n"
              "- [ ] `QUAZONAI_API_TOKEN` 只接受 32–4096 字符 RFC 6750 `b64token`，空白、控制字符、非 ASCII 与非法字符在启动时被拒绝；\n"
              "- [ ] cookie-authenticated unsafe request 的 Origin 不匹配时被拒绝；",
          )
          replace_once(
              "DESIGN.md",
              "Built-in Codex **不通过 CLI 作为 RPC**，而通过 mission-scoped stdio MCP Tool Server。",
              "`QUAZONAI_API_TOKEN` 必须符合可直接写入 HTTP Authorization header 的 RFC 6750 `b64token` 语法；CLI 不对非法 token 做转义或降级。\n\nBuilt-in Codex **不通过 CLI 作为 RPC**，而通过 mission-scoped stdio MCP Tool Server。",
          )

          replace_once(
              "OPERATIONS.md",
              "TOTP setup key 来自 `.env` 的 `QUAZONAI_AUTH_TOTP_SECRET`。在 Google Authenticator 中选择 **Enter a setup key**，使用该值并选择 **Time based**。TOTP secret、Operator password、cookie key 和 machine API token 都属于启动级 secret，不能放进聊天、截图、事件或日志。",
              "TOTP setup key 来自 `.env` 的 `QUAZONAI_AUTH_TOTP_SECRET`。在 Google Authenticator 中选择 **Enter a setup key**，使用该值并选择 **Time based**。TOTP secret、Operator password、cookie key 和 machine API token 都属于启动级 secret，不能放进聊天、截图、事件或日志。`QUAZONAI_AUTH_COOKIE_KEY` 必须独立生成且不能与 `QUAZONAI_MASTER_KEY` 相同；`QUAZONAI_API_TOKEN` 必须使用 RFC 6750 `b64token` 可安全写入 Authorization header 的 ASCII 字符集。",
          )
          replace_once(
              "OPERATIONS.md",
              "认证启用时，`QUAZONAI_AUTH_PUBLIC_ORIGIN` 必须与浏览器实际 Origin 精确一致；production 必须为 HTTPS，反向代理/Tunnel 应在可信 TLS 层终止 HTTPS，并把该外部 Origin 写入 `.env`。",
              "认证启用时，`QUAZONAI_AUTH_PUBLIC_ORIGIN` 与浏览器 `Origin` 都按 browser-origin 规则 canonicalize 后精确比较：scheme/host 小写、Unicode host 使用 IDNA ASCII、IPv6 压缩并保留 brackets、默认端口省略、非默认端口保留。production 必须为 HTTPS，反向代理/Tunnel 应在可信 TLS 层终止 HTTPS，并把该外部 Origin 写入 `.env`。",
          )
          replace_once(
              "OPERATIONS.md",
              "Operator Authentication 启用时，CLI/automation 不使用 Web cookie、密码或 TOTP，而是从环境读取 `QUAZONAI_API_TOKEN`；认证关闭时不要求该 token。Downstream consumer 的 Bearer service token 仍独立，只能操作其自身 Handoff/Feedback 合同。",
              "Operator Authentication 启用时，CLI/automation 不使用 Web cookie、密码或 TOTP，而是从环境读取符合 RFC 6750 `b64token` 语法的 `QUAZONAI_API_TOKEN`；认证关闭时不要求该 token。Downstream consumer 的 Bearer service token 仍独立，只能操作其自身 Handoff/Feedback 合同。",
          )

          replace_once(
              "README.md",
              "PY\n```\n\nCopy the generated values into `.env`, then configure the complete authentication group:",
              "PY\n```\n\nGenerate `QUAZONAI_AUTH_COOKIE_KEY` independently from `QUAZONAI_MASTER_KEY`; QuaZonai rejects equal decoded 32-byte values. The generated `secrets.token_urlsafe(32)` machine token satisfies the accepted RFC 6750 Bearer `b64token` grammar. Do not add spaces, quotes, line breaks, or other characters to the value.\n\nCopy the generated values into `.env`, then configure the complete authentication group:",
          )
          replace_once(
              "README.md",
              "`QUAZONAI_AUTH_PUBLIC_ORIGIN` must exactly match the browser origin, including scheme and non-default port. HTTPS origins automatically receive `Secure` browser cookies. When authentication is enabled in `production`, the origin must use HTTPS. A remotely exposed installation should normally set the externally trusted TLS origin, for example `https://quazonai.example.com`.",
              "`QUAZONAI_AUTH_PUBLIC_ORIGIN` is canonicalized with browser-origin semantics before comparison: scheme/host are lower-cased, Unicode hosts use IDNA ASCII, IPv6 is compressed/bracketed, default `:80`/`:443` ports are omitted, and non-default ports are retained. HTTPS origins automatically receive `Secure` browser cookies. When authentication is enabled in `production`, the origin must use HTTPS. A remotely exposed installation should normally set the externally trusted TLS origin, for example `https://quazonai.example.com`.",
          )
          replace_once(
              "README.md",
              "When Operator authentication is enabled, the CLI automatically sends `QUAZONAI_API_TOKEN` as its Bearer machine credential. It never reads the browser cookie, Operator password, or TOTP setup secret. The CLI remains loopback-only by design.",
              "When Operator authentication is enabled, the CLI automatically sends `QUAZONAI_API_TOKEN` as its Bearer machine credential. The token must be 32–4096 RFC 6750 `b64token` ASCII characters; whitespace, CR/LF, control characters, non-ASCII, and other punctuation are rejected at API startup. The CLI never reads the browser cookie, Operator password, or TOTP setup secret and remains loopback-only by design.",
          )

          replace_once(
              ".env.example",
              "# compatible with Google Authenticator. Production automatically uses Secure cookies.",
              "# compatible with Google Authenticator. COOKIE_KEY must differ from MASTER_KEY;\n# API_TOKEN must be a 32..4096-character RFC 6750 b64token. Browser origins\n# are canonicalized; enabled production authentication requires HTTPS/Secure cookies.",
          )

          replace_once(
              "CLI.md",
              "`QUAZONAI_API_TOKEN` 是本地 automation credential，不是网页登录 token。轮换该值后需要同步更新调用 CLI 的 shell/secret manager；不需要重新配置 Google Authenticator。",
              "`QUAZONAI_API_TOKEN` 是本地 automation credential，不是网页登录 token。它必须是 32–4096 字符 RFC 6750 `b64token`；CLI 不转义空白、CR/LF、控制字符、非 ASCII 或其他非法 header 字符。轮换该值后需要同步更新调用 CLI 的 shell/secret manager；不需要重新配置 Google Authenticator。",
          )

          replace_once(
              "skills/quazonai/references/cli-reference.md",
              "Do not put the token in the endpoint URL, command arguments, shell history, output, or documentation. Do not use the Operator password, TOTP setup secret, browser session cookie, or trusted-browser cookie from the CLI.",
              "The token must be 32–4096 RFC 6750 `b64token` ASCII characters; whitespace, CR/LF, control characters, non-ASCII, and other punctuation are invalid. Do not put the token in the endpoint URL, command arguments, shell history, output, or documentation. Do not use the Operator password, TOTP setup secret, browser session cookie, or trusted-browser cookie from the CLI.",
          )

          workflow = ROOT / ".github/workflows/one-shot-auth-contract-hardening.yml"
          workflow.unlink()
          PY

      - name: Verify contract markers
        run: |
          grep -Fq 'canonical browser origin' DESIGN.md
          grep -Fq 'RFC 6750 `b64token`' DESIGN.md
          grep -Fq '不得与 `QUAZONAI_MASTER_KEY` 相同' DESIGN.md
          test ! -e .github/workflows/one-shot-auth-contract-hardening.yml

      - name: Commit governed documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(auth): harden origin and secret contracts'
          git push origin HEAD:feat/operator-totp-auth
