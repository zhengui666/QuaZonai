name: Client Parity

on:
  pull_request:
    paths:
      - 'backend/src/api/**'
      - 'backend/src/main.py'
      - 'frontend/src/**'
      - 'contracts/**'
      - 'ios/**'
      - 'tools/client_parity.py'
      - 'tools/export_openapi.py'
      - '.github/workflows/client-parity.yml'
  push:
    branches:
      - main
      - feat/ios-ipados-universal-app
    paths:
      - 'backend/src/api/**'
      - 'backend/src/main.py'
      - 'frontend/src/**'
      - 'contracts/**'
      - 'ios/**'
      - 'tools/client_parity.py'
      - 'tools/export_openapi.py'
      - '.github/workflows/client-parity.yml'

permissions:
  contents: read

concurrency:
  group: client-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      QUAZONAI_ALEMBIC_URL: 'sqlite+pysqlite:///:memory:'
      QUAZONAI_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install contract runtime
        run: python -m pip install -e 'backend[dev]'
      - name: Reject OpenAPI drift
        run: python tools/export_openapi.py --check
      - name: Enforce Web iPhone iPad capability parity
        run: python tools/client_parity.py
      - name: Enforce TOTP-only mobile login schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('contracts/openapi/quazonai-v1.json').read_text(encoding='utf-8'))
          login = schema['paths']['/api/v1/auth/mobile/login']['post']
          body = login['requestBody']['content']['application/json']['schema']
          if '$ref' in body:
              node = schema
              for part in body['$ref'].removeprefix('#/').split('/'):
                  node = node[part]
              body = node
          props = set(body['properties'])
          assert 'totp_code' in props
          assert 'username' not in props
          assert 'password' not in props
          PY
