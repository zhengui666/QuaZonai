name: Finalize issue 22 branch v2

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - .github/workflows/finalize-issue22-v2.yml

permissions:
  contents: write

concurrency:
  group: issue-22-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-22-remote-nautilus-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Wait for earlier finalizer and refresh head
        run: |
          sleep 45
          git fetch origin feat/issue-22-remote-nautilus-runtime
          git reset --hard origin/feat/issue-22-remote-nautilus-runtime
      - name: Complete migration and format
        run: |
          if test -f .github/scripts/repair_issue22.py; then
            python .github/scripts/repair_issue22.py
          elif test -f .github/scripts/apply_issue22.py; then
            python .github/scripts/apply_issue22.py
          fi
          python -m pip install --disable-pip-version-check ruff
          ruff format backend/src backend/tests nautilus_runtime tools/check_quant_runtime_boundary.py
          ruff check --fix backend/src/quant_runtime backend/src/candidate_bundles.py backend/src/candidate_packages.py backend/src/runners/sealed_evaluation.py backend/tests/unit/test_quant_runtime_client.py backend/tests/unit/test_candidate_bundles.py nautilus_runtime tools/check_quant_runtime_boundary.py
          python -m compileall -q backend/src nautilus_runtime/src
          python tools/check_quant_runtime_boundary.py
      - name: Squash and push the latest serialized state
        run: |
          rm -f .github/ISSUE22_PR_READY
          rm -f .github/workflows/apply-issue22.yml
          rm -f .github/workflows/repair-issue22.yml
          rm -f .github/workflows/finalize-issue22.yml
          rm -f .github/workflows/finalize-issue22-v2.yml
          rm -f .github/workflows/export-source.yml
          rm -f .github/scripts/apply_issue22.py
          rm -f .github/scripts/repair_issue22.py
          git config user.name "QuaZonai Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset --soft origin/main
          git add -A
          git commit -m "feat(runtime): adopt remote Nautilus-first architecture"
          git push --force origin HEAD:feat/issue-22-remote-nautilus-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate real pinned Nautilus integration
        run: |
          python -m pip install --disable-pip-version-check -e 'nautilus_runtime[dev]'
          pytest -q nautilus_runtime/tests
