name: Publish tested Store source (one-time development)
on:
  pull_request:
    paths: ['.github/workflows/publish-store.yml']
permissions:
  contents: read
concurrency:
  group: publish-store-63
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == 'zhengui666/QuaZonai' && github.head_ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Import and publish exact executor-tested Git tree, without executing its code
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: b39771c41f0300438023be5a2f9330c4d9db9d86
          TESTED_TREE: b69bf219bcc101fe9489399188017e9b401807d3
          BRANCH: rewrite/issue-62-rust-evidence
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config gc.auto 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(gh api repos/zhengui666/QuaZonai/git/ref/heads/$BRANCH --jq '.object.sha')" = "$EXPECTED_HEAD"
          mkdir -p /tmp/store-publish
          : > /tmp/store-publish/source.pack
          while read -r object; do
            test -n "$object"
            gh api "repos/zhengui666/QuaZonai/git/blobs/$object" --jq '.content' | base64 --decode >> /tmp/store-publish/source.pack
          done <<'OBJECTS'
          56d3be510aad51ba41403a936c1ae9d2a4c6327a
