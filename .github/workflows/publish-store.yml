          OBJECTS
          test "$(wc -c < /tmp/store-publish/source.pack)" = 58595
          git index-pack --stdin --fix-thin --strict < /tmp/store-publish/source.pack
          test "$(git cat-file -t "$TESTED_TREE")" = tree
          test "$(git rev-parse c702eb7dc8562af1337d2567198a4b842cf7e950^{tree})" = "$TESTED_TREE"
          test "$(git rev-parse c702eb7dc8562af1337d2567198a4b842cf7e950^)" = "$EXPECTED_BASE"
          # Only native Git processes source objects. No cargo/npm/build scripts,
          # application imports, tests, repository hooks or production secrets.
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n\n%s\n' 'feat(store): persist fenced model turns with native PostgreSQL and PGMQ' 'Publish the exact executor-tested source tree. Includes real relational/concurrency/terminal-receipt tests and immutable per-turn resource accounting. The temporary publisher disappears in this tree. Full system acceptance is not claimed; validate this new Head independently in read-only CI.' | git commit-tree "$TESTED_TREE" -p "$EXPECTED_HEAD")
          test "$(gh api repos/zhengui666/QuaZonai/git/ref/heads/$BRANCH --jq '.object.sha')" = "$EXPECTED_HEAD"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin "$commit:refs/heads/$BRANCH"
          unset auth GH_TOKEN
          printf 'Published source commit: `%s`\nTested tree: `%s`\n\nThis is publication, not final CI/review/product acceptance.\n' "$commit" "$TESTED_TREE" >> "$GITHUB_STEP_SUMMARY"
