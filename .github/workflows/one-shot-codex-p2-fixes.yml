name: One-shot Codex P2 fixes

on:
  push:
    branches:
      - feat/operator-totp-auth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-totp-auth
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Apply focused authentication fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('backend/src/settings.py')
          text = settings.read_text(encoding='utf-8')
          old = 'import pyotp\n'
          new = 'import idna\nimport pyotp\n'
          if text.count(old) != 1:
              raise SystemExit(f'settings import marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = 'ascii_hostname = hostname.encode("idna").decode("ascii").lower()\n    except UnicodeError as exc:'
          new = 'ascii_hostname = idna.encode(hostname, uts46=True, std3_rules=True).decode("ascii").lower()\n    except idna.IDNAError as exc:'
          if text.count(old) != 1:
              raise SystemExit(f'settings IDNA marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          settings.write_text(text, encoding='utf-8')

          operator_auth = Path('backend/src/operator_auth.py')
          text = operator_auth.read_text(encoding='utf-8')
          marker = '''def _cookie_aad(kind: str) -> bytes:\n    return f"quazonai|operator-auth|cookie={kind}|version={COOKIE_VERSION}".encode("utf-8")\n\n\n'''
          helper = marker + '''def _constant_time_text_equal(left: str, right: str) -> bool:\n    """Compare arbitrary Unicode credentials without str-only compare_digest limits."""\n    return secrets.compare_digest(left.encode("utf-8"), right.encode("utf-8"))\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'operator_auth helper marker count={text.count(marker)}')
          text = text.replace(marker, helper, 1)
          old = '''if settings.operator_username is None or not secrets.compare_digest(\n            username, settings.operator_username\n        ):'''
          new = '''if settings.operator_username is None or not _constant_time_text_equal(\n            username, settings.operator_username\n        ):'''
          if text.count(old) != 1:
              raise SystemExit(f'cookie username compare marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    username_valid = secrets.compare_digest(username, settings.operator_username)\n    password_valid = secrets.compare_digest(password, settings.operator_password)'''
          new = '''    username_valid = _constant_time_text_equal(username, settings.operator_username)\n    password_valid = _constant_time_text_equal(password, settings.operator_password)'''
          if text.count(old) != 1:
              raise SystemExit(f'login compare marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          operator_auth.write_text(text, encoding='utf-8')

          pyproject = Path('backend/pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          old = '  "httpx>=0.28,<1",\n'
          new = old + '  "idna>=3.10,<4",\n'
          if text.count(old) != 1:
              raise SystemExit(f'pyproject httpx marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          pyproject.write_text(text, encoding='utf-8')

          origin_test = Path('backend/tests/integration/test_operator_origin_canonicalization.py')
          text = origin_test.read_text(encoding='utf-8')
          old = '        ("https://bücher.example:443", "https://xn--bcher-kva.example"),\n'
          new = old + '        ("https://faß.de", "https://xn--fa-hia.de"),\n'
          if text.count(old) != 1:
              raise SystemExit(f'origin test marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          origin_test.write_text(text, encoding='utf-8')

          unicode_test = Path('backend/tests/integration/test_operator_auth_unicode.py')
          unicode_test.write_text('''from __future__ import annotations\n\nimport base64\nfrom dataclasses import replace\n\nimport pyotp\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import Engine\n\nfrom main import create_app\nfrom operator_auth import SESSION_COOKIE_NAME, TRUSTED_BROWSER_COOKIE_NAME\nfrom settings import Settings\n\n\ndef test_unicode_operator_credentials_login_and_trusted_restore(\n    settings: Settings,\n    engine: Engine,\n) -> None:\n    username = "操作员"\n    password = "正确马电池订书钉-安全密码"\n    secured = replace(\n        settings,\n        operator_auth_enabled=True,\n        operator_username=username,\n        operator_password=password,\n        operator_totp_secret=pyotp.random_base32(),\n        auth_cookie_key=base64.b64encode(b"a" * 32).decode("ascii"),\n        api_token="machine-token-" + "x" * 32,\n        auth_public_origin="http://testserver",\n    )\n    secured.validate_operator_auth()\n    assert secured.operator_totp_secret is not None\n\n    client = TestClient(create_app(settings=secured, engine=engine))\n    response = client.post(\n        "/api/v1/auth/login",\n        headers={"Origin": "http://testserver"},\n        json={\n            "username": username,\n            "password": password,\n            "totp_code": pyotp.TOTP(secured.operator_totp_secret).now(),\n            "trust_browser": True,\n        },\n    )\n\n    assert response.status_code == 200\n    assert response.json()["username"] == username\n    assert TRUSTED_BROWSER_COOKIE_NAME in client.cookies\n\n    client.cookies.delete(SESSION_COOKIE_NAME)\n    restored = client.get("/api/v1/auth/session")\n\n    assert restored.status_code == 200\n    assert restored.json()["authenticated"] is True\n    assert restored.json()["username"] == username\n''', encoding='utf-8')

          design = Path('DESIGN.md')
          text = design.read_text(encoding='utf-8')
          old = 'scheme/host 小写，Unicode hostname 转为小写 IDNA ASCII，IPv6 使用压缩后的 bracketed literal'
          new = 'scheme/host 小写，Unicode hostname 使用浏览器兼容 UTS-46/IDNA 规则转为小写 IDNA ASCII，IPv6 使用压缩后的 bracketed literal'
          if text.count(old) != 1:
              raise SystemExit(f'DESIGN origin marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          design.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-shot-codex-p2-fixes.yml').unlink()
          PY

      - name: Validate focused fixes
        run: |
          python -m pip install -e 'backend[dev]'
          ruff check --config backend/pyproject.toml backend/src/operator_auth.py backend/src/settings.py backend/tests/integration/test_operator_auth_unicode.py backend/tests/integration/test_operator_origin_canonicalization.py
          mypy --config-file backend/pyproject.toml backend/src/operator_auth.py backend/src/settings.py
          pytest -q backend/tests/integration/test_operator_auth_unicode.py backend/tests/integration/test_operator_origin_canonicalization.py backend/tests/unit/test_settings.py

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(auth): support unicode credentials and browser IDNA'
          git push origin HEAD:feat/operator-totp-auth
