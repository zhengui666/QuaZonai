name: Materialize iOS Assets

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-ios-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/generate_ios_assets.py
      - name: Commit the deterministic Xcode asset when needed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          git commit -m 'build(ios): materialize universal AppIcon'
          git push origin "HEAD:$BRANCH"
