name: Retry final Issue 22 review fixes

on:
  push:
    branches: [feat/issue-22-remote-nautilus-runtime]
    paths: [.github/workflows/issue22-final-review-fixes-v2.yml]

permissions:
  contents: write

concurrency:
  group: issue22-final-review-fixes-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply corrected review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue22-final-review-fixes.yml').read_text(encoding='utf-8')
          begin_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          script = source[begin:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          old = '                domains = _revision_domains(revision, sources.get(revision.data_source_id))'
          new = (
              '                source = (\n'
              '                    sources.get(revision.data_source_id)\n'
              '                    if revision.data_source_id is not None\n'
              '                    else None\n'
              '                )\n'
              '                domains = _revision_domains(revision, source)'
          )
          if script.count(old) != 1:
              raise RuntimeError('workspace source lookup patch anchor changed')
          script = script.replace(old, new, 1)
          exec(compile(script, '<issue22-final-review-fixes>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Remove temporary workflows
        run: rm -f .github/workflows/issue22-final-review-fixes.yml .github/workflows/issue22-final-review-fixes-v2.yml
      - name: Validate patched source
        run: |
          python -m pip install --disable-pip-version-check -e 'backend[dev,research,agent]'
          python -m compileall -q backend/src
          ruff check --config backend/pyproject.toml \
            backend/src/quant_runtime backend/src/api/research_runtime.py \
            backend/src/db/domain_models.py backend/src/db/models.py \
            backend/tests/integration/test_nautilus_promotion.py \
            backend/tests/integration/test_degradation_feedback.py
          mypy --config-file backend/pyproject.toml backend/src
          pytest -q \
            backend/tests/integration/test_nautilus_promotion.py \
            backend/tests/integration/test_degradation_feedback.py
      - name: Commit fixes
        run: |
          git config user.name 'QuaZonai Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): close final governance review gaps'
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
