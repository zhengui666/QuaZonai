name: Standalone launcher packaging
on:
  pull_request:
    paths:
      - 'deploy/package.py'
      - 'deploy/launcher-launch.mjs'
      - 'deploy/LAUNCHER.md'
      - '.github/workflows/cli.yml'
      - '.github/workflows/launcher-package-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    uses: ./.github/workflows/cli.yml
    with:
      version: v0.0.0-launcher-ci
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
