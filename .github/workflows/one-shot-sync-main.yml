name: One-shot sync main into issue 36 branch

on:
  push:
    branches:
      - feat/ios-ipados-universal-app
    paths:
      - .github/workflows/one-shot-sync-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-ipados-universal-app
          fetch-depth: 0

      - name: Merge current main and resolve the two authentication contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          merge_base=$(git merge-base HEAD origin/main)

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "$conflicts"

            for path in $conflicts; do
              case "$path" in
                DESIGN.md|OPERATIONS.md|README.md)
                  patch=$(mktemp)
                  git diff --binary "$merge_base" HEAD -- "$path" > "$patch"
                  git checkout --theirs -- "$path"
                  git add "$path"
                  if ! git apply --3way --index "$patch"; then
                    echo "Three-way replay failed for $path; using deterministic union merge"
                    ours=$(mktemp)
                    base=$(mktemp)
                    theirs=$(mktemp)
                    merged=$(mktemp)
                    git show HEAD:"$path" > "$ours"
                    git show "$merge_base":"$path" > "$base"
                    git show origin/main:"$path" > "$theirs"
                    git merge-file --union -p "$ours" "$base" "$theirs" > "$merged" || true
                    cp "$merged" "$path"
                    git add "$path"
                  fi
                  ;;
                backend/src/api/auth.py)
                  cat > "$path" <<'PY'
          """Single-operator browser authentication endpoints."""

          from __future__ import annotations

          from fastapi import APIRouter, Request, Response, status
          from pydantic import BaseModel, ConfigDict, Field

          from errors import QfError
          from operator_auth import (
              OPERATOR_SUBJECT,
              OperatorAuthRuntime,
              authenticate_browser,
              browser_cookie_epoch,
              has_valid_trusted_browser,
              login_source_key,
              require_same_origin,
          )
          from settings import Settings
          from totp_core import verify_totp_once

          router = APIRouter(prefix="/api/v1/auth", tags=["auth"])


          class LoginInput(BaseModel):
              model_config = ConfigDict(extra="forbid")

              totp_code: str = Field(min_length=6, max_length=6, pattern=r"^[0-9]{6}$")
              trust_browser: bool = False


          class SessionView(BaseModel):
              model_config = ConfigDict(extra="forbid")

              authenticated: bool
              username: str
              trusted_browser: bool
              auth_enabled: bool


          def _prevent_auth_response_caching(response: Response) -> None:
              response.headers["Cache-Control"] = "no-store"
              response.headers["Pragma"] = "no-cache"


          def _invalid_authentication() -> QfError:
              return QfError(
                  "AUTH_INVALID",
                  "Operator authentication failed.",
                  401,
              )


          @router.post("/login", response_model=SessionView)
          def login(payload: LoginInput, request: Request, response: Response) -> SessionView:
              settings: Settings = request.app.state.settings
              _prevent_auth_response_caching(response)
              require_same_origin(request, settings)
              if not settings.auth_enabled:
                  return SessionView(
                      authenticated=True,
                      username=OPERATOR_SUBJECT,
                      trusted_browser=False,
                      auth_enabled=False,
                  )

              runtime: OperatorAuthRuntime = request.app.state.operator_auth_runtime
              login_cookie_issuance = runtime.cookie_issuance()
              login_browser_epoch = browser_cookie_epoch(request, settings)
              source = login_source_key(request, settings)
              if not runtime.login_limiter.allow_attempt(source):
                  raise _invalid_authentication()
              if not verify_totp_once(settings, runtime, payload.totp_code):
                  runtime.login_limiter.record_failure(source)
                  raise _invalid_authentication()
              if not runtime.complete_login_if_current(
                  response,
                  settings,
                  cookie_issuance=login_cookie_issuance,
                  browser_epoch=login_browser_epoch,
                  trust_browser=payload.trust_browser,
              ):
                  raise _invalid_authentication()
              runtime.login_limiter.record_success(source)
              return SessionView(
                  authenticated=True,
                  username=OPERATOR_SUBJECT,
                  trusted_browser=payload.trust_browser,
                  auth_enabled=True,
              )


          @router.get("/session", response_model=SessionView)
          def session(request: Request, response: Response) -> SessionView:
              settings: Settings = request.app.state.settings
              _prevent_auth_response_caching(response)
              if not settings.auth_enabled:
                  return SessionView(
                      authenticated=True,
                      username=OPERATOR_SUBJECT,
                      trusted_browser=False,
                      auth_enabled=False,
                  )
              runtime: OperatorAuthRuntime = request.app.state.operator_auth_runtime
              renewal_cookie_issuance = runtime.cookie_issuance()
              renewal_browser_epoch = browser_cookie_epoch(request, settings)
              identity = authenticate_browser(request, settings)
              if identity is None:
                  raise QfError(
                      "AUTH_REQUIRED",
                      "Operator authentication is required.",
                      401,
                  )
              if identity.renew_session:
                  if not runtime.renew_session_if_current(
                      response,
                      settings,
                      cookie_issuance=renewal_cookie_issuance,
                      browser_epoch=renewal_browser_epoch,
                  ):
                      raise QfError(
                          "AUTH_REQUIRED",
                          "Operator authentication is required.",
                          401,
                      )
              return SessionView(
                  authenticated=True,
                  username=identity.username,
                  trusted_browser=has_valid_trusted_browser(request, settings),
                  auth_enabled=True,
              )


          @router.post("/logout", status_code=status.HTTP_204_NO_CONTENT)
          def logout(request: Request, response: Response) -> None:
              settings: Settings = request.app.state.settings
              _prevent_auth_response_caching(response)
              require_same_origin(request, settings)
              browser_identity = authenticate_browser(request, settings)
              runtime: OperatorAuthRuntime = request.app.state.operator_auth_runtime
              runtime.complete_logout(
                  response,
                  settings,
                  revoke_streams=browser_identity is not None,
              )
          PY
                  sed -i 's/^          //' "$path"
                  git add "$path"
                  ;;
                backend/src/errors.py)
                  cat > "$path" <<'PY'
          """Stable QuaZonai error envelope."""

          from __future__ import annotations

          from dataclasses import dataclass, field
          from typing import Any

          from fastapi import FastAPI, Request
          from fastapi.exceptions import RequestValidationError
          from fastapi.responses import JSONResponse, Response
          from pydantic import BaseModel, ConfigDict, Field

          _AUTH_LOGIN_PATHS = frozenset({"/api/v1/auth/login", "/api/v1/auth/mobile/login"})
          _AUTH_PATH_PREFIX = "/api/v1/auth/"
          _NO_STORE_HEADERS = {"Cache-Control": "no-store", "Pragma": "no-cache"}


          class ErrorBody(BaseModel):
              model_config = ConfigDict(extra="forbid")

              code: str
              message: str
              details: dict[str, Any] = Field(default_factory=dict)


          class ErrorEnvelope(BaseModel):
              model_config = ConfigDict(extra="forbid")

              error: ErrorBody


          @dataclass(slots=True)
          class QfError(Exception):
              code: str
              message: str
              status_code: int = 400
              details: dict[str, Any] = field(default_factory=dict)

              def __str__(self) -> str:
                  return f"{self.code}: {self.message}"


          def _error_response(
              *,
              code: str,
              message: str,
              status_code: int,
              details: dict[str, Any] | None = None,
              headers: dict[str, str] | None = None,
          ) -> JSONResponse:
              payload = ErrorEnvelope(
                  error=ErrorBody(
                      code=code,
                      message=message,
                      details=details or {},
                  )
              )
              return JSONResponse(
                  status_code=status_code,
                  content=payload.model_dump(mode="json"),
                  headers=headers,
              )


          def _validation_details(exc: RequestValidationError) -> dict[str, Any]:
              """Return stable validation metadata without echoing rejected input values."""
              fields: list[dict[str, Any]] = []
              for item in exc.errors():
                  location = item.get("loc", ())
                  fields.append(
                      {
                          "location": [str(component) for component in location],
                          "type": str(item.get("type", "validation_error")),
                          "message": str(item.get("msg", "Invalid value")),
                      }
                  )
              return {"fields": fields}


          def install_error_handlers(app: FastAPI) -> None:
              @app.exception_handler(QfError)
              async def handle_qf_error(request: Request, exc: QfError) -> JSONResponse:
                  headers = _NO_STORE_HEADERS if request.url.path.startswith(_AUTH_PATH_PREFIX) else None
                  return _error_response(
                      code=exc.code,
                      message=exc.message,
                      status_code=exc.status_code,
                      details=exc.details,
                      headers=headers,
                  )

              @app.exception_handler(RequestValidationError)
              async def handle_request_validation(
                  request: Request,
                  exc: RequestValidationError,
              ) -> Response:
                  if request.url.path in _AUTH_LOGIN_PATHS:
                      return _error_response(
                          code="AUTH_INVALID",
                          message="Operator authentication failed.",
                          status_code=401,
                          headers=_NO_STORE_HEADERS,
                      )
                  return _error_response(
                      code="REQUEST_VALIDATION_ERROR",
                      message="Request validation failed.",
                      status_code=422,
                      details=_validation_details(exc),
                  )
          PY
                  sed -i 's/^          //' "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected unresolved path: $path"
                  exit 1
                  ;;
              esac
            done
          fi

          remaining=$(git diff --name-only --diff-filter=U)
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi

          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' DESIGN.md OPERATIONS.md README.md backend/src/api/auth.py backend/src/errors.py; then
            echo 'Conflict markers remain'
            exit 1
          fi
          python -m compileall -q backend/src
          git diff --check
          git commit -m 'merge: synchronize TOTP-only main into iOS branch'
          git push origin HEAD:feat/ios-ipados-universal-app
