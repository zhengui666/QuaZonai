name: Issue 37 review fix

on:
  push:
    branches:
      - fix/issue-37-totp-only-auth
    paths:
      - .github/workflows/issue37-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-37-totp-only-auth

      - name: Apply final review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "compose.yml",
              """      QUAZONAI_AUTH_ENABLED: ${QUAZONAI_AUTH_ENABLED:-false}
              QUAZONAI_AUTH_TOTP_SECRET: ${QUAZONAI_AUTH_TOTP_SECRET:-}
          """,
              """      QUAZONAI_AUTH_ENABLED: ${QUAZONAI_AUTH_ENABLED:-false}
              # Names-only upgrade sentinels preserve fail-closed detection without
              # forwarding deprecated username/password secret values.
              QUAZONAI_AUTH_USERNAME: "${QUAZONAI_AUTH_USERNAME:+QUAZONAI_AUTH_USERNAME}"
              QUAZONAI_AUTH_PASSWORD: "${QUAZONAI_AUTH_PASSWORD:+QUAZONAI_AUTH_PASSWORD}"
              QUAZONAI_AUTH_TOTP_SECRET: ${QUAZONAI_AUTH_TOTP_SECRET:-}
          """,
          )

          replace_once(
              "DESIGN.md",
              """旧浏览器 username/password 环境变量已退出受支持配置。认证启用时只要检测到任一非空旧变量，API 必须在启动阶段 fail closed，并且错误只指出变量名而不输出其值；这些旧值不得进入 `Settings`、日志、API、Cookie 或登录验证逻辑。认证关闭时仍保持 direct access，旧变量仅作为 dormant process environment 被忽略。
          """,
              """旧浏览器 username/password 环境变量已退出受支持配置。认证启用时只要检测到任一非空旧变量，API 必须在启动阶段 fail closed，并且错误只指出变量名而不输出其值；这些旧值不得进入 `Settings`、日志、API、Cookie 或登录验证逻辑。Core Compose 不转发旧 secret 的原值；它只在旧变量非空时把对应变量映射为等于变量名本身的 names-only sentinel，让 API 执行同一 fail-closed 检查。认证关闭时仍保持 direct access，旧变量仅作为 dormant process environment 被忽略。
          """,
          )

          replace_once(
              "DESIGN.md",
              """- 未认证浏览器只显示登录门，不加载研究工作台数据；
          - 输入单 Operator username、password 和 6 位 authenticator code；
          - 提供 `Trust this browser` 选项，并明确其会在当前浏览器保存长期 HttpOnly device credential；
          - trusted-browser credential 有效时自动恢复会话，不要求再次输入 TOTP；
          - 登录失败使用统一错误，不暴露哪一项凭证错误；
          - logout 默认忘记当前 trusted browser。
          """,
              """- 未认证浏览器只显示登录门，不加载研究工作台数据；
          - 只输入 Google Authenticator-compatible 6 位 authenticator code；
          - 提供 `Trust this browser` 选项，并明确其会在当前浏览器保存长期 HttpOnly device credential；
          - trusted-browser credential 有效时自动恢复会话，不要求再次输入 TOTP；
          - 登录失败使用统一错误，不区分动态码格式、错误、重放或限流；
          - logout 默认忘记当前 trusted browser。
          """,
          )

          replace_once(
              "backend/tests/unit/test_operator_auth_totp_only_contract.py",
              """import time
          from dataclasses import replace
          """,
              """import time
          from dataclasses import replace
          from pathlib import Path
          """,
          )

          replace_once(
              "backend/tests/unit/test_operator_auth_totp_only_contract.py",
              """from settings import Settings, SettingsError


          def _enabled_settings(settings: Settings) -> Settings:
          """,
              """from settings import Settings, SettingsError

          REPO_ROOT = Path(__file__).resolve().parents[3]
          COMPOSE_PATH = REPO_ROOT / "compose.yml"


          def _enabled_settings(settings: Settings) -> Settings:
          """,
          )

          replace_once(
              "backend/tests/unit/test_operator_auth_totp_only_contract.py",
              """def test_disabled_auth_keeps_legacy_values_dormant(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              monkeypatch.setenv("QUAZONAI_AUTH_ENABLED", "false")
              monkeypatch.setenv("QUAZONAI_AUTH_USERNAME", "legacy-user")
              monkeypatch.setenv("QUAZONAI_AUTH_PASSWORD", "legacy-password")

              configured = Settings.from_env()

              assert configured.auth_enabled is False
              assert not hasattr(configured, "operator_username")
              assert not hasattr(configured, "operator_password")


          def test_machine_authentication_uses_fixed_operator_subject(settings: Settings) -> None:
          """,
              """def test_disabled_auth_keeps_legacy_values_dormant(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              monkeypatch.setenv("QUAZONAI_AUTH_ENABLED", "false")
              monkeypatch.setenv("QUAZONAI_AUTH_USERNAME", "legacy-user")
              monkeypatch.setenv("QUAZONAI_AUTH_PASSWORD", "legacy-password")

              configured = Settings.from_env()

              assert configured.auth_enabled is False
              assert not hasattr(configured, "operator_username")
              assert not hasattr(configured, "operator_password")


          def test_compose_preserves_legacy_guard_without_forwarding_secret_values() -> None:
              compose = COMPOSE_PATH.read_text(encoding="utf-8")

              for variable in ("QUAZONAI_AUTH_USERNAME", "QUAZONAI_AUTH_PASSWORD"):
                  names_only_sentinel = f'{variable}: "${{{variable}:+{variable}}}"'
                  assert names_only_sentinel in compose
                  assert f"{variable}: ${{{variable}:-}}" not in compose


          def test_machine_authentication_uses_fixed_operator_subject(settings: Settings) -> None:
          """,
          )
          PY

      - name: Commit final review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md compose.yml backend/tests/unit/test_operator_auth_totp_only_contract.py
          git diff --cached --check
          git commit -m "fix(auth): address final review findings"
          git push origin HEAD:fix/issue-37-totp-only-auth
