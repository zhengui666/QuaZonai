name: Main Post-Merge Verification

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [quazonai-main-verification]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: main-post-merge-${{ github.event.client_payload.merged_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      expected_sha: ${{ steps.sha.outputs.expected_sha }}
      pull_number: ${{ steps.sha.outputs.pull_number }}
    steps:
      - id: sha
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.merged_sha }}
          DISPATCH_PR: ${{ github.event.client_payload.pull_number }}
        run: |
          expected_sha="${DISPATCH_SHA:-$GITHUB_SHA}"
          printf 'expected_sha=%s\n' "$expected_sha" >> "$GITHUB_OUTPUT"
          printf 'pull_number=%s\n' "${DISPATCH_PR:-}" >> "$GITHUB_OUTPUT"

  backend:
    needs: resolve
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_ALEMBIC_URL: postgresql+psycopg://quazonai:quazonai@127.0.0.1:5432/quazonai
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - run: test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.expected_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e 'backend[dev,research,agent,nautilus-runtime]'
      - run: python -m compileall -q backend/src
      - run: ruff check --config backend/pyproject.toml backend/src backend/tests
      - run: mypy --config-file backend/pyproject.toml backend/src
      - run: |
          python -m db.preflight
          alembic -c backend/alembic.ini upgrade head
          python -m db.preflight
      - run: pytest -q -m 'not nautilus' backend/tests

  frontend:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Run every declared static frontend gate
        working-directory: frontend
        run: |
          node - <<'JS'
          const scripts = require('./package.json').scripts || {};
          for (const name of ['lint', 'typecheck', 'test', 'build']) {
            if (scripts[name]) console.log(name);
          }
          JS
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then npm run lint; fi
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then npm run typecheck; fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm run test -- --run; fi
          npm run build

  contracts:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      QUAZONAI_ENV: test
      QUAZONAI_DATABASE_URL: sqlite+pysqlite:///:memory:
      QUAZONAI_ALEMBIC_URL: sqlite+pysqlite:///:memory:
      QUAZONAI_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e 'backend[dev]'
      - run: python tools/client_parity.py
      - run: python tools/ios_release_contract.py

  ios:
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - name: Select Xcode and generate project
        run: |
          xcode_path=$(ls -dt /Applications/Xcode*.app | head -1)
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          if ! find ios -maxdepth 3 -name '*.xcodeproj' -print -quit | grep -q .; then
            test -f ios/project.yml
            brew install xcodegen
            (cd ios && xcodegen generate)
          fi
          project=$(find ios -maxdepth 3 -name '*.xcodeproj' -print -quit)
          scheme=$(xcodebuild -project "$project" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); values=d.get("project",{}).get("schemes",[]); print(next((x for x in values if "QuaZonai" in x), values[0] if values else ""))')
          test -n "$project" -a -n "$scheme"
          printf 'QZ_PROJECT=%s\nQZ_SCHEME=%s\n' "$project" "$scheme" >> "$GITHUB_ENV"
      - run: xcodebuild -resolvePackageDependencies -project "$QZ_PROJECT" -scheme "$QZ_SCHEME"
      - name: Resolve simulator destinations
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; key=lambda x:tuple(int(p) for p in x["version"].split(".")); print(max(r,key=key)["identifier"])')
          phone_type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; x=[d for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPhone") and "SE" not in d["name"]]; print(x[-1]["identifier"])')
          pad_type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; x=[d for d in json.load(sys.stdin)["devicetypes"] if d["name"].startswith("iPad Pro")]; print(x[-1]["identifier"])')
          printf 'PHONE=%s\nPAD=%s\n' "$(xcrun simctl create QuaZonai-Main-iPhone "$phone_type" "$runtime")" "$(xcrun simctl create QuaZonai-Main-iPad "$pad_type" "$runtime")" >> "$GITHUB_ENV"
      - run: xcodebuild test -project "$QZ_PROJECT" -scheme "$QZ_SCHEME" -destination "platform=iOS Simulator,id=$PHONE" -resultBundlePath "$RUNNER_TEMP/main-iPhone.xcresult" CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild test -project "$QZ_PROJECT" -scheme "$QZ_SCHEME" -destination "platform=iOS Simulator,id=$PAD" -resultBundlePath "$RUNNER_TEMP/main-iPad.xcresult" CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild archive -project "$QZ_PROJECT" -scheme "$QZ_SCHEME" -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/QuaZonai-main.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ios-verification
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/QuaZonai-main.xcarchive

  compose-and-nautilus:
    needs: resolve
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: quazonai
          POSTGRES_USER: quazonai
          POSTGRES_PASSWORD: quazonai-local
        options: >-
          --health-cmd "pg_isready -U quazonai -d quazonai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - run: docker compose --env-file .env.example config --quiet
      - run: |
          docker build --file deploy/Dockerfile.backend --tag quazonai-main-ci .
          docker build --file deploy/Dockerfile.nautilus-runtime --tag quazonai-nautilus-main-ci .
          docker run --rm --entrypoint python quazonai-main-ci - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('nautilus_trader') is None
          PY
          docker run --rm --entrypoint python quazonai-nautilus-main-ci - <<'PY'
          import nautilus_trader
          assert nautilus_trader.__version__ == '1.231.0'
          PY

  verified:
    if: always()
    needs: [resolve, backend, frontend, contracts, ios, compose-and-nautilus]
    runs-on: ubuntu-latest
    steps:
      - name: Require every main verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in needs.items() if name != 'resolve' and value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Main verification failed: {failed}')
          PY
      - name: Record verified main SHA on the source PR
        if: needs.resolve.outputs.pull_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.resolve.outputs.pull_number }}'),
              body: `<!-- quazonai-main-verified:${{ needs.resolve.outputs.expected_sha }} -->\nMain post-merge CI passed on \`${{ needs.resolve.outputs.expected_sha }}\`.`,
            });
