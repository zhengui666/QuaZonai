name: Container
on:
  pull_request:
    paths:
      - 'deploy/docker/**'
      - '.github/workflows/container.yml'
      - 'apps/**'
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'runtimes/codex/**'
  push:
    branches: [main]
    paths:
      - 'deploy/docker/**'
      - '.github/workflows/container.yml'
      - 'apps/**'
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'runtimes/codex/**'
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-smoke:
    name: Container / build and API-PostgreSQL restart
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_IMAGE: quazonai-ci:${{ github.event.pull_request.head.sha || github.sha }}
      DATABASE_IMAGE: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
      INSTALL_DIR: ${{ runner.temp }}/quazonai-container
      NATIVE_CODEX_HOME: ${{ runner.temp }}/quazonai-native-home
      WEB_PORT: '18081'
      DATABASE_PORT: '55439'
      COMPOSE_PROJECT_NAME: quazonai-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: deploy/docker/compose.yaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Validate shell and establish disposable test state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          bash -n deploy/docker/entrypoint.sh
          mkdir -m 700 -p "$INSTALL_DIR/data" "$NATIVE_CODEX_HOME"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          {
            echo "DATABASE_PASSWORD=$password"
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
            echo "NATIVE_HOME=$HOME"
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            VERSION=ci
            REVISION=${{ env.EXPECTED_HEAD }}
          cache-from: type=gha,scope=quazonai-container
          cache-to: type=gha,mode=max,scope=quazonai-container
      - name: Validate the actual built runtime and console configuration
        run: |
          set -euo pipefail
          docker run --rm "$APP_IMAGE" --version
          docker run --rm --entrypoint /usr/bin/caddy "$APP_IMAGE" validate --config /opt/quazonai/Caddyfile --adapter caddyfile
          docker compose config --quiet
      - name: Migrate a real PGMQ database and verify console restart persistence
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 120 database
          docker compose run --rm --no-deps app init-state
          docker compose run --rm --no-deps app migrate
          docker compose up -d --wait --wait-timeout 120 app
          curl -fsS --max-time 10 "http://localhost:$WEB_PORT/health/live"
          curl -fsS --max-time 10 -H 'Accept: text/html' "http://localhost:$WEB_PORT/" | grep -qi '<!doctype html>'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "http://localhost:$WEB_PORT/assets/does-not-exist.js")" = 404
          test "$(docker compose exec -T database psql -X -U quazonai -d quazonai -Atc "SELECT extversion FROM pg_extension WHERE extname='pgmq'")" = '1.10.0'
          docker compose exec -T database psql -X -U quazonai -d quazonai -v ON_ERROR_STOP=1 -c "CREATE TABLE public.container_release_smoke (value text PRIMARY KEY); INSERT INTO public.container_release_smoke VALUES ('persisted');"
          key_before=$(sha256sum "$INSTALL_DIR/data/state/master.key")
          docker compose restart app database
          docker compose up -d --wait --wait-timeout 120
          test "$(docker compose exec -T database psql -X -U quazonai -d quazonai -Atc 'SELECT value FROM public.container_release_smoke')" = persisted
          test "$(sha256sum "$INSTALL_DIR/data/state/master.key")" = "$key_before"
          curl -fsS --max-time 10 "http://localhost:$WEB_PORT/health/live"
      - name: Show failure diagnostics from only this disposable stack
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Remove only this job's disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
