name: Container
on:
  pull_request:
    paths:
      - 'deploy/docker/**'
      - '.github/actions/container/**'
      - '.github/workflows/container.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dev-image.yml'
      - 'apps/**'
      - 'crates/**'
      - 'migrations/**'
      - 'contracts/**'
      - 'skills/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'runtimes/codex/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codex-backend:
    name: Codex / real container protocol, persistence and limits
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CODEX_CONTAINER_TEST_IMAGE: quazonai-codex-test:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the independently versioned official Codex runtime
        run: |
          set -euo pipefail
          version=$(sed -n 's/^CODEX_VERSION=//p' deploy/docker/.env.example)
          test -n "$version"
          docker build --file deploy/docker/Codex.Dockerfile \
            --build-arg "CODEX_VERSION=$version" --tag "$CODEX_CONTAINER_TEST_IMAGE" deploy/docker
          test "$(docker run --rm "$CODEX_CONTAINER_TEST_IMAGE" --version)" = "codex-cli $version"
      - name: Execute the packaged native sandbox without credentials or model calls
        run: |
          set -euo pipefail
          sudo apparmor_parser -r deploy/docker/codex.apparmor
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --tmpfs /home/codex/.codex:uid=1000,gid=1000,mode=700 \
            --env CODEX_HOME=/home/codex/.codex "$CODEX_CONTAINER_TEST_IMAGE" \
            --disable use_legacy_landlock -c 'sandbox_mode="read-only"' sandbox -- /usr/bin/true
      - name: Verify actual App Server containers and Mission lifecycle
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          cargo fmt --all -- --check
          cargo clippy --locked -p server --features codex-container --test codex_container -- -D warnings
          cargo test --locked -p server --features codex-container --test codex_container -- --test-threads=1
      - name: Remove only this test image's remaining containers
        if: always()
        run: |
          docker ps --all --quiet --filter "label=io.quazonai.codex.image=$CODEX_CONTAINER_TEST_IMAGE" | xargs --no-run-if-empty docker rm --force
          sudo apparmor_parser -R deploy/docker/codex.apparmor
  build-smoke:
    name: Container / install, update and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/container
        with:
          image: quazonai-ci:${{ github.event.pull_request.head.sha || github.sha }}
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          version: ci
