name: Temporary integration diagnostics
on:
  pull_request:
    paths: ['.github/workflows/capture-integration-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve only the fixed failed public source-transport job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/integration-diagnostic
          gh api repos/zhengui666/QuaZonai/actions/jobs/101492257991/logs > /tmp/integration-diagnostic/transport.log
          printf 'Diagnostic log only, not acceptance evidence.\n' > /tmp/integration-diagnostic/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-integration-diagnostics
          path: /tmp/integration-diagnostic/
          retention-days: 1
          if-no-files-found: error
