name: Issue 37 Residual Auth Contract Fix

on:
  pull_request:
    paths:
      - '.github/scripts/issue37_fix_residual_auth_contract.py'
      - '.github/workflows/issue37-fix-residual-auth-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply residual TOTP-only cleanup
        run: python .github/scripts/issue37_fix_residual_auth_contract.py
      - name: Remove one-shot fixer
        run: rm .github/scripts/issue37_fix_residual_auth_contract.py .github/workflows/issue37-fix-residual-auth-contract.yml
      - name: Commit cleanup
        run: |
          git config user.name 'QuaZonai CI Finalizer'
          git config user.email 'quazonai-ci@localhost'
          git add -A
          git commit -m 'test(auth): remove residual legacy settings references'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
