name: Temporary control-plane development inputs
on:
  pull_request:
    paths:
      - '.github/workflows/development-inputs.yml'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export public native sources without changing the product lock
        run: |
          set -euo pipefail
          mkdir -p /tmp/development/candidate/src /tmp/development/evidence
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cat > /tmp/development/candidate/Cargo.toml <<'TOML'
          [package]
          name = "control-plane-development-inputs"
          version = "0.0.0"
          edition = "2021"
          rust-version = "1.98"
          publish = false
          [dependencies]
          serde = { version = "=1.0.229", features = ["derive"] }
          serde_json = "=1.0.151"
          axum = { version = "=0.8.9", features = ["macros"] }
          tokio = { version = "=1.53.1", features = ["full"] }
          tokio-stream = { version = "=0.1.17", features = ["sync"] }
          sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "bigdecimal", "json", "migrate", "macros"] }
          uuid = { version = "=1.26.0", features = ["v7", "serde"] }
          chrono = { version = "=0.4.41", features = ["serde"] }
          bigdecimal = { version = "=0.4.8", features = ["serde"] }
          clap = { version = "=4.5.46", features = ["derive", "env"] }
          reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
          tower = { version = "=0.5.2", features = ["util", "limit", "timeout"] }
          tower-http = { version = "=0.6.6", features = ["cors", "trace", "timeout", "limit", "fs", "set-header", "sensitive-headers"] }
          tower-sessions = { version = "=0.14.0", features = ["signed", "private"] }
          tower-sessions-sqlx-store = { version = "=0.15.0", features = ["postgres"] }
          totp-rs = { version = "=5.7.0", features = ["gen_secret", "otpauth"] }
          argon2 = "=0.5.3"
          chacha20poly1305 = "=0.10.1"
          cap-std = "=3.4.5"
          base64 = "=0.22.1"
          rand = "=0.9.2"
          rmcp = { version = "=0.6.1", features = ["server", "client", "transport-io", "transport-child-process"] }
          utoipa = { version = "=5.4.0", features = ["chrono", "uuid"] }
          bollard = "=0.19.1"
          thiserror = "=2.0.20"
          tracing = "=0.1.44"
          tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "json"] }
          futures-util = "=0.3.31"
          async-stream = "=0.3.6"
          url = "=2.5.7"
          toml = "=0.9.5"
          tempfile = "=3.27.0"
          proptest = "=1.7.0"
          time = "=0.3.41"
          rust-portfolio-opt = "=0.2.0"
          model-selection-rs = "=0.1.0"
          nalgebra = "=0.33.3"
          rustix = { version = "=1.1.4", features = ["fs", "process"] }
          jsonschema = "=0.33.0"
          TOML
          printf 'fn main() {}\n' > /tmp/development/candidate/src/main.rs
          cargo generate-lockfile --manifest-path /tmp/development/candidate/Cargo.toml
          cargo vendor --locked --manifest-path /tmp/development/candidate/Cargo.toml --sync "$PWD/Cargo.toml" /tmp/development/vendor > /tmp/development/evidence/vendor-config.toml
          cp /tmp/development/candidate/Cargo.toml /tmp/development/evidence/candidate.toml
          cp /tmp/development/candidate/Cargo.lock /tmp/development/evidence/candidate.lock
          tar -C /tmp/development -czf /tmp/development/evidence/vendor.tar.gz vendor
          git archive --format=tar HEAD | gzip > /tmp/development/evidence/source.tar.gz
          git rev-parse HEAD > /tmp/development/evidence/source-commit.txt
          printf 'PUBLIC DEVELOPMENT INPUTS ONLY. No product acceptance or account data.\n' > /tmp/development/evidence/README.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-plane-inputs-${{ github.sha }}
          path: /tmp/development/evidence/
          retention-days: 1
          if-no-files-found: error
