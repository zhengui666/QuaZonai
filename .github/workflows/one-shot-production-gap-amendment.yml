name: One-shot production gap amendment

on:
  push:
    branches:
      - docs/production-gap-register
    paths:
      - .github/workflows/one-shot-production-gap-amendment.yml

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/production-gap-register
          fetch-depth: 0
      - name: Apply reviewed documentation amendments
        run: |
          echo '' | base64 --decode > /tmp/amend.py
          python /tmp/amend.py
      - name: Commit amendment and remove one-shot workflow
        run: |
          git config user.name "QuaZonai Documentation Bot"
          git config user.email "quazonai-docs@users.noreply.github.com"
          git add DESIGN.md PRODUCTION_GAP_REGISTER.md
          git rm .github/workflows/one-shot-production-gap-amendment.yml
          git commit -m "docs: align production gap register with design"
          git push origin HEAD:docs/production-gap-register
