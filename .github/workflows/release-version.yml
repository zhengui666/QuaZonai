name: Publish prebuilt version
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      branch:
        type: string
        default: main
permissions:
  contents: read
  actions: read
jobs:
  regression:
    if: inputs.branch == 'main'
    uses: ./.github/workflows/rust-regression.yml
    with:
      revision: ${{ inputs.revision }}
      artifact_label: ${{ inputs.version }}
  cli:
    uses: ./.github/workflows/cli.yml
    with:
      version: ${{ inputs.version }}
      revision: ${{ inputs.revision }}
  build:
    needs: regression
    if: ${{ !cancelled() && (inputs.branch == 'dev' || needs.regression.result == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      LOCAL_IMAGE: quazonai-release:${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve successful exact-push core CI and its tested binaries
        id: core
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/dev:refs/remotes/origin/dev' '+refs/tags/*:refs/tags/*'
          python3 -B deploy/docker/release.py verify --version "$VERSION" --revision "$REVISION"
          python3 -B deploy/docker/release.py ci-run --revision "$REVISION"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-${{ inputs.revision }}
          run-id: ${{ steps.core.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-download
      - name: Reuse exact tested artifacts; no Cargo build/test here
        run: |
          mkdir -p "$RUNNER_TEMP/native-artifacts"
          tar -xzf "$RUNNER_TEMP/native-download/native.tar.gz" -C "$RUNNER_TEMP/native-artifacts"
          test "$(cat "$RUNNER_TEMP/native-artifacts/tested-revision")" = "$REVISION"
      - uses: ./.github/actions/container
        id: images
        with:
          image: ${{ env.LOCAL_IMAGE }}
          revision: ${{ inputs.revision }}
          version: ${{ inputs.version }}
          native-artifact-directory: ${{ runner.temp }}/native-artifacts
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the same installation-tested images
        env:
          RUNTIME_IMAGE: ${{ steps.images.outputs.runtime-image }}
        run: |
          python3 -B deploy/docker/release.py push-images --version "$VERSION" --revision "$REVISION" \
            --image "$LOCAL_IMAGE" --runtime-image "$RUNTIME_IMAGE" --output "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-${{ inputs.version }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 14
          if-no-files-found: error
  assets:
    needs: [build, cli]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prebuilt-${{ inputs.version }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-${{ inputs.version }}-linux-x86_64
          path: ${{ runner.temp }}/release-assets
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Roundtrip shipped archives, then assemble pinned installers
        run: |
          python3 -B deploy/docker/release.py archive-images --output "$RUNNER_TEMP/release-assets"
          python3 -B deploy/package.py prepare --output "$RUNNER_TEMP/release-assets"
      - name: Narrow published installation check, not a second full regression
        run: python3 -B deploy/docker/smoke.py --manifest "$RUNNER_TEMP/release-assets/release.json" --published-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-${{ inputs.version }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
      RELEASE_BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: complete-${{ inputs.version }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/release-assets
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize only the installed revision, without rebuilding
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/dev:refs/remotes/origin/dev' '+refs/tags/*:refs/tags/*'
          python3 -B deploy/docker/release.py verify --version "$VERSION" --revision "$REVISION"
          python3 -B deploy/docker/release.py publish --output "$RUNNER_TEMP/release-assets"
