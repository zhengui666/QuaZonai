name: Rerun Flaky PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read

concurrency:
  group: rerun-flaky-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  rerun-once:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Rerun failed jobs once, never mask a second failure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.pull_request.head.sha;
            const currentRun = Number(process.env.GITHUB_RUN_ID);
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const ignored = new Set(['Rerun Flaky PR Checks', 'Codex Review Gate']);

            for (let attempt = 0; attempt < 120; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, event: 'pull_request', head_sha: headSha, per_page: 100,
              });
              const latest = new Map();
              for (const run of response.data.workflow_runs) {
                if (run.id === currentRun || run.head_sha !== headSha || ignored.has(run.name)) continue;
                const previous = latest.get(run.name);
                if (!previous || Date.parse(run.created_at) > Date.parse(previous.created_at)) {
                  latest.set(run.name, run);
                }
              }
              const runs = [...latest.values()];
              const incomplete = runs.filter((run) => run.status !== 'completed');
              if (runs.length === 0 || incomplete.length > 0) {
                await sleep(20_000);
                continue;
              }
              const firstFailures = runs.filter(
                (run) => !['success', 'neutral', 'skipped'].includes(run.conclusion) && run.run_attempt === 1
              );
              for (const run of firstFailures) {
                core.info(`Rerunning failed jobs once: ${run.name} (${run.id})`);
                await github.rest.actions.reRunWorkflowFailedJobs({owner, repo, run_id: run.id});
              }
              if (firstFailures.length > 0) {
                await sleep(20_000);
                continue;
              }
              const terminalFailures = runs.filter(
                (run) => !['success', 'neutral', 'skipped'].includes(run.conclusion)
              );
              if (terminalFailures.length > 0) {
                core.setFailed(`Checks still fail after one rerun: ${terminalFailures.map((run) => run.name).join(', ')}`);
              }
              return;
            }
            core.setFailed('Timed out while waiting for PR checks to reach a terminal state.');
