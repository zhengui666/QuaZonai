name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_run:
    workflows: [CI, Web console, Native Runtime, Polymarket history, Container]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to retry, or empty to scan all merged versions.
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: quazonai-versioned-release
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'zhengui666/QuaZonai'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read current tags and main
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
      - name: Select merged versions with successful exact-source CI
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B deploy/docker/release.py select
  publish:
    needs: select
    if: needs.select.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/release-version.yml
    with:
      version: ${{ matrix.version }}
      revision: ${{ matrix.revision }}
