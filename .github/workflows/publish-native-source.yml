name: Publish prepared native source (one-time development)
on:
  pull_request:
    paths:
      - '.github/updates/**'
      - '.github/workflows/publish-native-source.yml'
permissions:
  contents: read
concurrency:
  group: publish-native-source-63
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'zhengui666/QuaZonai' && github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
    outputs:
      lock: ${{ steps.generated.outputs.lock }}
      schema: ${{ steps.generated.outputs.schema }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the executor's already reviewed patch with native Git
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          if git diff --name-only eea0f2e2ea3a6a187f9a6fa9bcab9d36ac234613 HEAD | grep -Ev '^(\.github/|docs/research/reuse\.md$)' | grep .; then
            echo 'Unreviewed source changes; refusing prepared patch' >&2
            exit 1
          fi
          git rm -f -r --ignore-unmatch backend frontend plugins deploy skills/quazonai runtimes/science
          git rm -f --ignore-unmatch docs/architecture/legacy-issue-58-design.md FRONTEND_REVIEW.md .stop-probing compose.yml .env.example tools/lock_science_runtime.py tests/native/test_science_lock.py tests/native/test_upstream_compatibility.py
          git mv apps/qz-job apps/job
          git mv crates/qz-contracts crates/contracts
          git mv crates/qz-domain crates/domain
          git ls-files -z | grep -z -v '^.github/' | xargs -0 perl -pi -e 's/qz-contracts/contracts/g; s/qz-domain/domain/g; s/qz-job/job/g; s/qz_contracts/contracts/g; s/qz_domain/domain/g; s/qz_job/job/g; s#apps/qz-runtime#apps/runtime#g; s#crates/qz-store#crates/store#g; s#crates/qz-integrations#crates/integrations#g; s#apps/qz/#apps/server/#g;'
          git rm -f --ignore-unmatch README.md CLI.md OPERATIONS.md AGENTS.md THIRD_PARTY_NOTICES.md Makefile .dockerignore .gitignore .github/CODEOWNERS .github/dependabot.yml docs/architecture/compatibility-matrix.md docs/architecture/issue-62-execution.md apps/job/src/lib.rs apps/job/src/arrow.rs apps/job/src/backtest.rs apps/job/src/optimization.rs
          # Correct one transport indentation in a diff header, not source content.
          cat .github/updates/*.patch | sed 's/^ diff --git a\/Makefile b\/Makefile$/diff --git a\/Makefile b\/Makefile/' > /tmp/prepared.patch
          git apply --check /tmp/prepared.patch
          git apply /tmp/prepared.patch
          git diff --check
      - name: Generate the development lock and verify the actual prepared source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace --all-targets
          cargo run --locked -q -p contracts --example generate > contracts/generated/domain-v1.openapi.json
          cargo run --locked -p job -- verify-native --output /tmp/native-prepared
          git diff --check
      - name: Pass only generated text data to the isolated publisher
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          echo "lock=$(base64 -w0 Cargo.lock)" >> "$GITHUB_OUTPUT"
          echo "schema=$(base64 -w0 contracts/generated/domain-v1.openapi.json)" >> "$GITHUB_OUTPUT"
      - name: Save development evidence without claiming product acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-native-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/native-prepared/
            Cargo.lock
            contracts/generated/domain-v1.openapi.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: rewrite/issue-62-rust-evidence
      GENERATED_LOCK: ${{ needs.prepare.outputs.lock }}
      GENERATED_SCHEMA: ${{ needs.prepare.outputs.schema }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Publish fixed source and generated data without executing application code
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git rm -f -r --ignore-unmatch backend frontend plugins deploy skills/quazonai runtimes/science
          git rm -f --ignore-unmatch docs/architecture/legacy-issue-58-design.md FRONTEND_REVIEW.md .stop-probing compose.yml .env.example tools/lock_science_runtime.py tests/native/test_science_lock.py tests/native/test_upstream_compatibility.py
          git mv apps/qz-job apps/job
          git mv crates/qz-contracts crates/contracts
          git mv crates/qz-domain crates/domain
          git ls-files -z | grep -z -v '^.github/' | xargs -0 perl -pi -e 's/qz-contracts/contracts/g; s/qz-domain/domain/g; s/qz-job/job/g; s/qz_contracts/contracts/g; s/qz_domain/domain/g; s/qz_job/job/g; s#apps/qz-runtime#apps/runtime#g; s#crates/qz-store#crates/store#g; s#crates/qz-integrations#crates/integrations#g; s#apps/qz/#apps/server/#g;'
          git rm -f --ignore-unmatch README.md CLI.md OPERATIONS.md AGENTS.md THIRD_PARTY_NOTICES.md Makefile .dockerignore .gitignore .github/CODEOWNERS .github/dependabot.yml docs/architecture/compatibility-matrix.md docs/architecture/issue-62-execution.md apps/job/src/lib.rs apps/job/src/arrow.rs apps/job/src/backtest.rs apps/job/src/optimization.rs
          cat .github/updates/*.patch | sed 's/^ diff --git a\/Makefile b\/Makefile$/diff --git a\/Makefile b\/Makefile/' > /tmp/prepared.patch
          git apply --check /tmp/prepared.patch
          git apply /tmp/prepared.patch
          test -n "$GENERATED_LOCK"
          test -n "$GENERATED_SCHEMA"
          printf '%s' "$GENERATED_LOCK" | base64 --decode > Cargo.lock
          printf '%s' "$GENERATED_SCHEMA" | base64 --decode > contracts/generated/domain-v1.openapi.json
          # Do not run Cargo, npm, Python, tests or repository scripts with write permission.
          git diff --exit-code -- .github/workflows .github/updates
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: remove legacy implementations and adopt verified Rust-native components' -m 'Apply executor-prepared source, directory renames and regression fixes. No production credentials, compatibility service or completion claim. Development lock generated with native Cargo; final acceptance must validate the new committed Head separately.'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD
