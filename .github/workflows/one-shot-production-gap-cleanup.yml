name: One-shot production gap cleanup

on:
  push:
    branches:
      - docs/production-gap-register
    paths:
      - .github/workflows/one-shot-production-gap-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/production-gap-register
          fetch-depth: 0
      - name: Correct final documentation details
        run: |
          python -c 'from pathlib import Path; p=Path("DESIGN.md"); s=p.read_text(encoding="utf-8"); assert "研穵结果" in s; p.write_text(s.replace("研穵结果", "研究结果", 1), encoding="utf-8"); p=Path("PRODUCTION_GAP_REGISTER.md"); s=p.read_text(encoding="utf-8"); old="从 Idea 到 Charter、Mission DAG、真实数据、Alpha、独立评估、Portfolio Candidate、人工 Paper Approval、Candidate Package、下游 claim、完整 Paper feedback、Forward Evidence、Degradation/Wake-up 全链路自动完成。"; new="从 Idea 到 Charter、Mission DAG、真实数据、Alpha、独立评估、Portfolio Candidate、Candidate Package、人工 Paper Approval、下游 claim、完整 Paper feedback、Forward Evidence、Degradation/Wake-up 全链路自动完成。"; assert old in s; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
      - name: Commit cleanup and remove one-shot workflow
        run: |
          git config user.name "QuaZonai Documentation Bot"
          git config user.email "quazonai-docs@users.noreply.github.com"
          git add DESIGN.md PRODUCTION_GAP_REGISTER.md
          git rm .github/workflows/one-shot-production-gap-cleanup.yml
          git commit -m "docs: correct production closure wording"
          git push origin HEAD:docs/production-gap-register
