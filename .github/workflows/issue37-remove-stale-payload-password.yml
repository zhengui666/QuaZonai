name: Issue 37 Remove Stale Payload Password

on:
  pull_request:
    paths:
      - '.github/scripts/issue37_remove_stale_payload_password.py'
      - '.github/workflows/issue37-remove-stale-payload-password.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove stale TOTP helper password arguments
        run: python .github/scripts/issue37_remove_stale_payload_password.py
      - name: Remove one-shot fixer
        run: rm .github/scripts/issue37_remove_stale_payload_password.py .github/workflows/issue37-remove-stale-payload-password.yml
      - name: Commit cleanup
        run: |
          git config user.name 'QuaZonai CI Finalizer'
          git config user.email 'quazonai-ci@localhost'
          git add -A
          git commit -m 'test(auth): remove stale TOTP payload password arguments'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
