name: Native scientific image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-and-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/container
        with:
          image: quazonai-native-check:${{ github.sha }}
          revision: ${{ github.sha }}
          version: native-check
