name: Native Runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-runtime:
    name: Runtime / real Docker, compile, recovery and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: ghcr.io/pgmq/pg18-pgmq@sha256:bfb3537068ce453609744518ece92b178ac89dff53747d47ca6fab91c2fc66a6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-runtime-ci-only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact source before executing repository code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/runtime-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/runtime-evidence/tested-commit.txt"
          docker version > "$RUNNER_TEMP/runtime-evidence/docker-version.txt"
          docker info --format '{{json .CgroupVersion}}' > "$RUNNER_TEMP/runtime-evidence/cgroup-version.json"
      - name: Build locked native job, Runtime and Worker with the native Wasm target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup run "$RUSTUP_TOOLCHAIN" rustc -Vv > "$RUNNER_TEMP/runtime-evidence/rustc.txt"
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all -- --check
          rustup run "$RUSTUP_TOOLCHAIN" cargo clippy --locked -p runtime --all-targets --features native-oci -- -D warnings
          rustup run "$RUSTUP_TOOLCHAIN" cargo build --locked -p runtime -p job -p server --bin runtime --bin job --bin server
          rustup run "$RUSTUP_TOOLCHAIN" rustc --edition=2021 -D warnings -C opt-level=1 -C debuginfo=0 -C strip=symbols tests/native/oci_probe.rs -o "$RUNNER_TEMP/isolation-probe"
          git diff --exit-code
      - name: Assemble a native immutable OCI image without a floating base or secret mounts
        run: |
          set -euo pipefail
          node runtimes/native/build-native-image.mjs --profile debug --output-dir "$RUNNER_TEMP/native-job-image" --isolation-probe "$RUNNER_TEMP/isolation-probe"
          image=$(cat "$RUNNER_TEMP/native-job-image/image-id.txt")
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "QUAZONAI_NATIVE_JOB_IMAGE=$image" >> "$GITHUB_ENV"
          echo 'QUAZONAI_DOCKER_SOCKET=/var/run/docker.sock' >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/native-job-image/result.json" "$RUNNER_TEMP/runtime-evidence/image-build.json"
          docker image inspect --format '{{json .Id}}' "$image" > "$RUNNER_TEMP/runtime-evidence/native-image-id.json"
      - name: Execute actual native OCI lifecycle, cold restore and kernel limits
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p runtime --features native-oci --test native_oci -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/runtime-evidence/native-oci-tests.log"
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p runtime --features native-oci --test native_restore -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/runtime-evidence/native-restore-tests.log"
      - name: Restore one real control and Runtime checkpoint through the Worker CLI
        env:
          DATABASE_URL: postgresql://postgres:native-runtime-ci-only@127.0.0.1:55435/postgres
          QZ_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          QUAZONAI_NATIVE_SERVER_BIN: ${{ github.workspace }}/target/debug/server
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo test --locked -p runtime --features native-oci --test native_control_restore -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/runtime-evidence/native-control-restore-tests.log"
          rustup run "$RUSTUP_TOOLCHAIN" cargo run --locked -q -p runtime -- openapi > "$RUNNER_TEMP/runtime-evidence/runtime-v1.openapi.json"
          diff -u contracts/generated/runtime-v1.openapi.json "$RUNNER_TEMP/runtime-evidence/runtime-v1.openapi.json"
          git diff --exit-code
      - name: Record exact evidence scope without substituting for whole-product acceptance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-evidence"
          cp Cargo.lock "$RUNNER_TEMP/runtime-evidence/Cargo.lock"
          printf '%s\n' 'Native Runtime/job and quiescent control/Runtime checkpoint only. No skipped prerequisites count as success. Account/model, active-job recovery, research/qualification/delivery and complete T01-T42 acceptance remain separate.' > "$RUNNER_TEMP/runtime-evidence/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-evidence-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/runtime-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this job's immutable test image after native fixture cleanup
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/native-job-image/image-id.txt"; then
            image=$(cat "$RUNNER_TEMP/native-job-image/image-id.txt")
            [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker image rm "$image"
          fi
  # Temporary exact-file/lock materialization; removed before delivery.
  authored-source:
    name: Draft / native format and test dependency lock
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Apply the exact authored helper move and native formatter
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/joint-source"
          git apply --check .github/joint-archive.patch
          git apply .github/joint-archive.patch
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all
          rustup run "$RUSTUP_TOOLCHAIN" cargo metadata --format-version 1 --all-features > "$RUNNER_TEMP/joint-source/metadata.json"
          git diff HEAD > "$RUNNER_TEMP/joint-source/applied.diff"
          git diff --check
      - name: Stage source candidates without committing or updating a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          const paths = ['Cargo.lock', 'apps/runtime/Cargo.toml', 'apps/runtime/tests/native_control_restore.rs', 'apps/runtime/tests/native_restore.rs', 'apps/runtime/tests/support/archive.rs'];
          const changes = execFileSync('git', ['diff', '--name-only', '-z', 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          if (changes.some(path => !paths.includes(path))) throw new Error('Unexpected authored-file changes');
          const entries = [];
          for (const path of paths) {
            const content = await readFile(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (response.status !== 201) throw new Error(`Native file staging failed: HTTP ${response.status}`);
            const blob = await response.json();
            entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            const output = `${process.env.RUNNER_TEMP}/joint-source/files/${path}`;
            await mkdir(dirname(output), { recursive: true });
            await writeFile(output, content);
          }
          await writeFile(`${process.env.RUNNER_TEMP}/joint-source/entries.json`, JSON.stringify({ source_head: process.env.EXPECTED_HEAD, entries }, null, 2) + '\n');
          NODE
      - name: Compile the authored native test target against the actual lock
        run: |
          set -euo pipefail
          rustup run "$RUSTUP_TOOLCHAIN" cargo check --locked -p runtime --all-targets --features native-oci --message-format=json > "$RUNNER_TEMP/joint-source/compiler.jsonl"
          git diff HEAD > "$RUNNER_TEMP/joint-source/after-check.diff"
          cmp "$RUNNER_TEMP/joint-source/applied.diff" "$RUNNER_TEMP/joint-source/after-check.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-source-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/joint-source/
          if-no-files-found: error
          retention-days: 7
