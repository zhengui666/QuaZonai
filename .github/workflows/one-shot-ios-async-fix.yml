name: One-shot iOS async condition fix

on:
  push:
    branches:
      - feat/ios-ipados-universal-app
    paths:
      - '.github/workflows/one-shot-ios-async-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ios-ipados-universal-app
          fetch-depth: 0
      - name: Rewrite async boolean conditions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('ios/QuaZonai/Features/AdministrationViews.swift'): [
                  (
                      '        if (!apiKey.isEmpty || clearAPIKey) && !(await BiometricGate.authorize(reason: "Change the Codex provider credential")) { error = "Biometric confirmation was not completed."; return }',
                      '        if !apiKey.isEmpty || clearAPIKey {\n            guard await BiometricGate.authorize(reason: "Change the Codex provider credential") else {\n                error = "Biometric confirmation was not completed."\n                return\n            }\n        }',
                  ),
                  (
                      '        if environment == "LIVE" && !(await BiometricGate.authorize(reason: "Register a Live downstream")) { error = "Biometric confirmation was not completed."; return }',
                      '        if environment == "LIVE" {\n            guard await BiometricGate.authorize(reason: "Register a Live downstream") else {\n                error = "Biometric confirmation was not completed."\n                return\n            }\n        }',
                  ),
              ],
              Path('ios/QuaZonai/Features/ApprovalHandoffViews.swift'): [
                  (
                      '        if purpose == "LIVE" && !(await BiometricGate.authorize(reason: "Approve a Live handoff candidate")) { error = "Biometric confirmation was not completed."; return }',
                      '        if purpose == "LIVE" {\n            guard await BiometricGate.authorize(reason: "Approve a Live handoff candidate") else {\n                error = "Biometric confirmation was not completed."\n                return\n            }\n        }',
                  ),
              ],
          }

          for path, items in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exactly one match in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit exact source fix
        run: |
          git config user.name 'QuaZonai CI'
          git config user.email 'actions@users.noreply.github.com'
          git add ios/QuaZonai/Features/AdministrationViews.swift ios/QuaZonai/Features/ApprovalHandoffViews.swift
          git commit -m 'fix: await biometric gates outside boolean autoclosures'
          git push origin HEAD:feat/ios-ipados-universal-app
