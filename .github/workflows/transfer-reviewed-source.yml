name: Temporary source recovery
on:
  pull_request:
    paths: ['.github/workflows/transfer-reviewed-source.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: 183b2a591d948298502833394fe66536e0981868
      SOURCE_TREE: 12be492cfd0c07681e1caab5fe8f93a1f8417e86
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Recover existing public source and previous patch, without executing either
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-recovery
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          git archive "$SOURCE_COMMIT" | gzip > /tmp/source-recovery/source.tar.gz
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/source-recovery/source-commit.txt
          printf '%s\n' "$SOURCE_TREE" > /tmp/source-recovery/source-tree.txt
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/f1def1a529c6770327a6d859b9a5debcbb0cb2fa" --jq .content | base64 --decode > /tmp/source-recovery/prior.patch.xz
          test "$(wc -c < /tmp/source-recovery/prior.patch.xz)" -eq 11640
          xz --decompress --stdout /tmp/source-recovery/prior.patch.xz > /tmp/source-recovery/prior.patch
          test "$(wc -c < /tmp/source-recovery/prior.patch)" -eq 45653
          printf 'Existing public repository source and prior candidate only; comparison inputs, not validation or acceptance. No accounts, home, data or secrets. No product refs changed.\n' > /tmp/source-recovery/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-recovery-${{ github.event.pull_request.head.sha }}
          path: /tmp/source-recovery/
          retention-days: 1
          if-no-files-found: error
