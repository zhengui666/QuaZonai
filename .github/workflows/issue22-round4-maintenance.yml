name: Issue 22 round4 maintenance

on:
  push:
    branches:
      - feat/issue-22-remote-nautilus-runtime
    paths:
      - tools/issue22_round4_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-22-remote-nautilus-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply transparent reviewed patch
        run: |
          python tools/issue22_round4_patch.py
          rm -f tools/issue22_round4_patch.py .github/workflows/issue22-round4-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): close final codex review findings"
          git push origin HEAD:feat/issue-22-remote-nautilus-runtime
