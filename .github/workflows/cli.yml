name: Linux Node CLI
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
      NODE_VERSION: '22.19.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/cli/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch the official pinned Linux runtime, not a custom executable
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/node.tar.gz" "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/node.tar.gz" -C "$RUNNER_TEMP"
      - name: Package JS/dependencies and execute the extracted distribution
        run: |
          python -B deploy/package.py pack-cli --runtime "$RUNNER_TEMP/node-v$NODE_VERSION-linux-x64" \
            --platform linux-x86_64 --version "$VERSION" --revision "$REVISION" --output "$RUNNER_TEMP/cli-assets"
          python -B deploy/package.py smoke-cli --archive "$RUNNER_TEMP/cli-assets/quazonai-cli-linux-x86_64.tar.gz" \
            --platform linux-x86_64 --version "$VERSION"
      - name: Linux installer with the real archive and no host Node
        env:
          QZ_TEST_CLI_ARCHIVE: ${{ runner.temp }}/cli-assets/quazonai-cli-linux-x86_64.tar.gz
          QZ_TEST_CLI_VERSION: ${{ inputs.version }}
        run: node --test deploy/install.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-${{ inputs.version }}-linux-x86_64
          path: ${{ runner.temp }}/cli-assets/
          retention-days: 14
          if-no-files-found: error
