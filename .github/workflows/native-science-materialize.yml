name: Native science source materialization
on:
  pull_request:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  RUSTUP_TOOLCHAIN: '1.98.1'
jobs:
  materialize:
    if: github.head_ref == 'codex/native-science-feedback-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Generate only native lock and formatting
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup run "$RUSTUP_TOOLCHAIN" cargo generate-lockfile
          rustup run "$RUSTUP_TOOLCHAIN" cargo fmt --all
          git diff --check
          changed=$(git diff --name-only | sort)
          printf '%s\n' "$changed"
          test "$changed" = $'Cargo.lock\napps/runtime/tests/native_research_loop.rs'
      - name: Stage generated blobs without modifying a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          for (const path of ['Cargo.lock', 'apps/runtime/tests/native_research_loop.rs']) {
            const content = await readFile(path, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (response.status !== 201) throw new Error(`blob staging failed: ${response.status}`);
            const blob = await response.json();
            console.log(`STAGED_BLOB ${path} ${blob.sha}`);
          }
          NODE
