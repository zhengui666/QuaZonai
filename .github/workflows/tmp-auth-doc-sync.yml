name: One-time operator-auth documentation sync

on:
  push:
    branches:
      - feat/operator-totp-auth

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-totp-auth
          fetch-depth: 0
      - name: Normalize remaining opt-in wording
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "DESIGN.md",
              "- 成功登录签发短期 browser session cookie。勾选 **Trust this browser** 时另外签发长期 trusted-browser cookie；两者都使用独立 `QUAZONAI_AUTH_COOKIE_KEY` 做 AES-256-GCM authenticated encryption，Cookie 必须 `HttpOnly`、`SameSite=Strict`，production 必须 `Secure`，不能把 bearer credential 放入 `localStorage`/`sessionStorage`；",
              "- 成功登录签发短期 browser session cookie。勾选 **Trust this browser** 时另外签发长期 trusted-browser cookie；两者都使用独立 `QUAZONAI_AUTH_COOKIE_KEY` 做 AES-256-GCM authenticated encryption，Cookie 必须 `HttpOnly`、`SameSite=Strict`，启用认证的 production 必须自动标记 `Secure`，不能把 bearer credential 放入 `localStorage`/`sessionStorage`；",
          )
          replace_once(
              "DESIGN.md",
              "- browser cookie 认证的 unsafe request 必须通过同源校验，production 使用 `QUAZONAI_AUTH_PUBLIC_ORIGIN` 作为准确 Origin；`SameSite=Strict` 不是唯一 CSRF 控制；",
              "- browser cookie 认证的 unsafe request 必须与 `QUAZONAI_AUTH_PUBLIC_ORIGIN` 做精确同源校验；启用认证的 production origin 必须使用 HTTPS；`SameSite=Strict` 不是唯一 CSRF 控制；",
          )
          replace_once(
              "DESIGN.md",
              "- `/api/v1/system/health` 保持 public 供容器/orchestrator healthcheck；`/api/v1/auth/login` 与 session bootstrap 属于认证入口；其余 Operator API 要求有效 browser credential 或 `Authorization: Bearer <QUAZONAI_API_TOKEN>`；",
              "- `/api/v1/system/health` 保持 public 供容器/orchestrator healthcheck；`/api/v1/auth/login` 与 session bootstrap 属于认证入口；Operator Authentication 启用时，其余 Operator API 要求有效 browser credential 或 `Authorization: Bearer <QUAZONAI_API_TOKEN>`；关闭时保留 direct access；",
          )
          replace_once(
              "OPERATIONS.md",
              "`.env` 只负责启动级基础设施与 Operator access：运行环境、PostgreSQL、master key、Operator username/password/TOTP、browser cookie key、CLI machine token、public origin、存储根目录和 HTTP port。",
              "`.env` 只负责启动级基础设施与 Operator access：运行环境、PostgreSQL、master key、`QUAZONAI_AUTH_ENABLED`、Operator username/password/TOTP、browser cookie key、CLI machine token、public origin、存储根目录和 HTTP port。",
          )
          replace_once(
              "OPERATIONS.md",
              "CLI/automation 不使用 Web cookie、密码或 TOTP，而是从环境读取 `QUAZONAI_API_TOKEN`。Downstream consumer 的 Bearer service token 仍独立，只能操作其自身 Handoff/Feedback 合同。",
              "Operator Authentication 启用时，CLI/automation 不使用 Web cookie、密码或 TOTP，而是从环境读取 `QUAZONAI_API_TOKEN`；认证关闭时不要求该 token。Downstream consumer 的 Bearer service token 仍独立，只能操作其自身 Handoff/Feedback 合同。",
          )
          replace_once(
              "CLI.md",
              "Local human / automation\n  → quazonai CLI\n  → QUAZONAI_API_TOKEN Bearer credential",
              "Local human / automation\n  → quazonai CLI\n  → QUAZONAI_API_TOKEN Bearer credential when auth is enabled",
          )
      - name: Commit normalized documentation
        shell: bash
        run: |
          if git diff --quiet -- DESIGN.md OPERATIONS.md CLI.md; then
            echo "Documentation already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md OPERATIONS.md CLI.md
          git commit -m "docs(auth): normalize remaining opt-in wording"
          git push origin HEAD:feat/operator-totp-auth
