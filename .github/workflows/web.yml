name: Web console
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/service/package-lock.json
            apps/research/package-lock.json
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/service --ignore-scripts --no-audit --no-fund
      - run: make check-web
      - run: node apps/web/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
        env:
          PI_SCRATCH_DIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: web-browser-${{ github.sha }}
          path: ${{ runner.temp }}/quazonai-web-playwright/
          if-no-files-found: ignore
          retention-days: 7
