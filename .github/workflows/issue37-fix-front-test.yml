name: Issue 37 Front Test Fix

on:
  pull_request:
    paths:
      - '.github/scripts/issue37_fix_front_test.py'
      - '.github/workflows/issue37-fix-front-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix stale login body assertion
        run: python .github/scripts/issue37_fix_front_test.py
      - name: Remove one-shot fixer
        run: rm .github/scripts/issue37_fix_front_test.py .github/workflows/issue37-fix-front-test.yml
      - name: Commit fix
        run: |
          git config user.name 'QuaZonai CI Finalizer'
          git config user.email 'quazonai-ci@localhost'
          git add -A
          git commit -m 'test(auth): assert TOTP-only login payload'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
