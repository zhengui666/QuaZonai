name: Apply prepared review fixes (one-time development)

on:
  pull_request:
    paths:
      - '.github/workflows/apply-review-fixes.yml'
      - '.github/changes/review-*.gzpart'

permissions:
  contents: write

jobs:
  publish-fixed-patch:
    if: >-
      github.event.pull_request.number == 63 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Publish only the exact executor-prepared patch using native Git
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # No application code, build scripts, model calls or production secrets
          # run in this write-capable job. It only applies a fixed native patch.
          git config core.hooksPath /dev/null
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = '4cb71a4330d39caf67739ef453b9ae5ebeb0bd1f'
          cat .github/changes/review-{01,02,03,04,05,06}.gzpart > /tmp/review.patch.gz
          test "$(git hash-object /tmp/review.patch.gz)" = 'a507b55cff15f7fc30238e6e8c144d4b9d28dbd3'
          gzip --decompress --stdout /tmp/review.patch.gz > /tmp/review.patch
          test "$(git hash-object /tmp/review.patch)" = 'c7fad0936c05e6b019d5eef38c9fce3e6f08a5c7'
          cat > /tmp/allowed-paths <<'PATHS'
          DESIGN.md
          contracts/generated/domain-v1.openapi.json
          crates/contracts/src/scalars.rs
          crates/contracts/tests/wire.rs
          crates/domain/src/admission.rs
          crates/domain/src/evidence.rs
          crates/domain/tests/rules.rs
          tests/contracts/decimal-wire.json
          tests/contracts/decimal-wire.mjs
          PATHS
          git apply --numstat /tmp/review.patch | cut -f3 | LC_ALL=C sort > /tmp/patch-paths
          LC_ALL=C sort /tmp/allowed-paths > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/patch-paths
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          git diff --check
          git diff --exit-code -- Cargo.toml Cargo.lock
          while IFS= read -r path; do git add -- "$path"; done < /tmp/allowed-paths
          git diff --cached --name-only | LC_ALL=C sort > /tmp/staged-paths
          diff -u /tmp/expected-paths /tmp/staged-paths
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'fix(review): account model budgets and enforce evidence contracts' -m 'Apply executor-prepared source and tests with native Git. Preserve the committed dependency lock. Verify this resulting Head independently in read-only CI; no full-system acceptance is claimed.'
          # Normal fast-forward push refuses concurrent branch changes.
          git push origin HEAD:refs/heads/rewrite/issue-62-rust-evidence
          git rev-parse HEAD
