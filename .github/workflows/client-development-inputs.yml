name: Temporary native client development inputs
on:
  pull_request:
    paths: ['.github/workflows/client-development-inputs.yml']
permissions:
  contents: read
jobs:
  public-inputs:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rewrite/issue-62-rust-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build pinned public Rust generator and inspect current OpenAPI without changing the checkout
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          mkdir -p /tmp/client-export /tmp/client-inspect/src
          cargo +1.98.0 install --locked --version '=0.8.0' --root /tmp/client-generator openapi-to-rust
          cp /tmp/client-generator/bin/openapi-to-rust /tmp/client-export/
          /tmp/client-generator/bin/openapi-to-rust --version | tee /tmp/client-export/generator-version.txt
          cp contracts/generated/api-v2.openapi.json /tmp/client-inspect/api.json
          cat > /tmp/client-inspect/openapi-to-rust.toml <<'TOML'
          [generator]
          spec_path = 'api.json'
          output_dir = 'src/generated'
          module_name = 'api'
          [features]
          enable_async_client = true
          enable_sse_client = true
          [http_client]
          base_url = 'https://localhost.invalid'
          timeout_seconds = 30
          max_response_body_bytes = 8388608
          [http_client.retry]
          max_retries = 0
          [http_client.auth]
          type = 'Bearer'
          header_name = 'Authorization'
          TOML
          cd /tmp/client-inspect
          /tmp/client-generator/bin/openapi-to-rust generate --config openapi-to-rust.toml
          cat > Cargo.toml <<'TOML'
          [package]
          name = 'client-inspection'
          version = '0.0.0'
          edition = '2024'
          rust-version = '1.98'
          publish = false
          TOML
          cat src/generated/REQUIRED_DEPS.toml >> Cargo.toml
          printf 'pub mod generated;\n' > src/lib.rs
          cargo +1.98.0 check
          cargo +1.98.0 vendor --locked /tmp/client-vendor > /tmp/client-export/vendor-config.toml
          tar -czf /tmp/client-export/public-client-vendor.tar.gz -C /tmp client-vendor
          cp Cargo.toml Cargo.lock /tmp/client-export/
          tar -czf /tmp/client-export/generated-inspection.tar.gz src openapi-to-rust.toml
          printf 'PUBLIC DEVELOPMENT INPUTS ONLY: pinned generator and generated-client compile inspection; no product source changes or acceptance claims. No account home, credentials, secrets, user data or production database exported.\n' > /tmp/client-export/SCOPE.txt
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > /tmp/client-export/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-client-inputs-${{ github.event.pull_request.head.sha }}
          path: /tmp/client-export/
          retention-days: 1
          if-no-files-found: error
