name: Temporary public web development inputs
on:
  pull_request:
    paths: ['.github/workflows/web-development-inputs.yml']
permissions:
  contents: read
jobs:
  public-web:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact public client packages and verify the generator API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/web-inputs/package /tmp/web-export
          cd /tmp/web-inputs/package
          cat > package.json <<'JSON'
          {"name":"@quazonai/web","version":"2.0.0-dev.1","private":true,"type":"module","license":"SEE LICENSE IN ../../LICENSE","dependencies":{"@ant-design/icons":"6.3.4","@tanstack/react-query":"5.102.8","antd":"6.6.2","openapi-fetch":"0.17.0","react":"19.2.8","react-dom":"19.2.8"},"devDependencies":{"@axe-core/playwright":"4.13.0","@playwright/test":"1.63.0","@types/react":"19.2.18","@types/react-dom":"19.2.7","@vitejs/plugin-react":"6.1.1","openapi-typescript":"7.13.0","typescript":"5.9.3","vite":"8.2.2","vite-plugin-pwa":"1.3.0"}}
          JSON
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --json > /tmp/web-export/versions.json
          node --input-type=module -e 'import ts from "typescript"; if(!ts.factory || ts.version!=="5.9.3") process.exit(1);'
          ./node_modules/.bin/openapi-typescript --version > /tmp/web-export/generator-version.txt
          cp package.json package-lock.json /tmp/web-export/
          tar -czf /tmp/web-export/public-web-modules.tar.gz node_modules
          printf 'Public native package sources and dependency lock only. Not application acceptance. No user home, accounts, environment, databases or secrets. Remove helper after retrieval.\n' > /tmp/web-export/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-development-inputs-${{ github.event.pull_request.head.sha }}
          path: /tmp/web-export/
          retention-days: 1
          if-no-files-found: error
