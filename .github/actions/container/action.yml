name: Verify production container
description: Assemble the application and separate remote Nautilus image from one native build, then run HTTP science and stopped-state acceptance.
inputs:
  source:
    description: Source checkout directory
    default: '.'
  image:
    description: Local app image name
    required: true
  revision:
    description: Exact checkout revision
    required: true
  version:
    description: OCI version label
    required: true
  native-artifact-directory:
    description: Tested job/source-tools directory; empty only for manual source builds
    default: ''
outputs:
  runtime-image:
    description: Tested remote Nautilus image
    value: ${{ steps.native.outputs.image }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22.19.0'
        cache: npm
        cache-dependency-path: |
          ${{ inputs.source }}/apps/service/package-lock.json
          ${{ inputs.source }}/apps/research/package-lock.json
          ${{ inputs.source }}/apps/cli/package-lock.json
    - shell: bash
      working-directory: ${{ inputs.source }}
      env:
        EXPECTED_HEAD: ${{ inputs.revision }}
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
        npm ci --prefix apps/service --no-audit --no-fund
        npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
        npm ci --prefix apps/cli --ignore-scripts --no-audit --no-fund
        make check-deploy
        rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      if: inputs.native-artifact-directory == ''
      with:
        prefix-key: quazonai-science-v2
        key: ubuntu-22-release
        workspaces: ${{ inputs.source }} -> target
        cache-bin: false
        cache-workspace-crates: false
    - id: artifacts
      shell: bash
      working-directory: ${{ inputs.source }}
      env:
        NATIVE_DIRECTORY: ${{ inputs.native-artifact-directory }}
        EXPECTED_HEAD: ${{ inputs.revision }}
        CARGO_BUILD_JOBS: '2'
      run: |
        if [[ -z "$NATIVE_DIRECTORY" ]]; then
          NATIVE_DIRECTORY="$RUNNER_TEMP/native-artifacts"
          bash deploy/docker/native-build.sh release "$NATIVE_DIRECTORY"
          QZ_JOB_BINARY="$NATIVE_DIRECTORY/job" make check-core
        else
          test "$(cat "$NATIVE_DIRECTORY/tested-revision")" = "$EXPECTED_HEAD"
        fi
        echo "directory=$NATIVE_DIRECTORY" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      id: builder
    - id: assembly
      shell: bash
      working-directory: ${{ inputs.source }}
      env:
        JOB_BINARY: ${{ steps.artifacts.outputs.directory }}/job
      run: |
        node runtimes/native/build-native-image.mjs --job-binary "$JOB_BINARY" --profile release \
          --prepare-only --output-dir "$RUNNER_TEMP/scientific-image"
        echo "compiler=$RUNNER_TEMP/scientific-image/context/native-root" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        builder: ${{ steps.builder.outputs.name }}
        context: ${{ inputs.source }}
        file: ${{ inputs.source }}/deploy/docker/Dockerfile
        target: nautilus
        build-contexts: |
          native=${{ steps.artifacts.outputs.directory }}
          compiler=${{ steps.assembly.outputs.compiler }}
        platforms: linux/amd64
        load: true
        tags: quazonai-nautilus:${{ inputs.revision }}
        build-args: |
          VERSION=${{ inputs.version }}
          REVISION=${{ inputs.revision }}
        cache-from: type=gha,scope=quazonai-nautilus
        cache-to: type=gha,mode=max,scope=quazonai-nautilus
    - id: native
      shell: bash
      run: echo "image=quazonai-nautilus:${{ inputs.revision }}" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        builder: ${{ steps.builder.outputs.name }}
        context: ${{ inputs.source }}
        file: ${{ inputs.source }}/deploy/docker/Dockerfile
        target: application
        platforms: linux/amd64
        load: true
        tags: ${{ inputs.image }}
        build-args: |
          VERSION=${{ inputs.version }}
          REVISION=${{ inputs.revision }}
        cache-from: type=gha,scope=quazonai-node
        cache-to: type=gha,mode=max,scope=quazonai-node
    - name: Actual application setup/login, restart, update and stopped backup/restore
      shell: bash
      working-directory: ${{ inputs.source }}
      env:
        APP_IMAGE: ${{ inputs.image }}
        RUNTIME_IMAGE: ${{ steps.native.outputs.image }}
        REVISION: ${{ inputs.revision }}
        NATIVE_DIRECTORY: ${{ steps.artifacts.outputs.directory }}
      run: python3 -B deploy/docker/smoke.py --image "$APP_IMAGE" --runtime-image "$RUNTIME_IMAGE" --revision "$REVISION" --native-directory "$NATIVE_DIRECTORY"
