name: Verify production container
description: Assemble only the application image; native environments are installed and managed separately by the owner.
inputs:
  source:
    description: Source checkout directory
    default: '.'
  image:
    description: Local app image name
    required: true
  revision:
    description: Exact checkout revision
    required: true
  version:
    description: OCI version label
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22.19.0'
        cache: npm
        cache-dependency-path: |
          ${{ inputs.source }}/apps/service/package-lock.json
          ${{ inputs.source }}/apps/research/package-lock.json
          ${{ inputs.source }}/apps/cli/package-lock.json
    - shell: bash
      working-directory: ${{ inputs.source }}
      env:
        EXPECTED_HEAD: ${{ inputs.revision }}
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
        npm ci --prefix apps/service --no-audit --no-fund
        npm ci --prefix apps/research --ignore-scripts --no-audit --no-fund
        npm ci --prefix apps/cli --ignore-scripts --no-audit --no-fund
        make check-deploy
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      id: builder
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        builder: ${{ steps.builder.outputs.name }}
        context: ${{ inputs.source }}
        file: ${{ inputs.source }}/deploy/docker/Dockerfile
        target: application
        platforms: linux/amd64
        load: true
        tags: ${{ inputs.image }}
        build-args: |
          VERSION=${{ inputs.version }}
          REVISION=${{ inputs.revision }}
        cache-from: type=gha,scope=quazonai-node
        cache-to: type=gha,mode=max,scope=quazonai-node
