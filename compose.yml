name: quazonai

x-core-env: &core-env
  QUAZONAI_ENV: ${QUAZONAI_ENV:-development}
  QUAZONAI_DATABASE_URL: ${QUAZONAI_DATABASE_URL:-postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai}
  QUAZONAI_ALEMBIC_URL: ${QUAZONAI_ALEMBIC_URL:-postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai}
  QUAZONAI_MASTER_KEY: ${QUAZONAI_MASTER_KEY:-}
  QUAZONAI_PLUGIN_ROOT: /var/lib/quazonai/plugins
  QUAZONAI_PACKAGE_ROOT: /var/lib/quazonai/packages
  QUAZONAI_MISSION_ROOT: /var/lib/quazonai/missions
  QUAZONAI_FRONTEND_DIST: /workspace/frontend-dist
  CODEX_HOME: /home/quazonai/.codex

x-nautilus-env: &nautilus-env
  QUAZONAI_NAUTILUS_RUNTIME_URL: ${QUAZONAI_NAUTILUS_RUNTIME_URL:-}
  QUAZONAI_NAUTILUS_RUNTIME_TOKEN: ${QUAZONAI_NAUTILUS_RUNTIME_TOKEN:-}
  QUAZONAI_NAUTILUS_SEALED_RUNTIME_URL: ${QUAZONAI_NAUTILUS_SEALED_RUNTIME_URL:-}
  QUAZONAI_NAUTILUS_SEALED_RUNTIME_TOKEN: ${QUAZONAI_NAUTILUS_SEALED_RUNTIME_TOKEN:-}
  QUAZONAI_NAUTILUS_VERSION: ${QUAZONAI_NAUTILUS_VERSION:-1.231.0}
  QUAZONAI_NAUTILUS_CONTRACT_VERSION: ${QUAZONAI_NAUTILUS_CONTRACT_VERSION:-2}
  QUAZONAI_NAUTILUS_RUNTIME_TIMEOUT_SECONDS: ${QUAZONAI_NAUTILUS_RUNTIME_TIMEOUT_SECONDS:-120}
  QUAZONAI_NAUTILUS_RUNTIME_POLL_SECONDS: ${QUAZONAI_NAUTILUS_RUNTIME_POLL_SECONDS:-0.25}
  QUAZONAI_NAUTILUS_RUNTIME_VERIFY_TLS: ${QUAZONAI_NAUTILUS_RUNTIME_VERIFY_TLS:-true}

x-core-service: &core-service
  build:
    context: .
    dockerfile: deploy/Dockerfile.backend
  environment:
    <<: *core-env
  volumes:
    - plugin-data:/var/lib/quazonai/plugins
    - package-data:/var/lib/quazonai/packages
    - mission-data:/var/lib/quazonai/missions
    - codex-data:/home/quazonai/.codex
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${QUAZONAI_POSTGRES_DB:-quazonai}
      POSTGRES_USER: ${QUAZONAI_POSTGRES_USER:-quazonai}
      POSTGRES_PASSWORD: ${QUAZONAI_POSTGRES_PASSWORD:-quazonai-local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *core-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - python -m db.preflight && alembic upgrade head

  api:
    <<: *core-service
    environment:
      <<: [*core-env, *nautilus-env]
      QUAZONAI_AUTH_ENABLED: ${QUAZONAI_AUTH_ENABLED:-false}
      QUAZONAI_AUTH_USERNAME: ${QUAZONAI_AUTH_USERNAME:-}
      QUAZONAI_AUTH_PASSWORD: ${QUAZONAI_AUTH_PASSWORD:-}
      QUAZONAI_AUTH_TOTP_SECRET: ${QUAZONAI_AUTH_TOTP_SECRET:-}
      QUAZONAI_AUTH_COOKIE_KEY: ${QUAZONAI_AUTH_COOKIE_KEY:-}
      QUAZONAI_API_TOKEN: ${QUAZONAI_API_TOKEN:-}
      QUAZONAI_AUTH_PUBLIC_ORIGIN: ${QUAZONAI_AUTH_PUBLIC_ORIGIN:-}
      QUAZONAI_AUTH_SESSION_TTL_SECONDS: ${QUAZONAI_AUTH_SESSION_TTL_SECONDS:-43200}
      QUAZONAI_AUTH_TRUSTED_BROWSER_TTL_DAYS: ${QUAZONAI_AUTH_TRUSTED_BROWSER_TTL_DAYS:-30}
      QUAZONAI_AUTH_TRUSTED_PROXY_CIDRS: ${QUAZONAI_AUTH_TRUSTED_PROXY_CIDRS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "main:create_app", "--factory", "--no-proxy-headers", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${QUAZONAI_HTTP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2));
          raise SystemExit(0 if d.get('live') else 1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  nautilus-runtime-proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nautilus-runtime-proxy.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=2m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - default
      - nautilus-runtime

  finite-worker:
    <<: *core-service
    # Codex's bundled bubblewrap needs user namespaces. Keep the worker
    # unprivileged and use only the checked-in profile that permits those
    # namespace syscalls; the inner Mission sandbox remains mandatory.
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/seccomp/codex-worker.json
    environment:
      <<: [*core-env, *nautilus-env]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - nautilus-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["quazonai-finite-worker"]
    healthcheck:
      test: ["CMD", "quazonai-finite-worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  postgres-data:
  plugin-data:
  package-data:
  mission-data:
  codex-data:

networks:
  nautilus-runtime:
    external: true
    name: quazonai-runtime
