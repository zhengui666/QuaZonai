name: quazonai

x-core-env: &core-env
  QUAZONAI_ENV: ${QUAZONAI_ENV:-development}
  QUAZONAI_DATABASE_URL: ${QUAZONAI_DATABASE_URL:-postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai}
  QUAZONAI_ALEMBIC_URL: ${QUAZONAI_ALEMBIC_URL:-postgresql+psycopg://quazonai:quazonai-local@postgres:5432/quazonai}
  QUAZONAI_MASTER_KEY: ${QUAZONAI_MASTER_KEY:-}
  QUAZONAI_PLUGIN_ROOT: /var/lib/quazonai/plugins
  QUAZONAI_CATALOG_ROOT: /var/lib/quazonai/catalog
  QUAZONAI_REPORT_ROOT: /var/lib/quazonai/reports
  QUAZONAI_IMPORT_ROOT: /var/lib/quazonai/imports
  QUAZONAI_AGENT_ARTIFACT_ROOT: /var/lib/quazonai/agent-artifacts
  QUAZONAI_MAX_PARQUET_UPLOAD_BYTES: ${QUAZONAI_MAX_PARQUET_UPLOAD_BYTES:-10737418240}
  QUAZONAI_JOB_POLL_SECONDS: ${QUAZONAI_JOB_POLL_SECONDS:-1.0}
  QUAZONAI_JOB_LEASE_SECONDS: ${QUAZONAI_JOB_LEASE_SECONDS:-60}
  QUAZONAI_SUPERVISOR_POLL_SECONDS: ${QUAZONAI_SUPERVISOR_POLL_SECONDS:-1.0}

x-core-service: &core-service
  build:
    context: .
    dockerfile: deploy/Dockerfile.backend
  environment:
    <<: *core-env
  volumes:
    - plugin-data:/var/lib/quazonai/plugins
    - catalog-data:/var/lib/quazonai/catalog
    - report-data:/var/lib/quazonai/reports
    - import-data:/var/lib/quazonai/imports
    - agent-artifact-data:/var/lib/quazonai/agent-artifacts
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${QUAZONAI_POSTGRES_DB:-quazonai}
      POSTGRES_USER: ${QUAZONAI_POSTGRES_USER:-quazonai}
      POSTGRES_PASSWORD: ${QUAZONAI_POSTGRES_PASSWORD:-quazonai-local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *core-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - python -m db.preflight && alembic upgrade head

  api:
    <<: *core-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${QUAZONAI_HTTP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2));
          raise SystemExit(0 if d.get('live') else 1)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  finite-worker:
    <<: *core-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["quazonai-finite-worker"]
    healthcheck:
      test: ["CMD", "quazonai-finite-worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  live-supervisor:
    <<: *core-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["quazonai-live-supervisor"]
    healthcheck:
      test: ["CMD", "quazonai-live-supervisor", "--check"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  postgres-data:
  plugin-data:
  catalog-data:
  report-data:
  import-data:
  agent-artifact-data:
